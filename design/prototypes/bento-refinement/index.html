const $=s=>document.querySelector(s), title=n=>titles.find(t=>t.name===n);
const icons={play:'<path d="m7 4 14 8-14 8V4Z" fill="currentColor" stroke="none"/>',search:'<circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/>',bot:'<rect x="4" y="6" width="16" height="13" rx="3"/><path d="M12 3v3M8 11v3m8-3v3M2 10v5m20-5v5"/>',person:'<circle cx="12" cy="8" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/>',left:'<path d="m14 5-7 7 7 7"/>',right:'<path d="m10 5 7 7-7 7"/>'};
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]}</svg>`;
$('#search').innerHTML=svg('search');$('#theme').innerHTML='<svg viewBox="0 0 24 24"><path d="M19.5 15.2A8.5 8.5 0 0 1 8.8 4.5 8.5 8.5 0 1 0 19.5 15.2Z"/></svg>';$('#account').innerHTML=svg('person');
let layout='cinema',page='Home',active='Interstellar',duration=45;
const watching=[{n:'Silo',sub:'S1 E5 · The Janitor',left:'24 min left',p:51},{n:'The Martian',sub:'2015 · Film',left:'42 min left',p:71},{n:'Toy Story 4',sub:'2019 · Film',left:'18 min left',p:82},{n:'Fallout',sub:'S1 E3 · The Head',left:'36 min left',p:35}];
const coming=[{n:'The Odyssey',state:'Downloading · 68%',p:68},{n:'VisionQuest',state:'Queued',p:0},{n:'The Death of Robin Hood',state:'Requested',p:0}];
const oldDescriptions={cinema:'A cinematic first screen: resume your last film, then browse other unfinished titles.',shelf:'A compact Resume card leaves room for a familiar shelf of unfinished films and shows.',queue:'A straightforward watch queue: your latest film first, with everything else in one tidy list.'};
function track(p){return `<div class="track" aria-hidden="true"><i style="width:${p}%"></i></div>`}
function resumeButton(n='Interstellar'){return `<button class="btn primary" data-play="${n}">${svg('play')}Resume</button>`}
function card(n,sub='',progress=null,poster=false){const t=title(n);return `<div class="media-card"><button data-details="${n}" aria-label="${n}, ${sub}"><img src="${poster?t.poster:t.art}" alt="" loading="lazy">${progress!==null?track(progress):''}<span class="media-title">${n}</span><span class="media-sub">${sub||t.year}</span></button></div>`}
function railHead(name,more='',id=''){return `<div class="section-head"><h2>${name}</h2><div class="rail-controls">${more?`<button class="quiet-btn" data-page="${more}">See all</button>`:''}${id?`<div class="arrows"><button aria-label="Scroll ${name} left" data-scroll="${id}" data-dir="-1">${svg('left')}</button><button aria-label="Scroll ${name} right" data-scroll="${id}" data-dir="1">${svg('right')}</button></div>`:''}</div></div>`}
function continueRail(poster=false){return `<section class="shelf-section ${poster?'poster-shelf':''}">${railHead('Continue watching','','continue-rail')}<div class="shelf" id="continue-rail">${watching.map(w=>card(w.n,w.left,w.p,poster)).join('')}</div></section>`}
function comingRail(){return `<section class="shelf-section coming">${railHead('Coming soon','','coming-rail')}<div class="shelf" id="coming-rail">${coming.map(w=>card(w.n,w.state)).join('')}</div></section>`}
function resumeCopy(){let t=title(active),isMovie=t.type==='movie';return `<p class="eyeline">Pick up where you left off</p><h1>${t.name}</h1><p class="meta">${t.year} · ${isMovie?'Film · Sci-fi':'Series · Sci-fi'}</p>${!isMovie?'<p class="episode">S1 E5 · The Janitor</p>':''}<div class="progress-wrap">${track(isMovie?63:51)}<p class="progress-text">${isMovie?'1 h 03 min':'24 min'} left</p></div><div class="actions">${resumeButton(t.name)}<button class="btn secondary" data-details="${t.name}">Details</button></div>`}
const descriptions={cinema:'The current bento character, with four useful tiles and one clear place to start.',shelf:'A wider Resume tile, then a smaller bento of unfinished titles, arrivals and NutBot.'};
const navIcons={Home:'<path d="m3 11 9-8 9 8M5 10v11h5v-7h4v7h5V10"/>',Movies:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 3v18m8-18v18M4 8h4m-4 8h4m8-8h4m-4 8h4"/>',Shows:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="m8 2 4 5 4-5"/>',Requests:'<path d="M4 4h16v16H4V4Zm0 10h5l2 3h2l2-3h5M12 6v7m-3-3 3 3 3-3"/>',Saved:'<path d="M6 3h12v18l-6-4-6 4V3Z"/>'};
const clockSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l4 2"/></svg>';
const inboxSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4V6Zm0 9h5l2 3h2l2-3h5M12 3v9m-3-3 3 3 3-3"/></svg>';
const botFace='<svg class="bot-face" viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="23" width="58" height="12" rx="2" fill="#a89c89"/><rect x="8" y="9" width="48" height="46" rx="11" fill="#d2cbbd" stroke="#9e927d" stroke-width="3"/><rect x="14" y="15" width="36" height="28" rx="6" fill="#070604" stroke="#706553" stroke-width="2"/><rect x="21" y="24" width="7" height="12" rx="2" fill="#3ed7e6"/><rect x="36" y="24" width="7" height="12" rx="2" fill="#3ed7e6"/><path d="M16 48h6m4 0h6" stroke="#9e927d" stroke-width="2"/><circle cx="48" cy="49" r="2" fill="#35aebc"/></svg>';
function miniWatching(){return watching.map(w=>`<button class="mini-watch" data-play="${w.n}" aria-label="Resume ${w.n}, ${w.left}"><img src="${layout==='cinema'?title(w.n).poster:title(w.n).art}" alt=""><span class="mini-copy"><b>${w.n}</b><small>${w.left}</small>${track(w.p)}</span>${svg('play')}</button>`).join('')}
function bentoHome(){return `<div class="boardboard ${layout==='shelf'?'stacked':'focus'}"><section class="bento-tile board-hero"><img class="hero-photo" src="${title(active).art}" alt=""><p class="tile-cap hero-cap">${clockSvg}Keep watching</p><div class="hero-copy">${resumeCopy()}</div></section><section class="bento-tile board-continue"><div class="section-head"><h2>${clockSvg}In progress</h2><span class="count">${watching.length} titles</span></div><div class="mini-list">${miniWatching()}</div></section>${layout==='cinema'?botTile()+incomingTile():incomingTile()+botTile()}</div>`}
function botTile(){return `<section class="bento-tile board-bot"><div class="bot-top">${botFace}<div><h2>Something else?</h2><p>Tell NutBot what you’re in the mood for.</p></div></div><div class="bot-actions"><button id="nutbot">Ask NutBot</button><button class="bot-mood" id="bot-shortcut">A quick watch</button></div></section>`}
function incomingTile(){return `<section class="bento-tile board-coming"><div class="section-head"><h2>${inboxSvg}Coming soon</h2><div class="arrows"><button aria-label="Scroll arrivals left" data-scroll="coming-list" data-dir="-1">${svg('left')}</button><button aria-label="Scroll arrivals right" data-scroll="coming-list" data-dir="1">${svg('right')}</button></div></div><div class="coming-list" id="coming-list">${coming.map(w=>`<button class="incoming" data-details="${w.n}"><img src="${title(w.n).poster}" alt=""><span><b>${w.n}</b><small>${w.state}</small>${w.p?track(w.p):''}</span></button>`).join('')}</div></section>`}
function continuePage(){return `<div class="queue"><h1 class="queue-heading">Continue watching</h1><section class="queue-list">${[{n:'Interstellar',sub:'2014 · Film',left:'1 h 03 min left',p:63},...watching].map(w=>`<article class="queue-row"><img src="${title(w.n).art}" alt=""><div><h3>${w.n}</h3><p>${w.sub} · ${w.left}</p>${track(w.p)}</div><button class="smallplay" data-play="${w.n}" aria-label="Resume ${w.n}">${svg('play')}</button></article>`).join('')}</section></div>`}
function savedPage(){return `<div class="page-content"><h1 class="library-title">Saved</h1><div class="poster-grid">${['The Martian','Severance','Interstellar'].map(n=>card(n,String(title(n).year),null,true)).join('')}</div></div>`}
function library(type){let isMovie=type==='Movies',latest=isMovie?['Pacific Rim: Uprising','Toy Story 4','The Death of Robin Hood','The Odyssey']:['Silo','VisionQuest','Fallout','Severance'];let all=titles.filter(t=>t.type===(isMovie?'movie':'series'));return `<div class="page-content"><h1 class="library-title">${type}</h1><section class="library-row poster-shelf">${railHead('Recently added','','recent-rail')}<div class="shelf" id="recent-rail">${latest.map(n=>card(n,String(title(n).year),null,true)).join('')}</div></section><section><div class="section-head"><h2>All ${type.toLowerCase()}</h2><button class="quiet-btn" id="sort">A–Z</button></div><div class="poster-grid" id="library-grid">${all.sort((a,b)=>a.name.localeCompare(b.name)).map(t=>card(t.name,String(t.year),null,true)).join('')}</div></section></div>`}
function explore(){const picks=duration===15?['The Wonderfully Weird World of Gumball']:duration===45?['Silo','Fallout','Severance']:['The Martian','Interstellar'];return `<div class="page-content"><h1 class="library-title">Explore</h1><section class="explore-section"><h2>How much time have you got?</h2><div class="filter-bar" role="group" aria-label="Time available">${[15,45,90].map(d=>`<button data-duration="${d}" aria-pressed="${d===duration}">${d} min</button>`).join('')}</div><div class="shelf">${picks.map(n=>card(n,duration===15?'One episode · 12 min':title(n).type==='series'?'One episode':n==='The Martian'?'Continue · 42 min left':'Continue · 1 h 03 min left')).join('')}</div></section><section class="explore-section"><h2>On TV this week</h2><p class="empty-description">A sample of how upcoming episodes would appear.</p>${[{d:'20',day:'Fri',n:'Silo',s:'Next episode · 8 pm'},{d:'22',day:'Sun',n:'Fallout',s:'Next episode · 9 pm'}].map(x=>`<div class="calendar-row"><div class="dateblock">${x.d}<small>Nov · ${x.day}</small></div><p>${x.n}<small>${x.s}</small></p><button class="quiet-btn" data-details="${x.n}">Details</button></div>`).join('')}</section></div>`}
function requests(){return `<div class="page-content"><h1 class="library-title">Requests</h1><p class="empty-description">What’s on the way to your library.</p>${coming.map(w=>`<article class="request-row"><img src="${title(w.n).poster}" alt=""><div><h2>${w.n}</h2>${w.p?track(w.p):''}<p>${w.state}</p></div></article>`).join('')}</div>`}
function render(){
 $('.app-nav').innerHTML=['Home','Movies','Shows','Requests','Saved'].map(n=>`<button data-page="${n}" ${page===n||n==='Home'&&['Continue','Explore'].includes(page)?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${navIcons[n]}</svg><span>${n}</span></button>`).join('');
 $('.section-tabs').innerHTML=['Home','Continue','Explore'].map(n=>`<button data-page="${n}" ${page===n?'aria-current="page"':''}>${n==='Continue'?'Continue watching':n}</button>`).join('');
 $('#content').innerHTML=page==='Home'?bentoHome():page==='Explore'?explore():page==='Requests'?requests():page==='Continue'?continuePage():page==='Saved'?savedPage():library(page);
}
let previousFocus=null;function modal(content){previousFocus=document.activeElement;$('#overlays').innerHTML=`<div class="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="Prototype preview">${content}</section></div>`;$('#overlays .close')?.focus()}
const close=()=>{$('#overlays').innerHTML='';if(previousFocus?.isConnected)previousFocus.focus()};
function details(n){const t=title(n);modal(`<div class="dialog-head"><h2>${n}</h2><button class="close" aria-label="Close">×</button></div><img src="${t.art}" alt=""><p>${t.year} · ${t.type==='movie'?'Film':'Series'}</p><p>This is a layout preview. Title details and real playback would open here in the finished app.</p><button class="btn primary" data-play="${n}">${svg('play')}Preview Play</button>`)}
function search(){modal(`<div class="dialog-head"><h2>Search your library</h2><button class="close" aria-label="Close">×</button></div><div class="search-box"><input id="query" aria-label="Film or show name" placeholder="Films and shows…" autocomplete="off"></div><div id="search-results"></div>`);$('#query').focus()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.layout){layout=b.dataset.layout;page='Home';document.querySelectorAll('[data-layout]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#direction-copy').textContent=descriptions[layout];render()}
 if(b.dataset.page){page=b.dataset.page;render()}
 if(b.dataset.duration){duration=Number(b.dataset.duration);render()}
 if(b.dataset.scroll)document.getElementById(b.dataset.scroll).scrollBy({left:Number(b.dataset.dir)*330,behavior:'auto'});
 if(b.dataset.details)details(b.dataset.details);
 if(b.dataset.play){const t=title(b.dataset.play);modal(`<div class="dialog-head"><h2>${t.name}</h2><button class="close" aria-label="Close">×</button></div><img src="${t.art}" alt=""><p>Resume selected. This prototype does not start a real video or change your watch progress.</p><button class="btn secondary close">Back to browsing</button>`)}
 if(b.id==='search')search();if(b.id==='theme')$('#screen').classList.toggle('light');
 if(b.id==='bot-shortcut'){page='Explore';render()}if(b.id==='nutbot'){modal(`<div class="dialog-head"><h2>NutBot</h2><button class="close" aria-label="Close">×</button></div><div class="bot-chat">What are you in the mood for?</div><div class="search-box"><input aria-label="Message to NutBot" id="bot-message" placeholder="Something funny, under 90 minutes…"><button class="btn secondary" id="bot-send">Send</button></div>`)}
 if(b.id==='bot-send'){$('.bot-chat').textContent='For a lighter watch, try Toy Story 4. In the finished app I can suggest something from your library or help request it.'}
 if(b.id==='account')modal('<div class="dialog-head"><h2>Your account</h2><button class="close" aria-label="Close">×</button></div><p>Personal Jellyfin account. Appearance and sign-out would live here.</p>');
 if(b.id==='sort'){const grid=$('#library-grid');[...grid.children].reverse().forEach(n=>grid.append(n));b.textContent=b.textContent==='A–Z'?'Z–A':'A–Z'}
 if(b.classList.contains('close'))close();
});
document.addEventListener('input',e=>{if(e.target.id==='query'){let q=e.target.value.toLowerCase().trim();$('#search-results').innerHTML=q?`<div class="queue-list">${titles.filter(t=>t.name.toLowerCase().includes(q)).map(t=>`<button class="quiet-btn" data-details="${t.name}" style="text-align:left">${t.name} · ${t.year}</button>`).join('')||'<p>No matching titles in this sample library.</p>'}</div>`:''}});
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&$('.dialog')){const f=[...$('.dialog').querySelectorAll('button,input')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.id==='bot-message')$('#bot-send').click()});
render();
</script></body></html>
