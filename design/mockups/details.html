  if (r.bottom > innerHeight - 12) scrollBy({top: r.bottom - innerHeight + 24, behavior: RM()?'instant':'smooth'});
}
function closeHow(silent){
  const pop = $('#howPop'), b = $('#howBtn');
  if (b) b.setAttribute('aria-expanded','false');
  if (!pop) return;
  const fin = ()=>{ $('#howlayer').innerHTML = ''; if (!silent && b && b.isConnected) b.focus({preventScroll:true}); };
  const a = silent ? null : anim(pop, [{opacity:1, transform:'none'},{opacity:0, transform:'translateY(-6px) scale(.98)'}], {duration:140, easing:'cubic-bezier(.4,0,1,1)'});
  if (a) a.onfinish = fin; else fin();
}
/* the sheet on phones reuses the dialog; when it closes the summary button reflects it */
new MutationObserver(()=>{ if (!$('.dialog.how') && !$('#howPop')) $('#howBtn')?.setAttribute('aria-expanded','false'); }).observe($('#layer'), {childList:true});
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && $('#howPop')){ e.preventDefault(); closeHow(); } });
document.addEventListener('pointerdown', e=>{ const pop = $('#howPop'); if (pop && !pop.contains(e.target) && !e.target.closest('#howBtn')) closeHow(true); });
document.addEventListener('focusin', e=>{ const pop = $('#howPop'); if (pop && !pop.contains(e.target) && !e.target.closest('#howBtn')) closeHow(true); });
addEventListener('resize', ()=>{ if ($('#howPop')){ if (PHONE.matches) closeHow(true); else placeHow(); } });

/* ════════ Profiles: avatar menu quick switch + PIN (same flow as the v5 home) ════════ */
function syncUrl(){ history.replaceState(null,'',`?ex=${S.ex}${S.pid!=='sam'?'&as='+S.pid:''}`); }
function applyProfile(){
  const p = P();
  $('#avatarBtn').innerHTML = `${pic(p)}<span class="nm">${p.name}<small>${p.id==='home'?'Shared TV':p.role}</small></span>${ic('down')}`;
  $('#avatarBtn').setAttribute('aria-label', `${p.name}, ${p.role}. Switch profile`);
}
function switchProfile(id, viaMock){
  if (id===S.pid){ closePops(); return; }
  S.pid = id; store.set('nutfin5-profile', id);
  closePops(); closeHow(true);
  loadPrefs(IT());
  document.body.classList.remove('swapping'); void document.body.offsetWidth; document.body.classList.add('swapping');
  paint({keepScroll:true}); syncUrl();
  const p = P();
  toast(`Watching as ${esc(p.name)}. ${p.id==='sam' ? 'Remove and server details are visible.' : p.id==='home' ? 'Shared TV account. No Remove, no server details.' : 'Your own progress and picks. No Remove, no server details.'}`, 'check');
  if (!viaMock) $('#avatarBtn').focus({preventScroll:true});
}
let popOpen = false;
function closePops(){ const m = $('#pmenu'); if (!m || m.hidden) return; m.hidden = true; $('#avatarBtn').setAttribute('aria-expanded','false'); popOpen = false; }
function renderMenu(){
  const p = P(), others = PIDS.filter(id=>id!==p.id);
  $('#pmenu').innerHTML = `
    <div class="pm-me">${pic(p)}<div><b>${p.name}</b><small>${ic('check')}Watching now · ${p.id==='home'?'shared TV account':p.role.toLowerCase()}</small></div></div>
    <h2 class="pm-h">Switch to (on this device)</h2>
    <div class="pm-list">${others.map(id=>{ const o = PROFILES[id]; return `<button class="pm-item" type="button" data-pickp="${id}">${pic(o)}<span>${o.name}<small>${o.id==='home'?'Everyone · living-room TV':o.role}${o.pin?' · PIN':''}</small></span>${o.pin?ic('lock','lk'):''}</button>`; }).join('')}
      <a class="pm-item" href="home.html">${ic('users')}<span>Who's watching screen<small>On Home, big buttons for the TV</small></span></a>
    </div>
    <div class="pm-sep"></div>
    <div class="pm-list"><button class="pm-item" type="button" data-signout>${ic('logout')}<span>Forget ${p.name} on this device<small>Signs this profile out here only</small></span></button></div>`;
}
$('#avatarBtn').addEventListener('click', e=>{
  e.stopPropagation();
  if (popOpen){ closePops(); return; }
  closeHow(true); renderMenu(); $('#pmenu').hidden = false; popOpen = true; e.currentTarget.setAttribute('aria-expanded','true'); $('button', $('#pmenu')).focus({preventScroll:true});
});
$('#pmenu').addEventListener('click', e=>{
  e.stopPropagation();
  const c = e.target.closest('[data-pickp]'); if (c){ const p = PROFILES[c.dataset.pickp]; if (p.pin) askPin(p); else switchProfile(p.id); return; }
  if (e.target.closest('[data-signout]')){ closePops(); toast(`${esc(P().name)} would be forgotten on this device. Not in the mockup.`, 'info'); }
});
document.addEventListener('click', e=>{ if (popOpen && !e.target.closest('#pmenu, #avatarBtn')) closePops(); });
document.addEventListener('keydown', e=>{
  if (!popOpen) return;
  if (e.key==='Escape'){ closePops(); $('#avatarBtn').focus(); return; }
  if (e.key==='Tab'){ const f = $$('button, a[href]', $('#pmenu')); const a=f[0], z=f[f.length-1];
    if (e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); } }
});
let pinFor = null, pinVal = '';
const appParts = () => ['#page','#top','.mock'].map(s=>$(s)).filter(Boolean);
function askPin(p){
  pinFor = p; pinVal = ''; closePops();
  $('#pinPic').innerHTML = pic(p);
  $('#pinH').textContent = `Enter ${p.name}'s PIN`;
  const m = $('#pinMsg'); m.className = ''; m.textContent = `${p.name} uses a PIN to protect this profile.`;
  $('#pinPad').innerHTML = [1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-d="${n}">${n}</button>`).join('') + `<button type="button" class="txt" data-pinx>Cancel</button><button type="button" data-d="0">0</button><button type="button" data-bk aria-label="Delete last digit">${ic('bksp')}</button>`;
  dots(); appParts().forEach(x=>x.inert = true);
  $('#pin').hidden = false; $('[data-d="1"]', $('#pin')).focus({preventScroll:true});
}
function dots(){ $$('#pinDots i').forEach((d,i)=>d.classList.toggle('on', i<pinVal.length)); }
function closePin(back){ $('#pin').hidden = true; $('#pinDots').className = 'dots4'; appParts().forEach(x=>x.inert = false); if (back) $('#avatarBtn').focus({preventScroll:true}); }
function pinKey(k){
  if (k==='x'){ closePin(true); return; }
  if (k==='bk'){ pinVal = pinVal.slice(0,-1); dots(); return; }
  if (pinVal.length>=4) return;
  pinVal += k; dots();
  if (pinVal.length===4){
    if (pinVal===pinFor.pin){ $('#pinDots').classList.add('ok'); const id = pinFor.id; setTimeout(()=>{ closePin(false); switchProfile(id); }, D(260)); }
    else { const dd = $('#pinDots'); dd.classList.remove('shake'); void dd.offsetWidth; dd.classList.add('shake'); const m = $('#pinMsg'); m.className='bad'; m.textContent = 'Not quite. Try again.'; setTimeout(()=>{ pinVal=''; dots(); }, D(380)); }
  }
}
$('#pinPad').addEventListener('click', e=>{ e.stopPropagation(); const b = e.target.closest('button'); if (!b) return; pinKey(b.dataset.d ?? (b.hasAttribute('data-bk') ? 'bk' : 'x')); });
$('#pin').addEventListener('keydown', e=>{
  if (/^[0-9]$/.test(e.key)){ e.preventDefault(); pinKey(e.key); } else if (e.key==='Backspace'){ e.preventDefault(); pinKey('bk'); } else if (e.key==='Escape'){ e.stopPropagation(); pinKey('x'); }
  else if (e.key==='Tab'){ const f = $$('button', $('#pin')); const a=f[0], z=f[f.length-1]; if (e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); } }
});
$('#pin').addEventListener('click', e=>{ if (e.target.id==='pin') pinKey('x'); });

/* ════════ Theme: Auto / Light / Dark, shared with the v5 home. The switch flips whatever is showing now. ════════ */
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
let THEME = store.get('nutfin5-theme', 'auto');
function effTheme(){ return THEME==='auto' ? (darkMQ.matches ? 'dark' : 'light') : THEME; }
function setTheme(t){
  THEME = t; store.set('nutfin5-theme', t);
  const root = document.documentElement;
  if (t==='auto') delete root.dataset.theme; else root.dataset.theme = t;
  const eff = effTheme(); root.dataset.eff = eff;
  const sw = $('#themeSw'); sw.setAttribute('aria-checked', eff==='dark'); sw.setAttribute('aria-label', 'Dark theme'); sw.title = eff==='dark' ? 'Dark. Switch to light' : 'Light. Switch to dark';
}
$('#themeSw').addEventListener('click', ()=>{ setTheme(effTheme()==='dark' ? 'light' : 'dark'); live(effTheme()==='dark' ? 'Dark theme' : 'Light theme'); });
darkMQ.addEventListener?.('change', ()=>{ if (THEME==='auto') setTheme('auto'); });
setTheme(THEME);
loadPrefs(IT());

addEventListener('resize', ()=>{ placeAllSegs(); wireTracks(); });
document.fonts && document.fonts.ready.then(()=>placeAllSegs());
$('#logoBot').innerHTML = nutbot(34, 'idle'); $('#railBot').innerHTML = nutbot(40, 'idle');
paint();
