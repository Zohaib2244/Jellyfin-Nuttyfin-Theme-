<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutFin Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ── Nutstyle Ember tokens (same as v3 / Direction A) ── */
:root{
  color-scheme: dark;
  --font-px:'DotGothic16', ui-monospace, monospace;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
  --font-read:'Atkinson Hyperlegible', 'JetBrains Mono', sans-serif;
  --bw:1.5px; --r-card:12px; --r-ctl:10px;
  --lift:3px 3px 0 var(--shadow-c); --lift-hi:5px 5px 0 var(--shadow-c); --lift-btn:2px 2px 0 var(--shadow-c);
  --mockh:40px; --gut:28px;

  --ease:cubic-bezier(.33,1,.68,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --ease-spring:var(--ease-out);
  --d-micro:120ms; --d-small:200ms; --d-med:280ms; --d-large:420ms; --d-hero:700ms; --d-kb:1800ms;

  --bg: light-dark(#d8cfbc, #13100c);
  --panel: light-dark(#f5f0e6, #1e1a14);
  --nested: light-dark(#faf6f0, #1a1610);
  --line: light-dark(#7a6a52, #3d3220);
  --shadow-c: light-dark(#a89878, #070604);
  --text: light-dark(#1c1810, #e8dfc8);
  --muted: light-dark(#514739, #b5b0a3);
  --dim: light-dark(#796856, #8b8576);
  --accent: light-dark(#e05a18, #ff6b2b);
  --accent-ink: light-dark(#f5f0e6, #13100c);
  --num: light-dark(#00768a, #00b4c8);
  --raise: color-mix(in srgb, var(--panel) 90%, var(--text));
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--panel));
  --ok: light-dark(#1f6b33, #7ccf8c);
  --info: light-dark(#2d62a6, #86b4ea);
  --warn: light-dark(#8f6400, #e8c46b);
  --bad: light-dark(#a3301c, #ff8f78);
  --ok-soft: color-mix(in srgb, var(--ok) 14%, var(--panel));
  --info-soft: color-mix(in srgb, var(--info) 14%, var(--panel));
  --warn-soft: color-mix(in srgb, var(--warn) 14%, var(--panel));
  --bad-soft: color-mix(in srgb, var(--bad) 13%, var(--panel));
  --num-soft: color-mix(in srgb, var(--num) 14%, var(--panel));
}
@supports (transition-timing-function: linear(0, 1)){
  :root{ --ease-spring: linear(0, .12 4%, .38 10%, .66 17%, .87 25%, 1 33%, 1.04 41%, 1.035 48%, 1.015 58%, 1.002 70%, .999 82%, 1); }
}
@media (prefers-reduced-motion: reduce){
  :root{ --d-micro:0ms; --d-small:0ms; --d-med:0ms; --d-large:0ms; --d-hero:0ms; --d-kb:0ms; }
  *, *::before, *::after{ animation-iteration-count:1 !important; scroll-behavior:auto !important; }
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ color-scheme: light; } }
:root[data-theme="light"]{ color-scheme: light; }
:root[data-theme="dark"]{ color-scheme: dark; }

*{ box-sizing:border-box; }
html,body{ margin:0; }
html{ scroll-behavior:smooth; }
body{ background:var(--bg); color:var(--text); font-family:var(--font-mono); font-size:15px; line-height:1.5; overflow-x:hidden; -webkit-font-smoothing:antialiased; }
img{ display:block; max-width:100%; }
img.broken{ opacity:0; }
button, input, select, textarea{ font:inherit; color:inherit; }
a{ color:inherit; }
:focus-visible{ outline:3px solid var(--num); outline-offset:3px; border-radius:6px; }
.sr{ position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
svg.i{ width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
svg.draw{ stroke-dasharray:1 1.001; animation:draw var(--dur,260ms) var(--ease-out) var(--delay,60ms) both; }
@keyframes draw{ from{ stroke-dashoffset:1; } to{ stroke-dashoffset:0; } }
@keyframes rise{ from{ opacity:0; transform:translateY(12px); } }
@keyframes fadein{ from{ opacity:0; } }
@keyframes dlgin{ from{ opacity:0; transform:translateY(12px) scale(.98); } }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* every picture sits on a gradient, so a failed image still looks designed */
.ph{ position:relative; background:
  radial-gradient(120% 80% at 18% 12%, hsl(var(--h,20) 70% 58% / .55), transparent 60%),
  radial-gradient(90% 70% at 92% 100%, hsl(var(--h2,60) 70% 48% / .5), transparent 62%),
  linear-gradient(160deg, hsl(var(--h,20) 38% 24%), hsl(var(--h2,60) 42% 9%)); }
.ph[data-t]::before{ content:attr(data-t); position:absolute; left:10px; right:10px; bottom:10px; font-family:var(--font-px); font-size:15px; line-height:1.15; color:rgba(255,255,255,.88); text-shadow:0 1px 0 rgba(0,0,0,.45); }
.ph > img{ position:relative; }

/* ── Mockup strip (not part of the app) ── */
.mock{ position:sticky; top:0; z-index:400; display:flex; align-items:center; gap:6px; height:40px; padding:0 12px; background:repeating-linear-gradient(135deg,#2a2a2a 0 10px,#262626 10px 20px); border-bottom:2px dashed #5a5a5a; overflow-x:auto; scrollbar-width:none; font-family:system-ui, sans-serif; }
.mock::-webkit-scrollbar{ display:none; }
.mock b{ font-size:11px; letter-spacing:.12em; color:#c9c9c9; text-transform:uppercase; padding-right:4px; white-space:nowrap; }
.mock .sep{ flex:none; width:1px; height:20px; background:#555; margin:0 6px; }
.mock .lab{ flex:none; color:#aaa; font-size:11.5px; white-space:nowrap; }
.mock button, .mock a{ flex:none; border:1px solid #555; background:#333; color:#ddd; border-radius:999px; padding:4px 11px; font-size:12px; cursor:pointer; white-space:nowrap; text-decoration:none; line-height:1.4; }
.mock [aria-current="page"], .mock [aria-pressed="true"]{ background:#ddd; color:#111; border-color:#ddd; }
.mock a{ border-style:dashed; }

/* ── App shell ── */
.top{ position:sticky; top:var(--mockh); z-index:50; display:flex; align-items:center; gap:18px; height:66px; padding:0 var(--gut); background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(10px); border-bottom:var(--bw) solid var(--line); }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; padding:4px; border-radius:10px; }
.brand span{ font-family:var(--font-px); font-size:22px; letter-spacing:.04em; }
.brand span em{ font-style:normal; color:var(--accent); }
.nav{ display:flex; gap:4px; }
.nav a{ display:flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; border:var(--bw) solid transparent; border-radius:var(--r-ctl); font-family:var(--font-px); font-size:15px; letter-spacing:.04em; color:var(--muted); text-decoration:none; transition:color var(--d-micro) var(--ease), background var(--d-micro) var(--ease); }
.nav a:hover{ color:var(--text); background:var(--panel); }
.nav a[aria-current="page"]{ color:var(--text); border-color:var(--line); background:var(--panel); box-shadow:var(--lift-btn); }
.nav a[aria-current="page"] svg{ color:var(--accent); }
.spacer{ flex:1; }
.iconbtn{ display:inline-grid; place-items:center; width:44px; height:44px; border-radius:var(--r-ctl); border:var(--bw) solid var(--line); background:var(--panel); cursor:pointer; color:var(--text); flex:none; }
.iconbtn:hover{ border-color:var(--accent); }
/* theme switch (same as v5 home): a little day/night window. Sun by day, pixel moon and stars by night */
.themesw{ position:relative; width:78px; height:44px; padding:0; border:0; background:none; cursor:pointer; flex:none; border-radius:999px; }
.themesw .trk{ position:absolute; inset:3px 0; border-radius:999px; border:var(--bw) solid var(--line); overflow:hidden; box-shadow:var(--lift-btn); background:#1a1430; }
.themesw .trk > span{ position:absolute; inset:0; transition:opacity var(--d-large) var(--ease-out); }
.themesw .day{ background:linear-gradient(180deg, #ffd99a, #ff9d5c); opacity:0; }
.themesw .night{ background:linear-gradient(180deg, #2a2150, #120d22); }
.themesw .day svg{ position:absolute; right:8px; top:7px; width:26px; height:16px; fill:#fff8ec; transition:transform var(--d-large) var(--ease-spring); }
.themesw .night svg{ position:absolute; left:7px; top:6px; width:34px; height:26px; fill:#f6f0e4; }
.themesw .night svg rect{ animation:tw 3s steps(2) infinite; }
.themesw .night svg rect:nth-child(2){ animation-delay:-1s; } .themesw .night svg rect:nth-child(3){ animation-delay:-2s; }
@keyframes tw{ 50%{ opacity:.3; } }
.themesw .knob{ position:absolute; top:7px; left:6px; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; border:var(--bw) solid #3d3220; box-shadow:2px 2px 0 rgba(0,0,0,.45); transform:translateX(36px); transition:transform var(--d-large) var(--ease-spring), background var(--d-large); background:#efe6ff; }
.themesw .knob svg{ position:absolute; width:20px; height:20px; transition:opacity var(--d-med), transform var(--d-large) var(--ease-spring); }
.themesw .knob .sun{ fill:#e05a18; opacity:0; transform:rotate(-90deg) scale(.5); }
.themesw .knob .moon{ fill:#5a4ab0; }
:root[data-eff="light"] .themesw .day{ opacity:1; }
:root[data-eff="light"] .themesw .night{ opacity:0; }
:root[data-eff="light"] .themesw .knob{ transform:translateX(0); background:#fff3dc; }
:root[data-eff="light"] .themesw .knob .sun{ opacity:1; transform:none; }
:root[data-eff="light"] .themesw .knob .moon{ opacity:0; transform:rotate(90deg) scale(.5); }
.themesw:hover .knob{ transform:translateX(32px) rotate(-8deg); }
:root[data-eff="light"] .themesw:hover .knob{ transform:translateX(4px) rotate(8deg); }
.themesw:hover .day svg{ transform:translateX(-4px); }
.themesw:active .knob{ width:34px; }

/* profile avatar + quick switch (same as v5 home) */
.pic{ display:grid; place-items:center; border-radius:50%; background:linear-gradient(140deg, var(--c1), var(--c2)); color:var(--ink); font-family:var(--font-px); flex:none; position:relative; }
.pic svg{ width:58%; height:58%; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.avatar{ position:relative; display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 10px 0 0; border-radius:999px; border:var(--bw) solid var(--line); cursor:pointer; background:var(--panel); font-family:var(--font-read); font-weight:700; font-size:15px; flex:none; }
.avatar .pic{ width:40px; height:40px; font-size:18px; box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--c1); margin-left:1px; }
.avatar .nm{ display:flex; flex-direction:column; line-height:1.05; text-align:left; }
.avatar .nm small{ font-family:var(--font-mono); font-weight:400; font-size:11px; color:var(--num); }
.avatar:hover, .avatar[aria-expanded="true"]{ border-color:var(--accent); }
.pop{ position:fixed; z-index:300; top:calc(var(--mockh) + 74px); right:16px; width:360px; max-width:calc(100% - 32px); max-height:calc(100% - var(--mockh) - 96px); overflow:auto; background:var(--panel); border:var(--bw) solid var(--line); border-radius:16px; box-shadow:var(--lift-hi); padding:12px; animation:popin var(--d-med) var(--ease-spring) both; transform-origin:top right; }
.pop[hidden]{ display:none; }
@keyframes popin{ from{ opacity:0; transform:translateY(-8px) scale(.97); } }
.pm-me{ display:flex; align-items:center; gap:12px; padding:6px 6px 12px; border-bottom:1px dashed var(--line); }
.pm-me .pic{ width:52px; height:52px; font-size:22px; box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--c1); }
.pm-me b{ display:block; font-family:var(--font-px); font-weight:400; font-size:20px; line-height:1.1; }
.pm-me small{ display:flex; align-items:center; gap:5px; font-family:var(--font-read); font-size:13px; color:var(--ok); font-weight:700; }
.pm-me small svg{ width:14px; height:14px; }
.pm-h{ margin:12px 6px 6px; font-family:var(--font-px); font-size:13px; letter-spacing:.06em; color:var(--muted); font-weight:400; }
.pm-list{ display:flex; flex-direction:column; gap:2px; }
.pm-item{ display:flex; align-items:center; gap:12px; width:100%; min-height:52px; padding:4px 8px; border:0; border-radius:10px; background:none; cursor:pointer; text-align:left; font-family:var(--font-read); font-size:15px; text-decoration:none; }
.pm-item:hover{ background:var(--raise); }
.pm-item .pic{ width:38px; height:38px; font-size:16px; }
.pm-item > svg.i{ color:var(--accent); width:20px; margin:0 9px; }
.pm-item > span:not(.pic){ flex:1; min-width:0; }
.pm-item small{ display:block; font-size:12.5px; color:var(--muted); }
.pm-item .lk{ width:16px; height:16px; color:var(--dim); }
.pm-sep{ height:1px; background:var(--line); margin:8px 4px; opacity:.6; }
.pin{ position:fixed; inset:0; z-index:420; display:grid; place-items:center; padding:16px; background:rgba(8,6,4,.72); backdrop-filter:blur(5px); animation:fadein var(--d-small) linear both; }
.pin[hidden]{ display:none; }
.pin-card{ width:min(360px, 100%); padding:22px 22px 18px; border-radius:20px; border:var(--bw) solid var(--line); background:var(--panel); box-shadow:var(--lift-hi); text-align:center; animation:dlgin var(--d-large) var(--ease-spring) both; }
.pin-card .pic{ width:64px; height:64px; font-size:28px; margin:0 auto; }
.pin-card h2{ margin:10px 0 2px; font-family:var(--font-px); font-weight:400; font-size:24px; }
.pin-card p{ margin:0; font-family:var(--font-read); font-size:14px; color:var(--muted); min-height:40px; }
.pin-card p.bad{ color:var(--bad); font-weight:700; }
.dots4{ display:flex; justify-content:center; gap:14px; margin:12px 0 16px; }
.dots4 i{ width:16px; height:16px; border-radius:5px; border:2px solid var(--line); transition:background var(--d-micro), transform var(--d-small) var(--ease-spring); }
.dots4 i.on{ background:var(--accent); border-color:var(--accent); transform:scale(1.15); }
.dots4.shake{ animation:shake 420ms var(--ease) both; }
.dots4.ok i{ background:var(--ok); border-color:var(--ok); }
@keyframes shake{ 20%{ transform:translateX(-10px); } 40%{ transform:translateX(9px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(4px); } }
.pad3{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.pad3 button{ min-height:54px; border-radius:12px; border:var(--bw) solid var(--line); background:var(--nested); box-shadow:var(--lift-btn); cursor:pointer; font-family:var(--font-px); font-size:22px; display:grid; place-items:center; transition:transform var(--d-micro), border-color var(--d-micro); }
.pad3 button:hover{ border-color:var(--accent); }
.pad3 button:active{ transform:translate(2px,2px); box-shadow:none; }
.pad3 button.txt{ font-family:var(--font-read); font-weight:700; font-size:14px; }
body.swapping #page{ animation:pswap 520ms var(--ease-out) both; }
@keyframes pswap{ from{ opacity:0; transform:translateY(10px) scale(.99); filter:blur(4px); } }
.wrap{ max-width:1440px; margin:0 auto; padding:0 var(--gut); }

/* ── Buttons & chips ── */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:48px; padding:0 22px; border-radius:var(--r-ctl); border:var(--bw) solid var(--line); background:var(--panel); box-shadow:var(--lift-btn); font-family:var(--font-px); font-size:16px; letter-spacing:.05em; cursor:pointer; text-decoration:none; transition:transform var(--d-micro) var(--ease), border-color var(--d-micro), box-shadow var(--d-micro), background var(--d-small); white-space:nowrap; color:var(--text); }
.btn:hover{ border-color:var(--accent); transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--shadow-c); }
.btn:active{ transform:translate(2px,2px); box-shadow:none; }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.primary:hover{ border-color:var(--text); }
.btn.big{ min-height:58px; padding:0 30px; font-size:20px; }
.btn.big svg{ width:24px; height:24px; }
.btn.sm{ min-height:44px; padding:0 14px; font-size:14.5px; }
.btn.ghost{ background:transparent; box-shadow:none; }
.btn.req{ background:var(--num-soft); border-color:var(--num); }
.btn.req svg{ color:var(--num); }
.btn.danger{ background:var(--bad); border-color:var(--bad); color:var(--accent-ink); }
.btn.danger.out{ background:var(--bad-soft); color:var(--bad); }
.btn.danger:hover{ border-color:var(--text); }
.btn[disabled]{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
.btn[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); }
.btn[aria-pressed="true"] svg{ color:var(--accent); }
.chip{ position:relative; display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 8px; border-radius:999px; border:var(--bw) solid currentColor; font-family:var(--font-read); font-weight:700; font-size:14px; line-height:1.35; }
.chip svg{ width:15px; height:15px; }
.chip.ok{ color:var(--ok); background:var(--ok-soft); }
.chip.info{ color:var(--info); background:var(--info-soft); }
.chip.warn{ color:var(--warn); background:var(--warn-soft); }
.chip.num{ color:var(--num); background:var(--num-soft); }
.chip.bad{ color:var(--bad); background:var(--bad-soft); }
.chip.plain{ color:var(--muted); background:var(--panel); border-color:var(--line); }
.chip.flip{ animation:chipflip var(--d-med) var(--ease-out) both; }
@keyframes chipflip{ from{ transform:perspective(300px) rotateX(90deg); opacity:.2; } }
.select{ position:relative; display:block; }
.select select{ appearance:none; width:100%; min-height:46px; padding:0 40px 0 14px; border-radius:var(--r-ctl); border:var(--bw) solid var(--line); background:var(--nested); color:var(--text); font-family:var(--font-read); font-size:15.5px; cursor:pointer; text-overflow:ellipsis; }
.select select:hover{ border-color:var(--accent); }
.select > svg{ position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--muted); }
.seg{ position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; padding:4px; border:var(--bw) solid var(--line); border-radius:14px; background:var(--nested); }
.seg button{ position:relative; z-index:1; min-height:46px; padding:4px 12px; border:0; background:none; border-radius:10px; cursor:pointer; font-family:var(--font-read); font-weight:700; font-size:15px; color:var(--muted); line-height:1.2; transition:color var(--d-small) var(--ease-out); }
.seg button small{ display:block; font-family:var(--font-mono); font-weight:400; font-size:12px; opacity:.85; }
.seg button[aria-checked="true"]{ color:var(--accent-ink); }
.seg .hl{ position:absolute; left:0; top:0; border-radius:10px; background:var(--accent); transition:transform 240ms var(--ease-out), width 240ms var(--ease-out); pointer-events:none; box-shadow:var(--lift-btn); }

/* ── Parity notes (mockup only): what replaced each part of the old page ── */
body.parity [data-was]{ position:relative; outline:2px dashed color-mix(in srgb, var(--num) 70%, transparent); outline-offset:4px; border-radius:6px; }
body.parity [data-was]::after{ content:'Old page: ' attr(data-was); position:absolute; z-index:30; top:-6px; right:6px; transform:translateY(-100%); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:calc(100% - 12px); font-family:system-ui, sans-serif; font-size:11.5px; font-weight:600; line-height:1.3; background:#00b4c8; color:#062026; padding:2px 8px; border-radius:6px; pointer-events:none; }

/* ── Hero ── */
.dh{ position:relative; isolation:isolate; overflow:hidden; border-bottom:var(--bw) solid var(--line); color-scheme:dark; color:var(--text); background:var(--bg); }
.dh .bd{ position:absolute; inset:0; z-index:-2; }
.dh .bd img{ width:100%; height:100%; object-fit:cover; object-position:center 22%; animation:kb var(--d-kb) var(--ease-out) both; }
@keyframes kb{ from{ transform:scale(1.07); opacity:0; } 40%{ opacity:1; } }
.dh::before{ content:''; position:absolute; inset:0; z-index:-1; pointer-events:none; background:
  linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb,var(--bg) 88%,transparent) 30%, color-mix(in srgb,var(--bg) 35%,transparent) 62%, color-mix(in srgb,var(--bg) 55%,transparent) 100%),
  linear-gradient(0deg, var(--bg) 0%, transparent 42%); }
.dh .in{ position:relative; max-width:1440px; margin:0 auto; padding:16px var(--gut) 40px; display:grid; grid-template-columns:196px minmax(0,760px); grid-template-rows:auto 1fr; column-gap:34px; row-gap:18px; min-height:600px; }
.backrow{ grid-column:1/-1; display:flex; align-items:center; gap:10px; }
.backrow .btn{ background:color-mix(in srgb, var(--panel) 84%, transparent); backdrop-filter:blur(6px); }
.dposter{ align-self:end; aspect-ratio:2/3; border-radius:var(--r-card); border:var(--bw) solid var(--line); box-shadow:var(--lift-hi); overflow:hidden; animation:rise var(--d-large) var(--ease-out) both; }
.dposter img{ width:100%; height:100%; object-fit:cover; }
.dmain{ align-self:end; min-width:0; }
.dmain > *{ animation:rise var(--d-med) var(--ease-out) both; }
.dmain > :nth-child(2){ animation-delay:60ms; } .dmain > :nth-child(3){ animation-delay:110ms; } .dmain > :nth-child(4){ animation-delay:160ms; } .dmain > :nth-child(n+5){ animation-delay:210ms; }
.kicker{ display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; font-family:var(--font-px); font-size:14px; letter-spacing:.08em; color:var(--accent); text-transform:uppercase; }
.kicker .chip{ text-transform:none; letter-spacing:0; font-size:13px; padding:1px 9px 1px 7px; }
.ttl{ margin:10px 0 12px; font-family:var(--font-px); font-weight:400; font-size:52px; line-height:1.04; }
.ttl .logo{ max-width:min(460px, 100%); max-height:138px; width:auto; object-fit:contain; object-position:left bottom; filter:drop-shadow(0 4px 14px rgba(0,0,0,.55)); }
.ttl.haslogo .txt{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.ttl:not(.haslogo) .logo{ display:none; }
.facts{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; color:var(--muted); font-size:14px; }
.facts .rate{ display:inline-flex; align-items:center; gap:5px; color:var(--text); }
.facts .rate svg{ color:var(--warn); width:16px; height:16px; }
.facts .num{ color:var(--num); font-weight:600; }
.facts .rt{ border:1px solid var(--line); padding:0 6px; border-radius:4px; }
.tagline{ font-family:var(--font-read); font-size:17px; line-height:1.55; max-width:640px; margin:14px 0 0; }
.tagline.clamp{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.morebtn{ background:none; border:0; padding:0 2px; min-height:44px; cursor:pointer; font-family:var(--font-read); font-weight:700; font-size:15px; color:var(--text); text-decoration:underline; text-underline-offset:3px; }
.playrow{ display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px; margin-top:16px; }
.resume{ display:grid; gap:8px; }
.resume .btn.big{ justify-content:flex-start; }
.resume .btn .sub{ font-family:var(--font-read); font-size:14.5px; letter-spacing:0; opacity:.9; }
.resume .bar{ height:6px; border-radius:3px; background:color-mix(in srgb, var(--text) 22%, transparent); overflow:hidden; }
.resume .bar i{ display:block; height:100%; background:var(--accent); border-radius:3px; transform-origin:left; animation:grow 700ms var(--ease-out) 350ms both; }
@keyframes grow{ from{ transform:scaleX(0); } }
.endsat{ font-family:var(--font-read); color:var(--muted); font-size:14.5px; }
.endsat b{ color:var(--text); }
.acts2{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
.acts2 .btn{ background:color-mix(in srgb, var(--panel) 86%, transparent); }
.morewrap{ position:relative; }
.menu{ position:absolute; z-index:60; left:0; top:calc(100% + 8px); width:280px; background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--r-card); box-shadow:var(--lift-hi); padding:6px; animation:dlgin var(--d-small) var(--ease-out) both; font-family:var(--font-read); }
.menu[hidden]{ display:none; }
.menu button{ display:flex; align-items:center; gap:10px; width:100%; min-height:46px; padding:0 10px; border:0; background:none; border-radius:8px; cursor:pointer; font-size:15.5px; text-align:left; }
.menu button:hover, .menu button:focus-visible{ background:var(--raise); }
.menu .danger{ color:var(--bad); }
.menu hr{ border:0; border-top:1px dashed var(--line); margin:6px 4px; }
.menu .who{ padding:2px 10px 4px; font-size:12.5px; color:var(--num); font-family:var(--font-mono); }

/* how it plays: a quiet line under Play; the full panel opens on demand (popover on wide screens, sheet on phones) */
.howline{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-top:12px; }
.howline .chip{ font-size:13.5px; }
.howbtn{ display:inline-flex; align-items:center; gap:8px; min-height:46px; max-width:100%; padding:4px 12px 4px 10px; border-radius:999px; border:var(--bw) solid color-mix(in srgb, var(--line) 80%, transparent); background:color-mix(in srgb, var(--panel) 72%, transparent); backdrop-filter:blur(6px); cursor:pointer; font-family:var(--font-read); font-size:14.5px; color:var(--text); text-align:left; transition:border-color var(--d-micro) var(--ease), background var(--d-micro) var(--ease); }
.howbtn:hover, .howbtn[aria-expanded="true"]{ border-color:var(--accent); background:color-mix(in srgb, var(--panel) 92%, transparent); }
.howbtn > svg{ color:var(--muted); width:18px; height:18px; }
.howbtn .sum{ min-width:0; }
.howbtn .sum i{ font-style:normal; color:var(--dim); padding:0 5px; }
.howbtn .chg{ font-weight:700; color:var(--accent); text-decoration:underline; text-underline-offset:3px; white-space:nowrap; }
.howbtn .chg svg{ width:16px; height:16px; vertical-align:-3px; margin-left:2px; transition:transform var(--d-small) var(--ease-out); }
.howbtn[aria-expanded="true"] .chg svg{ transform:rotate(180deg); }
.howbtn .mem{ display:inline-flex; align-items:center; gap:4px; padding:0 7px; border-radius:999px; background:var(--num-soft); color:var(--num); font-size:12px; font-weight:700; white-space:nowrap; }
.howbtn .mem svg{ width:13px; height:13px; }
.howpop{ position:absolute; z-index:90; width:400px; max-width:calc(100% - 32px); color:var(--text); animation:popin var(--d-med) var(--ease-spring) both; transform-origin:top left; }
.howpop[hidden]{ display:none; }
.wp{ background:var(--panel); border:var(--bw) solid var(--line); border-radius:16px; box-shadow:var(--lift-hi); padding:18px; display:grid; gap:14px; }
.howpop .wp{ box-shadow:var(--lift-hi); }
.wp .wphead{ display:flex; align-items:center; gap:8px; }
.wp .wphead h2{ flex:1; }
.wp .saved{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0; padding-top:12px; border-top:1px dashed var(--line); font-family:var(--font-read); font-size:13.5px; color:var(--muted); }
.wp .saved svg{ color:var(--num); width:16px; height:16px; }
.wp .saved span{ flex:1 1 180px; }
.wp .saved .linkbtn{ font-size:13.5px; }
.dialog.how{ padding:0; }
.dialog.how .wp{ border:0; box-shadow:none; background:none; padding:18px 20px 22px; }
.dialog.how .x{ display:none; }
.wp h2{ margin:0; font-family:var(--font-px); font-weight:400; font-size:18px; letter-spacing:.03em; display:flex; align-items:center; gap:8px; }
.wp h2 svg{ color:var(--accent); }
.wp .lbl{ display:block; font-family:var(--font-px); font-size:13.5px; color:var(--muted); margin-bottom:6px; letter-spacing:.03em; }
.wp .hint{ margin:6px 0 0; font-family:var(--font-read); font-size:13.5px; color:var(--muted); }
.wp .tech{ font-family:var(--font-mono); font-size:12.5px; color:var(--num); margin-top:4px; }
.herechip{ display:grid; gap:8px; }
.herechip .chip{ justify-self:start; white-space:normal; }
.linkbtn{ display:inline-flex; align-items:center; gap:6px; min-height:44px; background:none; border:0; padding:0; cursor:pointer; font-family:var(--font-read); font-size:14.5px; color:var(--text); text-decoration:underline; text-underline-offset:3px; }
.linkbtn svg{ width:18px; height:18px; color:var(--muted); }
.devpick{ display:flex; flex-wrap:wrap; gap:8px; }
.devpick[hidden]{ display:none; }
.devpick button{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 12px; border-radius:999px; border:var(--bw) solid var(--line); background:var(--nested); cursor:pointer; font-family:var(--font-read); font-size:14px; }
.devpick button:hover{ border-color:var(--accent); }
.devres{ font-family:var(--font-read); font-size:14.5px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.devres:empty{ display:none; }
.devres .chip{ white-space:normal; }
.scan{ display:inline-flex; gap:5px; }
.scan i{ width:11px; height:11px; border-radius:50%; border:2px solid var(--num); animation:scanfill 200ms linear both; }
.scan i:nth-child(2){ animation-delay:200ms; } .scan i:nth-child(3){ animation-delay:400ms; }
@keyframes scanfill{ to{ background:var(--num); } }
.why summary{ display:inline-flex; align-items:center; gap:6px; min-height:40px; cursor:pointer; font-family:var(--font-read); font-size:14px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; list-style:none; }
.why summary::-webkit-details-marker{ display:none; }
.why div{ font-family:var(--font-mono); font-size:12.5px; color:var(--num); padding:4px 0 2px 12px; border-left:3px solid var(--line); }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

/* removed / hidden banner */
.banner{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:18px 0 0; padding:14px 16px; border-radius:var(--r-card); border:var(--bw) solid var(--ok); background:var(--ok-soft); box-shadow:var(--lift); font-family:var(--font-read); font-size:16px; animation:rise var(--d-med) var(--ease-out) both; }
.banner.hid{ border-color:var(--info); background:var(--info-soft); }
.banner.warn{ border-color:var(--warn); background:var(--warn-soft); }
.banner .txt{ flex:1 1 260px; }
.banner b{ display:block; font-size:17px; }
.dh.gone .bd img, .dh.gone .dposter img{ filter:grayscale(.85) brightness(.7); transition:filter var(--d-hero) var(--ease-out); }

/* ── Sections ── */
.section{ margin-top:38px; scroll-margin-top:120px; }
.sechead{ display:flex; align-items:center; justify-content:space-between; gap:8px 12px; margin-bottom:14px; flex-wrap:wrap; }
.sechead h2{ margin:0; font-family:var(--font-px); font-weight:400; font-size:22px; letter-spacing:.03em; }
.sechead h2 small{ font-family:var(--font-read); font-size:14px; color:var(--muted); margin-left:8px; letter-spacing:0; }
.track{ display:grid; grid-auto-flow:column; grid-auto-columns:var(--cw,168px); gap:18px; overflow-x:auto; padding:4px 6px 14px 2px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
.track > *{ scroll-snap-align:start; }
.card{ display:block; width:100%; text-align:left; background:none; border:0; padding:0; cursor:pointer; color:inherit; text-decoration:none; }
.card .art{ position:relative; aspect-ratio:2/3; border-radius:var(--r-card); border:var(--bw) solid var(--line); box-shadow:var(--lift); overflow:hidden; transition:transform 160ms var(--ease), box-shadow 160ms var(--ease), border-color 160ms; }
.card .art img{ width:100%; height:100%; object-fit:cover; }
.card:hover .art, .card:focus-visible .art{ border-color:var(--accent); transform:translate(-2px,-2px); box-shadow:var(--lift-hi); }
.card:focus-visible{ outline:none; }
.card:focus-visible .art{ outline:3px solid var(--num); outline-offset:3px; }
.card .t{ margin-top:10px; font-family:var(--font-read); font-weight:700; font-size:15px; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.card .s{ font-family:var(--font-read); font-size:13.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .why2{ position:absolute; left:8px; top:8px; }
.card .why2 .chip{ background:var(--panel); font-size:12.5px; padding:1px 8px 1px 6px; box-shadow:var(--lift-btn); }

/* chapters */
.chaps{ --cw:228px; }
.chap{ position:relative; display:block; width:100%; text-align:left; background:none; border:0; padding:0; cursor:pointer; color:inherit; }
.chap .th{ position:relative; aspect-ratio:16/9; border-radius:10px; overflow:hidden; border:var(--bw) solid var(--line); box-shadow:var(--lift); transition:transform 160ms var(--ease), border-color 160ms, box-shadow 160ms; }
.chap .th img{ width:100%; height:100%; object-fit:cover; }
.chap .tm{ position:absolute; right:8px; bottom:8px; font-family:var(--font-mono); font-size:12.5px; background:rgba(0,0,0,.7); color:#f2ead8; padding:1px 7px; border-radius:6px; }
.chap:hover .th, .chap:focus-visible .th{ border-color:var(--accent); transform:translate(-2px,-2px); box-shadow:var(--lift-hi); }
.chap:focus-visible{ outline:none; } .chap:focus-visible .th{ outline:3px solid var(--num); outline-offset:3px; }
.chap b{ display:block; margin-top:8px; font-family:var(--font-read); font-size:14.5px; }
.chap span.n{ font-family:var(--font-read); font-size:13px; color:var(--muted); }

/* people */
.people{ --cw:136px; }
.person{ text-align:center; min-width:0; }
.person .face{ position:relative; width:108px; height:108px; border-radius:50%; overflow:hidden; margin:0 auto 10px; border:var(--bw) solid var(--line); box-shadow:var(--lift-btn); display:grid; place-items:center; }
.person .face .ini{ position:absolute; font-family:var(--font-px); font-size:30px; color:rgba(255,255,255,.85); }
.person .face img{ position:relative; width:100%; height:100%; object-fit:cover; object-position:center 20%; }
.person b{ display:block; font-family:var(--font-read); font-size:14.5px; line-height:1.25; }
.person span{ display:block; font-family:var(--font-read); font-size:13px; color:var(--muted); line-height:1.3; margin-top:2px; }
.person em{ display:block; font-style:normal; font-family:var(--font-mono); font-size:12px; color:var(--num); margin-top:3px; }
.person.crew .face{ border-style:dashed; }
.divider{ width:1px; background:var(--line); margin:8px 0 40px; }

/* seasons & episodes */
.seasontabs{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
.seasontabs button{ display:inline-flex; align-items:center; gap:8px; min-height:46px; padding:0 16px; border-radius:var(--r-ctl); border:var(--bw) solid var(--line); background:var(--panel); cursor:pointer; font-family:var(--font-px); font-size:15px; }
.seasontabs button[aria-selected="true"]{ border-color:var(--accent); background:var(--accent-soft); box-shadow:var(--lift-btn); }
.seasontabs button.missing{ border-style:dashed; border-color:var(--num); }
.seasontabs .chip{ font-size:12.5px; padding:0 8px 0 6px; }
.seasontabs .chip svg{ width:13px; height:13px; }
.seasonacts{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:14px; font-family:var(--font-read); color:var(--muted); }
.eps{ display:grid; gap:12px; }
.ep{ position:relative; display:grid; grid-template-columns:232px minmax(0,1fr) auto; gap:6px 18px; align-items:center; padding:12px; border-radius:var(--r-card); border:var(--bw) solid var(--line); background:var(--panel); box-shadow:var(--lift); transition:border-color var(--d-micro), transform var(--d-micro) var(--ease); animation:rise var(--d-med) var(--ease-out) both; animation-delay:calc(var(--i,0) * 35ms); }
.ep:hover{ border-color:var(--accent); }
.ep.now{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 7%, var(--panel)); }
.ep .hit{ position:absolute; inset:0; border:0; background:none; cursor:pointer; border-radius:inherit; z-index:1; }
.ep .hit:focus-visible{ outline-offset:-3px; }
.ep .th{ position:relative; aspect-ratio:16/9; border-radius:8px; overflow:hidden; }
.ep .th img{ width:100%; height:100%; object-fit:cover; }
.ep .pc{ position:absolute; left:calc(50% - 20px); top:calc(50% - 20px); width:40px; height:40px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; box-shadow:var(--lift-btn); transition:transform var(--d-micro) var(--ease); }
.ep .pc svg{ width:18px; height:18px; }
.ep:hover .pc{ transform:scale(1.1); }
.prog{ position:absolute; left:8px; right:8px; bottom:8px; height:6px; border-radius:3px; background:color-mix(in srgb, #000 55%, transparent); overflow:hidden; }
.prog i{ display:block; height:100%; background:var(--accent); border-radius:3px; }
.ep h3{ margin:0 0 4px; font-family:var(--font-read); font-size:17px; line-height:1.3; }
.ep h3 span{ font-family:var(--font-px); font-weight:400; color:var(--accent); margin-right:8px; }
.ep p{ margin:0; font-family:var(--font-read); color:var(--muted); font-size:14.5px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.ep.open p{ -webkit-line-clamp:unset; display:block; }
.ep .side{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-family:var(--font-read); font-size:14px; color:var(--muted); white-space:nowrap; }
.ep .side .left{ color:var(--accent); font-weight:700; }
.ep .dt{ position:relative; z-index:2; }
.ep .more{ grid-column:1/-1; position:relative; z-index:2; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px 20px; align-items:start; padding:12px 4px 2px; border-top:1px dashed var(--line); margin-top:6px; animation:rise var(--d-med) var(--ease-out) both; }
.ep .more[hidden]{ display:none; }
.ep .more .gs{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.ep .more .g{ display:inline-flex; align-items:center; gap:8px; padding:3px 12px 3px 3px; border-radius:999px; border:var(--bw) solid var(--line); background:var(--nested); font-family:var(--font-read); font-size:13.5px; }
.ep .more .g .face{ width:30px; height:30px; border-radius:50%; overflow:hidden; }
.ep .more .g img{ width:100%; height:100%; object-fit:cover; }
.ep .more .k{ font-family:var(--font-px); font-size:13.5px; color:var(--muted); }
.ep .more .tech{ font-family:var(--font-mono); font-size:12.5px; color:var(--num); margin-top:8px; }
.ep .more .btns{ display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
.watched{ display:inline-flex; align-items:center; gap:5px; color:var(--ok); font-family:var(--font-read); font-weight:700; font-size:14px; }
.watched svg{ width:16px; height:16px; stroke-width:3; }
.missingpanel{ display:grid; grid-template-columns:auto 1fr; gap:26px; align-items:center; padding:28px; border-radius:var(--r-card); border:var(--bw) dashed var(--num); background:var(--panel); box-shadow:var(--lift); animation:rise var(--d-med) var(--ease-out) both; }
.missingpanel h3{ margin:0 0 6px; font-family:var(--font-px); font-weight:400; font-size:24px; }
.missingpanel p{ margin:0 0 18px; font-family:var(--font-read); font-size:16px; color:var(--muted); max-width:560px; }

@media (min-width:1181px){
  .eps{ grid-template-columns:1fr 1fr; align-items:start; gap:14px; }
  .ep{ grid-template-columns:208px minmax(0,1fr); grid-template-rows:auto auto; gap:8px 16px; align-items:start; }
  .ep .th{ grid-row:1/3; }
  .ep .side{ grid-column:2; flex-direction:row; justify-content:space-between; align-items:center; }
  .ep.open{ grid-column:1/-1; }
}
/* about */
.about{ display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:22px; align-items:start; }
.panel{ background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--r-card); box-shadow:var(--lift); padding:20px 22px; }
.panel h3{ margin:0 0 10px; font-family:var(--font-px); font-weight:400; font-size:17px; letter-spacing:.03em; color:var(--muted); }
.panel + .panel{ margin-top:18px; }
.panel .story{ font-family:var(--font-read); font-size:16.5px; line-height:1.65; margin:0; max-width:70ch; }
.tags{ display:flex; flex-wrap:wrap; gap:8px; margin:0; padding:0; list-style:none; }
.tags a{ display:inline-flex; align-items:center; min-height:36px; padding:0 12px; border-radius:999px; border:var(--bw) solid var(--line); background:var(--nested); font-family:var(--font-read); font-size:14px; text-decoration:none; transition:border-color var(--d-micro); }
.tags a::before{ content:''; width:6px; height:6px; border-radius:2px; background:var(--accent); margin-right:8px; }
.tags a:hover{ border-color:var(--accent); }
.kv{ display:grid; grid-template-columns:max-content 1fr; gap:10px 18px; margin:0; font-size:14.5px; }
.kv dt{ color:var(--muted); font-family:var(--font-px); font-size:14px; padding-top:1px; }
.kv dd{ margin:0; font-family:var(--font-read); font-size:15.5px; }
.kv dd a{ text-underline-offset:3px; }
.extlinks{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
.extlinks a{ text-decoration:none; }
.extlinks .btn svg{ width:16px; height:16px; color:var(--muted); }
.ownercard{ border-style:dashed; border-color:var(--accent); background:color-mix(in srgb, var(--accent) 5%, var(--panel)); }
.ownercard h3{ display:flex; align-items:center; gap:8px; color:var(--text); }
.ownercard h3 .chip{ font-size:12px; padding:0 8px 0 6px; color:var(--accent); background:var(--accent-soft); }
.files{ list-style:none; margin:0 0 14px; padding:0; display:grid; gap:8px; }
.files li{ display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:10px 12px; border-radius:10px; background:var(--nested); border:1px solid var(--line); }
.files b{ font-family:var(--font-read); font-size:15px; }
.files code{ grid-column:1/-1; font-family:var(--font-mono); font-size:12px; color:var(--num); overflow-wrap:anywhere; }
.files .sz{ font-family:var(--font-mono); font-size:13px; color:var(--muted); }
.ownfacts{ font-family:var(--font-read); font-size:14.5px; color:var(--muted); margin:0 0 14px; display:grid; gap:6px; }
.ownfacts span{ display:flex; gap:8px; align-items:flex-start; }
.ownfacts svg{ width:17px; height:17px; margin-top:2px; color:var(--num); }
.ownercard .btns{ display:flex; flex-wrap:wrap; gap:10px; }
.ownercard{ margin-top:22px; }
.ownercard .oc{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:6px 26px; align-items:start; }

/* row scroll buttons for mouse users */
.trnav{ display:none; gap:8px; margin-left:auto; }
.trnav .iconbtn{ box-shadow:var(--lift-btn); transition:opacity var(--d-micro), border-color var(--d-micro), transform var(--d-micro) var(--ease); }
.trnav .iconbtn:active{ transform:translate(2px,2px); box-shadow:none; }
.trnav .iconbtn[disabled]{ opacity:.35; cursor:default; box-shadow:none; border-color:var(--line); }
@media (hover:hover) and (pointer:fine) and (min-width:761px){ .trnav{ display:flex; } }
.reportline{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-family:var(--font-read); color:var(--muted); }
.foot{ margin:44px 0 0; padding:18px 20px; border-radius:var(--r-card); border:var(--bw) dashed var(--line); font-family:var(--font-read); font-size:14.5px; color:var(--muted); display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:start; }
.foot h3{ margin:0 0 6px; font-family:var(--font-px); font-weight:400; font-size:16px; color:var(--text); }
.foot p{ margin:0 0 8px; max-width:88ch; }
.foot code{ font-family:var(--font-mono); font-size:12.5px; color:var(--num); }

/* ── Dialogs ── */
#layer:empty{ display:none; }
.scrim{ position:fixed; inset:0; z-index:120; background:rgba(8,6,4,.68); display:grid; place-items:center; padding:16px; animation:fadein var(--d-small) linear both; }
.dialog{ position:relative; width:min(540px, 100%); max-height:calc(100% - 16px); overflow:auto; background:var(--panel); border:var(--bw) solid var(--line); border-radius:16px; box-shadow:5px 5px 0 var(--shadow-c); padding:24px; animation:dlgin 240ms var(--ease-out) both; overscroll-behavior:contain; }
.dialog:focus{ outline:none; }
.dialog.wide{ width:min(720px, 100%); }
.dialog.video{ width:min(980px, 100%); padding:14px; }
.dialog .grab{ display:none; }
.dialog .x{ position:absolute; top:14px; right:14px; }
.dialog .head{ display:grid; grid-template-columns:72px 1fr; gap:16px; align-items:center; padding-right:50px; }
.dialog .head .ph{ width:72px; aspect-ratio:2/3; border-radius:8px; border:var(--bw) solid var(--line); overflow:hidden; }
.dialog .head .ph img{ width:100%; height:100%; object-fit:cover; }
.dialog h2{ margin:0 0 4px; font-family:var(--font-px); font-weight:400; font-size:24px; line-height:1.2; }
.dialog p.lead{ margin:0; font-family:var(--font-read); color:var(--muted); font-size:15.5px; }
.dialog .acts{ display:flex; gap:12px; justify-content:flex-end; margin-top:22px; flex-wrap:wrap; }
.dialog .acts .btn{ flex:1 1 180px; }
.dialog .acts.sticky{ position:sticky; bottom:-24px; z-index:3; margin:22px -24px -24px; padding:14px 24px 20px; background:var(--panel); border-top:1px dashed var(--line); border-radius:0 0 16px 16px; }
.gohint{ flex:1 1 100%; margin:0 0 -4px; font-family:var(--font-read); font-size:13.5px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.gohint svg{ width:16px; height:16px; }
.gohint[hidden]{ display:none; }
.blk{ margin-top:20px; }
.blk > .lbl{ display:block; font-family:var(--font-px); font-size:14px; letter-spacing:.03em; color:var(--muted); margin-bottom:8px; }
.blk > .lbl b{ font-weight:400; color:var(--text); }
.epsel{ margin-top:8px; }
.epsel[hidden]{ display:none; }

/* remove choices */
.rmopts{ display:grid; gap:10px; }
.rmopt{ position:relative; display:grid; grid-template-columns:auto 1fr; gap:4px 14px; padding:14px 16px; border-radius:12px; border:var(--bw) solid var(--line); background:var(--nested); cursor:pointer; transition:border-color var(--d-micro), background var(--d-small), transform var(--d-micro) var(--ease); }
.rmopt:hover{ border-color:var(--muted); }
.rmopt:has(input:checked){ border-color:var(--accent); background:var(--accent-soft); box-shadow:var(--lift-btn); }
.rmopt:has(input:focus-visible){ outline:3px solid var(--num); outline-offset:3px; }
.rmopt:has(input:disabled){ opacity:.6; cursor:not-allowed; }
.rmopt input{ position:absolute; opacity:0; width:1px; height:1px; }
.rmopt .dot{ grid-row:1/3; width:22px; height:22px; margin-top:2px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; transition:border-color var(--d-micro); }
.rmopt .dot::after{ content:''; width:10px; height:10px; border-radius:50%; background:var(--accent); transform:scale(0); transition:transform var(--d-small) var(--ease-spring); }
.rmopt:has(input:checked) .dot{ border-color:var(--accent); }
.rmopt:has(input:checked) .dot::after{ transform:scale(1); }
.rmopt .tt{ font-family:var(--font-read); font-weight:700; font-size:16.5px; line-height:1.3; }
.rmopt .dd{ font-family:var(--font-read); font-size:14.5px; color:var(--muted); line-height:1.45; }
.rmopt .gb{ grid-column:2; justify-self:start; margin-top:6px; }
.rmopt .gb .chip{ font-size:13.5px; white-space:normal; }
.rmopt .why3{ grid-column:2; font-family:var(--font-read); font-size:13.5px; color:var(--warn); margin-top:4px; }
.toggles{ display:grid; gap:8px; }
.tog{ display:grid; grid-template-columns:1fr auto; gap:2px 14px; align-items:center; padding:10px 14px; border-radius:12px; border:var(--bw) solid var(--line); background:var(--nested); cursor:pointer; }
.tog[aria-disabled="true"]{ opacity:.55; cursor:not-allowed; }
.tog .tt{ font-family:var(--font-read); font-weight:700; font-size:15.5px; }
.tog .dd{ grid-column:1; font-family:var(--font-read); font-size:13.5px; color:var(--muted); }
.tog .sw{ grid-row:1/3; grid-column:2; position:relative; width:50px; height:28px; border-radius:999px; border:var(--bw) solid var(--line); background:var(--panel); transition:background var(--d-small), border-color var(--d-small); }
.tog .sw::after{ content:''; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:var(--muted); transition:transform var(--d-small) var(--ease-spring), background var(--d-small); }
.tog input{ position:absolute; opacity:0; width:1px; height:1px; }
.tog:has(input:checked) .sw{ background:var(--accent-soft); border-color:var(--accent); }
.tog:has(input:checked) .sw::after{ transform:translateX(22px); background:var(--accent); }
.tog:has(input:focus-visible){ outline:3px solid var(--num); outline-offset:3px; }
.plan{ list-style:none; margin:0; padding:12px; display:grid; gap:8px; border-radius:12px; border:var(--bw) solid var(--line); background:var(--bg); }
.plan li{ display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:start; font-family:var(--font-read); font-size:14.5px; line-height:1.4; }
.plan li.skip{ color:var(--dim); }
.plan li code, .run li code{ font-family:var(--font-mono); font-size:12.5px; color:var(--num); overflow-wrap:anywhere; }
.app{ width:30px; height:24px; border-radius:6px; display:grid; place-items:center; font-family:var(--font-mono); font-weight:600; font-size:11px; border:1px solid currentColor; background:var(--panel); }
.app.radarr{ color:var(--warn); } .app.sonarr{ color:var(--info); } .app.qbit{ color:var(--num); } .app.seerr{ color:var(--accent); } .app.jf{ color:var(--ok); } .app.nf{ color:var(--text); } .app.chk{ color:var(--ok); }
.app svg{ width:15px; height:15px; }
.plan .nt{ border-top:1px dashed var(--line); padding-top:8px; color:var(--muted); }
.space{ margin-top:14px; padding:14px 16px; border-radius:12px; border:var(--bw) solid var(--num); background:var(--num-soft); font-family:var(--font-read); }
.space .big{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; font-weight:700; font-size:17px; }
.space .big span{ font-family:var(--font-mono); font-weight:600; color:var(--num); font-size:22px; }
.space .big span.zero{ color:var(--warn); }
.space p{ margin:4px 0 10px; font-size:14px; color:var(--muted); }
.drive{ position:relative; height:16px; border-radius:6px; border:1px solid var(--line); background:var(--panel); overflow:hidden; display:flex; }
.drive i{ display:block; height:100%; transition:width var(--d-large) var(--ease-out); }
.drive .used{ background:color-mix(in srgb, var(--text) 38%, var(--panel)); }
.drive .freeing{ background:repeating-linear-gradient(135deg, var(--num) 0 5px, color-mix(in srgb, var(--num) 55%, var(--panel)) 5px 10px); }
.drive .later{ background:repeating-linear-gradient(135deg, var(--warn) 0 5px, color-mix(in srgb, var(--warn) 45%, var(--panel)) 5px 10px); }
.drivekey{ display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:6px; font-family:var(--font-mono); font-size:12px; color:var(--muted); }
.drivekey i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
.confirmbox{ margin-top:18px; }
.confirmbox label{ display:block; font-family:var(--font-read); font-size:15px; margin-bottom:8px; }
.confirmbox label b{ font-family:var(--font-mono); background:var(--nested); border:1px solid var(--line); padding:0 6px; border-radius:4px; }
.confirmbox input{ width:100%; height:48px; padding:0 14px; border-radius:var(--r-ctl); border:var(--bw) solid var(--line); background:var(--nested); font-family:var(--font-mono); font-size:16px; }
.confirmbox input:focus{ outline:none; border-color:var(--accent); box-shadow:var(--lift-btn); }
.confirmbox input.match{ border-color:var(--ok); }
.confirmbox .perm{ display:flex; gap:8px; align-items:flex-start; margin-top:8px; font-family:var(--font-read); font-size:13.5px; color:var(--bad); }
.confirmbox .perm svg{ width:17px; height:17px; margin-top:1px; }
.run{ list-style:none; margin:18px 0 0; padding:0; display:grid; gap:10px; }
.run li{ display:grid; grid-template-columns:30px 30px 1fr; gap:10px; align-items:center; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--nested); font-family:var(--font-read); font-size:15px; transition:border-color var(--d-small), background var(--d-small), opacity var(--d-small); }
.run li.wait{ opacity:.55; }
.run li.doing{ border-color:var(--num); }
.run li.done{ border-color:color-mix(in srgb, var(--ok) 60%, var(--line)); }
.run li.fail{ border-color:var(--bad); background:var(--bad-soft); }
.run li.notdone{ opacity:.5; text-decoration:line-through; text-decoration-color:var(--dim); }
.st{ width:26px; height:26px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--line); }
.doing .st{ border-color:var(--num); border-top-color:transparent; animation:spin 800ms linear infinite; }
.done .st{ border-color:var(--ok); background:var(--ok); color:var(--accent-ink); }
.done .st svg{ width:15px; height:15px; stroke-width:3.2; }
.fail .st{ border-color:var(--bad); background:var(--bad); color:var(--accent-ink); }
.fail .st svg{ width:14px; height:14px; stroke-width:3.2; }
.run .msg{ grid-column:3; font-size:13.5px; color:var(--bad); }
.result{ display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; margin-top:18px; padding:14px 16px; border-radius:12px; border:var(--bw) solid var(--ok); background:var(--ok-soft); font-family:var(--font-read); animation:rise var(--d-med) var(--ease-out) both; }
.result.bad{ border-color:var(--bad); background:var(--bad-soft); }
.result b{ display:block; font-size:17px; }
.result span{ color:var(--muted); font-size:14.5px; }
/* report */
.opts{ display:grid; gap:8px; }
.opts label{ display:flex; align-items:center; gap:12px; min-height:48px; padding:0 14px; border-radius:10px; border:var(--bw) solid var(--line); background:var(--nested); font-family:var(--font-read); font-size:15.5px; cursor:pointer; }
.opts label:has(input:checked){ border-color:var(--accent); background:var(--accent-soft); }
.opts input{ width:20px; height:20px; accent-color:var(--accent); flex:none; }
textarea{ width:100%; min-height:84px; padding:10px 14px; border-radius:var(--r-ctl); border:var(--bw) solid var(--line); background:var(--nested); font-family:var(--font-read); font-size:15.5px; resize:vertical; }
textarea:focus{ outline:none; border-color:var(--accent); }
.attach{ margin-top:12px; padding:10px 14px; border-radius:10px; border:1px dashed var(--line); font-family:var(--font-read); font-size:13.5px; color:var(--muted); }
.attach code{ font-family:var(--font-mono); font-size:12.5px; color:var(--num); }
.okview{ text-align:center; padding:8px 0 0; }
.okview h2{ margin-top:12px; }
.okview p{ font-family:var(--font-read); color:var(--muted); max-width:380px; margin:0 auto; }
.vid{ position:relative; aspect-ratio:16/9; border-radius:10px; overflow:hidden; border:var(--bw) solid var(--line); }
.vid img{ width:100%; height:100%; object-fit:cover; }
.vid .pl{ position:absolute; inset:0; display:grid; place-items:center; background:linear-gradient(0deg, rgba(0,0,0,.55), transparent 60%); }
.vid .pl button{ width:84px; height:84px; border-radius:50%; border:0; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; cursor:pointer; box-shadow:var(--lift-hi); transition:transform var(--d-micro) var(--ease); }
.vid .pl button:hover{ transform:scale(1.06); }
.vid .pl svg{ width:34px; height:34px; }
.vid .cap{ position:absolute; left:14px; bottom:12px; right:14px; color:#f2ead8; font-family:var(--font-read); font-size:14.5px; }
.vid .vbar{ position:absolute; left:14px; right:14px; bottom:44px; height:5px; border-radius:3px; background:rgba(255,255,255,.25); overflow:hidden; }
.vid .vbar i{ display:block; height:100%; width:0; background:var(--accent); }
.vid.playing .vbar i{ animation:vplay 20s linear both; }
@keyframes vplay{ to{ width:100%; } }
.toasts{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:330; display:flex; flex-direction:column; gap:8px; width:min(480px, calc(100% - 32px)); pointer-events:none; }
.toast{ display:flex; align-items:center; gap:12px; padding:10px 12px 10px 16px; background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--r-card); box-shadow:var(--lift); font-family:var(--font-read); font-size:15.5px; pointer-events:auto; animation:toastin 260ms var(--ease-spring) both; }
.toast span{ flex:1; }
.toast > svg{ color:var(--ok); }
.toast.leaving{ animation:toastout 180ms var(--ease-in) both; }
@keyframes toastin{ from{ opacity:0; transform:translateY(16px) scale(.98); } }
@keyframes toastout{ to{ opacity:0; transform:translateY(8px); } }
.nb{ display:inline-block; flex:none; }
.nb.blink .eyes{ animation:blink 4.5s infinite; transform-origin:50% 45%; }
@keyframes blink{ 0%,94%,100%{ transform:scaleY(1); } 96%{ transform:scaleY(.1); } }
.nb.hop{ animation:hop .6s var(--ease) 1; }
@keyframes hop{ 30%{ transform:translateY(-8px) rotate(-4deg); } 60%{ transform:translateY(0) rotate(2deg); } }
#page.swap{ animation:fadein var(--d-med) linear both; }

.t-nutbot{background:var(--panel)!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.account-menu{position:fixed;z-index:510;right:18px;top:90px;width:280px;max-width:calc(100% - 32px);border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);padding:16px;font-family:var(--font-read)}
.account-menu h2{font:700 17px var(--font-read);margin:0 0 3px}.account-menu p{font-size:13px;color:var(--muted);margin:0 0 16px}
.account-menu button{font:inherit;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--nested);color:var(--text);cursor:pointer}
.account-menu .account-out{width:100%;text-align:left;margin-top:12px}
.nf-disclosure{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nf-disclosure summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;cursor:pointer;font-size:14px;font-weight:700}
.nf-disclosure summary::-webkit-details-marker{display:none}.nf-disclosure summary::after{content:'⌄';transition:transform .15s}.nf-disclosure[open] summary::after{transform:rotate(180deg)}
.nf-disclosure>div{padding:0 0 14px;color:var(--muted);font-family:var(--font-read);font-size:14px;line-height:1.5}
.nf-disclosure .appearance{display:flex;gap:8px}
@media(prefers-reduced-motion:reduce){.nf-disclosure summary::after{transition:none}}

/* ── Side navigation (same as Home) ── */
.sidenav{display:none}
@media (min-width:761px){
  body{padding-left:92px}
  .mock{margin-left:-92px;padding-left:104px}
  .sidenav{display:flex;flex-direction:column;align-items:center;gap:6px;position:fixed;left:0;top:var(--mockh);bottom:0;width:92px;z-index:55;padding:12px 8px;background:var(--nested);border-right:var(--bw) solid var(--line)}
  .sidenav .rbrand{display:grid;place-items:center;width:100%;height:56px;margin-bottom:8px;border-radius:12px;text-decoration:none}
  .sidenav .rbrand:hover{background:var(--panel)}
  .sidenav .snav{display:flex;flex-direction:column;gap:6px;width:100%}
  .sidenav .snav > *{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:62px;padding:8px 0;border:var(--bw) solid transparent;background:none;border-radius:12px;font-family:var(--font-read);font-weight:700;font-size:12px;color:var(--dim);text-decoration:none;cursor:pointer}
  .sidenav .snav > *:hover{background:var(--panel);color:var(--text)}
  .sidenav .snav svg{width:22px;height:22px}
  .sidenav .snav [aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
  .sidenav .snav .badge{position:absolute;top:6px;right:16px}
  .top .brand,.top > .nav{display:none}
}

<script>
/* ════════ Helpers (same motion helpers as v3) ════════ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const RMQ = matchMedia('(prefers-reduced-motion: reduce)');
const RM = () => RMQ.matches;
const D = ms => RM() ? 0 : ms;
const EO = 'cubic-bezier(.22,1,.36,1)';
const wait = ms => new Promise(r=>setTimeout(r, D(ms)));
const hasVT = typeof document.startViewTransition === 'function';
function anim(el, kf, o={}){ if(!el || !el.animate) return null; try{ return el.animate(kf, {...o, duration:D(o.duration||0), delay:D(o.delay||0)}); }catch(_){ return null; } }
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, cls='') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const hue = s => { let h=0; for (const c of String(s)) h=(h*31 + c.charCodeAt(0))>>>0; return h%360; };
const ph = (seed, label='') => `style="--h:${hue(seed)};--h2:${(hue(seed)+55)%360}"${label?` data-t="${esc(label)}"`:''}`;
const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const gb = n => (Math.round(n*10)/10).toFixed(1)+' GB';
const live = msg => { const l=$('#live'); l.textContent=''; setTimeout(()=>l.textContent=msg, 30); };

/* failed pictures fall back to their gradient; a missing logo falls back to the title text */
document.addEventListener('error', e=>{
  const t = e.target; if (!t || t.tagName!=='IMG') return;
  t.classList.add('broken');
  if (t.classList.contains('logo')) t.closest('.ttl')?.classList.remove('haslogo');
}, true);

/* NutBot: beige CRT head, two cyan eye bars (same drawing as v3). mood: idle | happy | sleepy | look */
let nbN = 0;
function nutbot(size=48, mood='idle', cls=''){
  const eyes = {
    idle:`<rect x="20" y="25" width="8" height="13" rx="2"/><rect x="36" y="25" width="8" height="13" rx="2"/>`,
    happy:`<path d="M19 34q5-8 10 0M35 34q5-8 10 0" fill="none" stroke="#3fe0f0" stroke-width="3.5" stroke-linecap="round"/>`,
    sleepy:`<rect x="19" y="31" width="10" height="3.5" rx="1.5"/><rect x="35" y="31" width="10" height="3.5" rx="1.5"/>`,
    look:`<rect x="23" y="26" width="8" height="12" rx="2"/><rect x="39" y="26" width="8" height="12" rx="2"/>`,
  }[mood];
  const gid = 'nbg'+(nbN++);
  return `<svg class="nb ${cls} ${mood==='idle'?'blink':''}" width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eae4da"/><stop offset=".55" stop-color="#cdc7bb"/><stop offset="1" stop-color="#bcb6aa"/></linearGradient></defs>
    <rect x="3" y="21" width="5" height="14" rx="1.5" fill="#c4bdb0" stroke="#9c907e" stroke-width="1.5"/>
    <rect x="56" y="21" width="5" height="14" rx="1.5" fill="#c4bdb0" stroke="#9c907e" stroke-width="1.5"/>
    <rect x="7" y="8" width="50" height="46" rx="11" fill="url(#${gid})" stroke="#9c907e" stroke-width="2.5"/>
    <rect x="13" y="14" width="38" height="30" rx="6" fill="#040302" stroke="#504840" stroke-width="2"/>
    <g class="eyes" fill="#3fe0f0" style="filter:drop-shadow(0 0 2px #00b4c8)">${eyes}</g>
    <rect x="14" y="48" width="7" height="2.5" rx="1" fill="#9c907e"/><rect x="23" y="48" width="7" height="2.5" rx="1" fill="#9c907e"/>
    <circle cx="49" cy="49" r="2.2" fill="#00b4c8"/>
  </svg>`;
}

function wireTracks(root=document){
  $$('.track', root).forEach(tr=>{
    const head = $('.sechead', tr.closest('.section')||root); if (!head) return;

function toast(msg, icon='check', action){
  const t = document.createElement('div'); t.className='toast';
  t.innerHTML = `${ic(icon)}<span>${msg}</span>${action?`<button class="btn sm">${action.label}</button>`:''}`;
  if (action) t.querySelector('button').onclick = ()=>{ action.fn(); out(); };

function closeDialog(after){
  if (Run.busy) return;
  const d = $('.dialog'); if(!d) return;
  /* closing a finished or stopped Remove run: the page must show what changed */
  if (typeof after!=='function' && $('#runlist', d)) after = ()=>{ paint({keepScroll:true}); ($('.banner .btn') || $('#moreBtn'))?.focus({preventScroll:true}); };
  const finish = ()=>{
    $('#layer').innerHTML = '';

  if (a) a.onfinish = finish; else finish();
}
document.addEventListener('keydown', e=>{

    if (!f.length) return;

const R = { scope:'all', ep:3, mode:1, noRedl:true, reReq:true, typed:'' };
function rmReset(scope='all', ep=3){ Object.assign(R, {scope, ep, mode: scope==='ep' ? 2 : 1, forced: scope==='ep', noRedl:true, reReq:true, typed:''}); }

/* What will happen, worked out the same way nuke-show does: library files + the torrents that share their data */
function plan(){
  const it = IT(), series = it.kind==='series';
  const p = { steps:[], nt:[], freeNow:0, freeLater:0, can1:true, why1:'', togOK:true, togWhy:'', reqOK:true, reqWhy:'', scopeLabel:'', size:0 };
  let files, torrents, appName = series?'Sonarr':'Radarr', app = series?'sonarr':'radarr', whole = R.scope==='all';
  if (!series){
    const vs = R.scope==='all' ? it.versions : it.versions.filter(v=>v.k===R.scope);
    p.size = vs.reduce((a,v)=>a+v.size,0);
    torrents = vs.map(v=>v.torrent);
    p.scopeLabel = R.scope==='all' ? 'the whole movie' : `the ${vs[0].label} version`;
    files = R.scope==='all' ? `Delete the movie and its folder (${vs.length} files, ${gb(p.size)})` : `Delete only <code>${esc(vs[0].file)}</code>. The ${it.versions.find(v=>v.k!==R.scope).label} version stays.`;
    if (!whole){ p.togOK = false; p.togWhy = 'Only when removing the whole movie.'; p.reqOK = false; p.reqWhy = 'The movie stays in the library, so the request stays.'; }
  } else if (R.scope==='all'){
    p.size = it.seasons[1].size + it.seasons[2].size;
    torrents = [it.seasons[1].torrent, it.seasons[2].torrent];
    p.scopeLabel = 'the whole show';
    files = `Delete Silo and its folder (20 files, ${gb(p.size)})`;
  } else if (R.scope==='season'){
    p.size = it.seasons[2].size; torrents = [it.seasons[2].torrent];
    p.scopeLabel = 'season 2';
    files = `Delete the 10 episode files of season 2 (${gb(p.size)}). Season 1 stays.`;
  } else {
    const e = S2.find(x=>x.e===R.ep);
    p.size = epSize(e); torrents = [it.seasons[2].torrent];
    p.scopeLabel = `episode ${e.e}, "${e.n}"`;
    files = `Delete <code>Silo - S02E${String(e.e).padStart(2,'0')} - ${esc(e.n)}.mkv</code> (${gb(p.size)})`;
    p.can1 = false; p.why1 = `This episode came inside the season 2 pack, which is still sharing. Stopping that would delete the whole season's download. To free space, remove season 2 instead.`;
    p.reqOK = false; p.reqWhy = 'Seerr only tracks whole seasons.';
  }
  if (!p.can1 && R.mode===1){ R.mode = 2; R.forced = true; }
  const m = R.mode;
  if (m===3){
    p.steps.push(['nf', `Hide ${esc(it.t)} from NutFin rows and search for everyone`]);
    p.steps.push(['skip', `${appName}, qBittorrent and Seerr: not touched. Files stay where they are.`]);
    p.togOK = false; p.togWhy = 'Nothing is deleted, so there is nothing to stop.'; p.reqOK = false; p.reqWhy = p.togWhy;
    return p;
  }
  p.steps.push(['find', `Find the downloads that share these files (checks the files themselves, not names)`]);
  p.steps.push([app, `${appName}: ${files}`]);
  torrents.forEach(t => p.steps.push(['qbit', m===1 ? `qBittorrent: remove <code>${esc(t)}</code> + its data` : `qBittorrent: keep sharing <code>${esc(t)}</code> (its files stay in Downloads)`]));
  if (p.togOK && R.noRedl) p.steps.push([app, series ? (R.scope==='all' ? `${appName}: add Silo to the don't-download list (import list exclusion)` : R.scope==='season' ? `${appName}: stop watching season 2 (unmonitor)` : `${appName}: stop watching this episode (unmonitor)`) : `${appName}: add to the don't-download list (import exclusion)`]);
  if (p.reqOK){
    const who2 = it.req.who===OWNER ? `${it.req.who} (you)` : it.req.who;
    p.steps.push(R.reReq ? ['seerr', `Seerr: clear ${R.scope==='season'?'the season 2 request':'the request'} by ${who2}, so it can be asked for again`] : ['skip', `Seerr: keep the request by ${who2}. Nobody can ask for it again until you clear it.`]);
  }
  p.steps.push(['jf', `Jellyfin: refresh ${series?'TV Shows':'Movies'} so it disappears on every screen`]);
  p.steps.push(['chk', m===1 ? `Measure the media drive to confirm ${gb(p.size)} came back` : `Measure the media drive (nothing should come back yet)`]);
  if (!series && m===1 && R.scope!=='hd') p.nt.push(`Not touched: <code>${esc(it.related)}</code>. The name looks related, but it shares no files with this movie.`);
  if (m===1) p.freeNow = p.size; else p.freeLater = p.size;
  return p;
}

/* Removing... checklist that ticks each step */
const Run = { busy:false, failedAt:-1 };
async function runRemove(from=0){
  const it = IT(), p = plan();
  const steps = p.steps.filter(([k])=>k!=='skip');
  /* mockup: fail where a real outage would hurt most (qBittorrent for option 1, the Jellyfin refresh for option 2) */
  const failAt = S.fail && R.mode!==3 ? steps.findIndex(([k])=>k===(R.mode===1?'qbit':'jf')) : -1;
  const w = $('#rmwrap');
  w.innerHTML = `<div class="head"><div class="ph" ${ph(it.id, it.t)}><img src="${IMG(it.id,'Primary',200)}" alt=""></div>
      <div><h2 id="runh">${R.mode===3?'Hiding':'Removing'} ${esc(it.t)}...</h2><p class="lead" id="runlead">${from?`Picking up at step ${from+1}. Steps already done are not repeated.`:'The NutFin helper on the server is doing each step in order.'}</p></div></div>
    <ol class="run" id="runlist">${steps.map(([k,t])=>`<li class="wait"><span class="st" aria-hidden="true"></span>${appBadge(k)}<span>${t}</span></li>`).join('')}</ol>
    <div id="runend"></div>`;
  Run.busy = true;
  $('.dialog [data-close].x')?.setAttribute('disabled','');
  const lis = $$('#runlist li');
  let failed = -1;
  for (let i=0;i<from;i++){ lis[i].className = 'done'; $('.st', lis[i]).innerHTML = ic('check'); }
  for (let i=from;i<lis.length;i++){
    const li = lis[i];
    li.className = 'doing';
    await wait(560 + (steps[i][0]==='chk' ? 500 : 0));
    if (i===failAt){
      li.className = 'fail'; $('.st', li).innerHTML = ic('x');
      li.insertAdjacentHTML('beforeend', `<span class="msg">${steps[i][0]==='qbit'?'qBittorrent':'Jellyfin'} didn't answer. Nothing after this step was done.</span>`);
      failed = i; break;
    }
    li.className = 'done'; $('.st', li).innerHTML = ic('check', RM()?'':'draw');
    live(`Done: ${li.textContent.trim()}`);
  }
  Run.busy = false;
  $('.dialog .x')?.removeAttribute('disabled');
  const end = $('#runend');
  if (failed>=0){
    lis.slice(failed+1).forEach(l=>l.className='notdone');
    Run.failedAt = failed;
    const appN = IT().kind==='series'?'Sonarr':'Radarr';
    const qb = steps[failed][0]==='qbit';
    const why = qb
      ? `${appN} already deleted the library copy, so it's gone from NutFin. The download is still there, so no space came back yet.`
      : `The library copy is deleted, but Jellyfin hasn't refreshed, so it may still show on some screens for a few minutes.`;
    end.innerHTML = `<div class="result bad">${nutbot(44,'sleepy')}<div><b>Stopped at step ${failed+1} of ${steps.length}</b><span>${why} Try again picks up from step ${failed+1}; nothing is done twice.</span></div></div>
      <div class="acts"><button class="btn" data-close>Close for now</button><button class="btn primary" data-retry>${ic('restart')}Try again from step ${failed+1}</button></div>`;
    $('#runh').textContent = 'Something went wrong';
    $('#runlead').textContent = `Steps 1 to ${failed} are done. Step ${failed+1} didn't finish, and nothing after it was touched.`;
    S.removed = { mode:R.mode, whole:R.scope==='all', partial:true, title:`${IT().t} is only partly removed`, note:`${qb?'qBittorrent':'Jellyfin'} didn't answer at step ${failed+1}. Open Remove again and it picks up where it stopped.` };
    live(`Stopped at step ${failed+1}. ${qb?'qBittorrent':'Jellyfin'} didn't answer.`);
    $('[data-retry]', end).focus();
    return;
  }
  const whole = R.scope==='all';
  const sz = gb(p.size);
  let title, note;
  if (R.mode===1){ title = `${whole?'Removed everywhere':'Removed '+p.scopeLabel}. ${sz} freed.`; note = `Checked the media drive: ${gb(DRIVE.free+p.size)} free now.${R.reReq&&p.reqOK?' People can ask for it again.':''}`; }
  else if (R.mode===2){ title = `Removed ${whole?'from the library':p.scopeLabel}. Still sharing.`; note = `0 GB freed now, as expected. ${sz} comes back when qBittorrent stops sharing.`; }
  end.innerHTML = R.mode===3
    ? `<div class="result">${nutbot(44,'happy')}<div><b>Hidden from NutFin</b><span>Nothing was deleted. You can undo this any time from its page.</span></div></div><div class="acts"><button class="btn" data-undo>${ic('undo')}Undo</button><button class="btn primary" data-done>Done</button></div>`
    : `<div class="result">${nutbot(44,'happy','hop')}<div><b>${esc(title)}</b><span>${esc(note)}</span></div></div><div class="acts"><button class="btn primary" data-done>Done</button></div>`;
  $('#runh').textContent = R.mode===3 ? 'Hidden' : 'Done';
  live(R.mode===3 ? 'Hidden from NutFin.' : title);
  S.removed = { mode:R.mode, whole, title: title||'', note: note||'' };
  Run.failedAt = -1;
  $('[data-done]', end).focus();
}
