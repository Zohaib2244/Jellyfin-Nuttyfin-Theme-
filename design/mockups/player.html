<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutFin Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ── Nutstyle Ember tokens (same as v5 details). The player is always dark: it is a cinema. ── */
:root{
  color-scheme: dark;
  --font-px:'DotGothic16', ui-monospace, monospace;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
  --font-read:'Atkinson Hyperlegible', 'JetBrains Mono', sans-serif;
  --mockh:40px; --gut:40px;

  --ease:cubic-bezier(.33,1,.68,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --d-micro:120ms; --d-small:200ms; --d-med:280ms; --d-large:420ms; --d-hero:700ms;

  --bg:#13100c; --panel:#1e1a14; --nested:#1a1610; --line:#3d3220;
  --text:#e8dfc8; --muted:#b5b0a3; --dim:#8b8576;
  --accent:#ff6b2b; --accent-ink:#13100c; --num:#00b4c8;
  --glass:color-mix(in srgb, #1e1a14 88%, transparent);
  --hair:rgba(232,223,200,.14);
  --wash:rgba(232,223,200,.08);
  --ink:#0b0907;
}
@media (prefers-reduced-motion: reduce){
  :root{ --d-micro:0ms; --d-small:0ms; --d-med:0ms; --d-large:0ms; --d-hero:0ms; }
}

*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--ink); }
body{ color:var(--text); font-family:var(--font-read); font-size:15px; line-height:1.5; overflow:hidden; -webkit-font-smoothing:antialiased; }
img{ display:block; max-width:100%; }
img.broken{ opacity:0 !important; }
button, input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--num); outline-offset:3px; border-radius:8px; }
.sr{ position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
svg.i{ width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

/* every picture sits on a warm gradient, so a failed image still looks designed */
.ph{ background:
  radial-gradient(120% 80% at 18% 12%, hsl(var(--h,24) 70% 50% / .45), transparent 60%),
  radial-gradient(90% 70% at 92% 100%, hsl(var(--h2,190) 60% 40% / .38), transparent 62%),
  linear-gradient(160deg, hsl(var(--h,24) 30% 18%), hsl(var(--h2,190) 30% 7%)); }

/* ── Mockup strip (not part of the app), same as the other v5 pages ── */
.mock{ position:fixed; top:0; left:0; right:0; z-index:400; display:flex; align-items:center; gap:6px; height:var(--mockh); padding:0 12px; background:repeating-linear-gradient(135deg,#2a2a2a 0 10px,#262626 10px 20px); border-bottom:2px dashed #5a5a5a; overflow-x:auto; scrollbar-width:none; font-family:system-ui, sans-serif; }
.mock::-webkit-scrollbar{ display:none; }
.mock b{ font-size:11px; letter-spacing:.12em; color:#c9c9c9; text-transform:uppercase; padding-right:4px; white-space:nowrap; }
.mock .sep{ flex:none; width:1px; height:20px; background:#555; margin:0 6px; }
.mock .lab{ flex:none; color:#aaa; font-size:11.5px; white-space:nowrap; }
.mock button, .mock a{ flex:none; border:1px solid #555; background:#333; color:#ddd; border-radius:999px; padding:4px 11px; font-size:12px; cursor:pointer; white-space:nowrap; text-decoration:none; line-height:1.4; }
.mock [aria-current="page"], .mock [aria-pressed="true"]{ background:#ddd; color:#111; border-color:#ddd; }
.mock a{ border-style:dashed; }

/* ════════ Stage ════════ */
.stage{ position:fixed; left:0; right:0; top:var(--mockh); bottom:0; overflow:hidden; background:var(--ink); isolation:isolate; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
.stage[data-ui="off"].playing{ cursor:none; }
.stage:fullscreen{ top:0; }

/* the picture: full-bleed on wide screens, a 16:9 letterboxed frame on a phone held upright */
.frame{ position:absolute; inset:0; overflow:hidden; }
.scenes, .layer{ position:absolute; inset:0; }
.layer{ opacity:0; transition:opacity 1600ms var(--ease); }
.layer.on{ opacity:1; }
.layer img{ width:100%; height:100%; object-fit:cover; transform-origin:50% 45%; will-change:transform; }
.layer.h1{ --h:24; --h2:200; } .layer.h2{ --h:32; --h2:14; } .layer.h3{ --h:190; --h2:30; }
/* slow drifting light, so the gradient-only fallback still feels alive */
.scenes::after{ content:""; position:absolute; inset:-20%; background:
  radial-gradient(40% 30% at 30% 40%, rgba(255,140,70,.10), transparent 70%),
  radial-gradient(35% 30% at 70% 65%, rgba(0,180,200,.07), transparent 70%);
  animation:drift 38s var(--ease) infinite alternate; pointer-events:none; mix-blend-mode:screen; }
.stage:not(.playing) .scenes::after{ animation-play-state:paused; }
@keyframes drift{ to{ transform:translate(6%, -4%) rotate(4deg); } }
.vignette{ position:absolute; inset:0; pointer-events:none; background:
  radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(5,4,3,.55) 100%),
  linear-gradient(180deg, rgba(5,4,3,.22), transparent 18%, transparent 82%, rgba(5,4,3,.28)); }
.dim{ position:absolute; inset:0; background:#060504; opacity:0; pointer-events:none; transition:opacity 900ms var(--ease); }
.stage.paused .dim{ opacity:.38; }
.stage.credits .dim{ opacity:.3; }
.titlecard{ position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; opacity:0; transition:opacity 2200ms var(--ease); font-family:var(--font-px); font-size:clamp(34px, 7vw, 88px); letter-spacing:.42em; padding-left:.42em; text-transform:uppercase; color:rgba(240,232,214,.9); text-shadow:0 2px 30px rgba(0,0,0,.5); }
.titlecard.on{ opacity:1; }

/* subtitles */
.subs{ position:absolute; left:8%; right:8%; bottom:8%; margin:0; text-align:center; pointer-events:none; transition:transform var(--d-large) var(--ease-out); }
.subs span{ display:inline; font-family:var(--font-read); font-weight:700; font-size:calc(clamp(17px, 2.3vw, 32px) * var(--subsz,1)); line-height:1.35; color:#fbf6ea; text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 14px rgba(0,0,0,.55); -webkit-box-decoration-break:clone; box-decoration-break:clone; padding:.05em .3em; border-radius:4px; }
.subs.box span{ background:rgba(10,8,6,.72); text-shadow:none; }
.subs:empty{ display:none; }
.stage[data-ui="on"] .subs{ transform:translateY(-92px); }

/* centre glyph: shown only when something toggles, then gone */
.flash{ position:absolute; left:50%; top:50%; width:84px; height:84px; margin:-42px 0 0 -42px; border-radius:50%; display:grid; place-items:center; background:rgba(16,13,10,.46); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); color:#fbf6ea; opacity:0; pointer-events:none; }
.flash svg.i{ width:34px; height:34px; }
.flash .t{ position:absolute; top:100%; margin-top:10px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:14px; color:#f3ecdc; text-shadow:0 1px 6px rgba(0,0,0,.7); }
.flash.go{ animation:flash 760ms var(--ease-out) both; }
@keyframes flash{ 0%{ opacity:0; transform:scale(.9); } 22%{ opacity:1; transform:scale(1); } 70%{ opacity:1; } 100%{ opacity:0; transform:scale(1.04); } }

/* double-tap ripples (touch) */
.ripple{ position:absolute; top:0; bottom:0; width:42%; display:grid; place-items:center; pointer-events:none; opacity:0; color:#fbf6ea; font-size:14px; }
.ripple.l{ left:0; border-radius:0 50% 50% 0 / 0 50% 50% 0; }
.ripple.r{ right:0; border-radius:50% 0 0 50% / 50% 0 0 50%; }
.ripple::before{ content:""; position:absolute; inset:0; border-radius:inherit; background:rgba(232,223,200,.10); }
.ripple em{ font-style:normal; }
.ripple span{ position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; text-shadow:0 1px 6px rgba(0,0,0,.6); }
.ripple.go{ animation:ripple 700ms var(--ease-out) both; }
@keyframes ripple{ 0%{ opacity:0; } 20%{ opacity:1; } 70%{ opacity:1; } 100%{ opacity:0; } }

/* ════════ Chrome (fades in on movement, out after ~3 s) ════════ */
.ui{ opacity:0; visibility:hidden; transform:translateY(8px); transition:opacity 600ms var(--ease), transform 600ms var(--ease), visibility 0s linear 600ms; }
.topbar.ui{ transform:translateY(-8px); }
.scrim.ui{ transform:none; }
.stage[data-ui="on"] .ui{ opacity:1; visibility:visible; transform:none; transition:opacity 380ms var(--ease-out), transform 460ms var(--ease-out), visibility 0s; }
.scrim{ position:absolute; left:0; right:0; pointer-events:none; }
.scrim.top{ top:0; height:160px; background:linear-gradient(180deg, rgba(8,6,5,.72), rgba(8,6,5,.28) 55%, transparent); }
.scrim.bot{ bottom:0; height:240px; background:linear-gradient(0deg, rgba(8,6,5,.86), rgba(8,6,5,.4) 55%, transparent); }

.ibtn{ position:relative; display:inline-grid; place-items:center; width:46px; height:46px; padding:0; border:0; border-radius:50%; background:transparent; color:#f3ecdc; flex:none; transition:background var(--d-small) var(--ease), color var(--d-small) var(--ease); }
.ibtn:hover{ background:var(--wash); }
.ibtn:active{ background:rgba(232,223,200,.14); }
.ibtn[hidden]{ display:none; }
/* quiet tooltips that name the shortcut */
.ibtn[data-tip]::after{ content:attr(data-tip); position:absolute; bottom:calc(100% + 8px); left:50%; transform:translate(-50%, 4px); padding:5px 10px; border-radius:7px; background:rgba(24,20,15,.94); border:1px solid var(--hair); color:var(--text); font-size:12.5px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity var(--d-small) var(--ease), transform var(--d-small) var(--ease); }
.ibtn[data-tip]:hover::after, .ibtn[data-tip]:focus-visible::after{ opacity:1; transform:translate(-50%, 0); transition-delay:350ms; }
.ctl-r .ibtn[data-tip]:last-child::after{ left:auto; right:0; transform:translateY(4px); }
.ctl-r .ibtn[data-tip]:last-child:hover::after, .ctl-r .ibtn[data-tip]:last-child:focus-visible::after{ transform:none; }
.topbar .ibtn[data-tip]::after{ bottom:auto; top:calc(100% + 8px); left:0; transform:translateY(-4px); }
.topbar .ibtn[data-tip]:hover::after, .topbar .ibtn[data-tip]:focus-visible::after{ transform:none; }

.topbar{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:14px; padding:calc(20px + env(safe-area-inset-top)) var(--gut) 0 calc(var(--gut) - 10px); }
.topbar .back svg.i{ width:24px; height:24px; }
.ttl{ display:flex; flex-direction:column; min-width:0; line-height:1.25; }
.ttl .show{ font-family:var(--font-px); font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
.ttl .ep{ font-size:17px; color:#f3ecdc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ttl .ep .sx{ color:var(--muted); }

.bar{ position:absolute; left:0; right:0; bottom:0; padding:0 var(--gut) calc(18px + env(safe-area-inset-bottom)); }
.seekrow{ display:flex; align-items:center; gap:16px; }
.time{ font-family:var(--font-mono); font-size:13px; font-variant-numeric:tabular-nums; color:#e6dfcd; min-width:52px; }
.time.rem{ text-align:right; border:0; background:none; padding:6px 0; border-radius:6px; }
.time.rem:hover{ color:#fff; }

.scrub{ position:relative; flex:1; height:28px; display:flex; align-items:center; cursor:pointer; touch-action:none; }
.scrub:focus-visible{ outline-offset:2px; }
.track{ position:relative; width:100%; height:3px; border-radius:3px; background:rgba(232,223,200,.22); transition:height var(--d-small) var(--ease); }
.scrub:hover .track, .scrub.drag .track, .scrub:focus-visible .track{ height:6px; }
.track i{ position:absolute; left:0; top:0; bottom:0; border-radius:inherit; }
.track .buf{ background:rgba(232,223,200,.22); }
.track .hov{ background:rgba(232,223,200,.22); opacity:0; transition:opacity var(--d-small); }
.scrub:hover .track .hov{ opacity:1; }
.track .fill{ background:var(--accent); }
.knob{ position:absolute; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:#fbf6ea; box-shadow:0 1px 4px rgba(0,0,0,.5); transform:scale(0); transition:transform var(--d-small) var(--ease-out); }
.scrub:hover .knob, .scrub.drag .knob, .scrub:focus-visible .knob{ transform:scale(1); }
.peek{ position:absolute; bottom:calc(100% + 10px); left:0; width:192px; transform:translateX(-50%) translateY(4px); opacity:0; pointer-events:none; transition:opacity var(--d-small) var(--ease), transform var(--d-small) var(--ease); }
.peek.on{ opacity:1; transform:translateX(-50%); }
.peek .thumb{ position:relative; aspect-ratio:16/9; border-radius:8px; overflow:hidden; border:1px solid var(--hair); box-shadow:0 10px 30px rgba(0,0,0,.5); }
.peek .thumb img{ width:100%; height:100%; object-fit:cover; }
.peek .pt{ display:block; margin-top:8px; text-align:center; font-family:var(--font-mono); font-size:13px; font-variant-numeric:tabular-nums; color:#fbf6ea; text-shadow:0 1px 4px rgba(0,0,0,.8); }

.ctlrow{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
.ctl-l, .ctl-r{ display:flex; align-items:center; gap:6px; }
.ctl-l{ margin-left:-11px; } .ctl-r{ margin-right:-11px; }
.ibtn.play svg.i{ width:26px; height:26px; }
.vol{ display:flex; align-items:center; }
.vol input{ width:0; opacity:0; margin:0; transition:width var(--d-med) var(--ease), opacity var(--d-med) var(--ease), margin var(--d-med) var(--ease); }
.vol:hover input, .vol:focus-within input{ width:92px; opacity:1; margin:0 10px 0 2px; }
input[type=range]{ -webkit-appearance:none; appearance:none; height:22px; background:transparent; cursor:pointer; }
input[type=range]::-webkit-slider-runnable-track{ height:3px; border-radius:3px; background:linear-gradient(90deg, #f3ecdc var(--v,100%), rgba(232,223,200,.25) var(--v,100%)); }
input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:12px; height:12px; margin-top:-4.5px; border-radius:50%; background:#fbf6ea; border:0; }
input[type=range]::-moz-range-track{ height:3px; border-radius:3px; background:rgba(232,223,200,.25); }
input[type=range]::-moz-range-progress{ height:3px; border-radius:3px; background:#f3ecdc; }
input[type=range]::-moz-range-thumb{ width:12px; height:12px; border-radius:50%; background:#fbf6ea; border:0; }

/* centre trio: touch screens only */
.center{ position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); display:none; align-items:center; gap:44px; }
.stage[data-ui="on"] .center.ui{ transform:translate(-50%, -50%); }
.center.ui{ transform:translate(-50%, calc(-50% + 8px)); }
.center .ibtn{ width:60px; height:60px; background:rgba(16,13,10,.34); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.center .ibtn svg.i{ width:28px; height:28px; }
.center .ibtn.play{ width:76px; height:76px; }
.center .ibtn.play svg.i{ width:34px; height:34px; }

/* ════════ Moment cards ════════ */
.pill{ display:inline-flex; align-items:center; gap:10px; min-height:46px; padding:0 20px; border-radius:999px; border:1px solid rgba(232,223,200,.28); background:rgba(20,16,12,.62); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); color:#fbf6ea; font-size:15px; font-weight:700; letter-spacing:.01em; transition:background var(--d-small) var(--ease), border-color var(--d-small) var(--ease); }
.pill:hover{ background:rgba(36,30,23,.78); border-color:rgba(232,223,200,.45); }
.pill svg.i{ width:18px; height:18px; }

.skip{ position:absolute; right:var(--gut); bottom:136px; overflow:hidden; opacity:0; visibility:hidden; transform:translateY(8px); transition:opacity var(--d-large) var(--ease-out), transform 520ms var(--ease-out), visibility 0s linear var(--d-large); }
.skip.on{ opacity:1; visibility:visible; transform:none; transition:opacity var(--d-large) var(--ease-out), transform 520ms var(--ease-out), visibility 0s; }
.stage[data-ui="off"] .skip.on{ transform:translateY(96px); }
.skip .left{ position:absolute; left:0; bottom:0; height:2px; background:rgba(255,107,43,.85); width:var(--w,100%); }

.card{ border-radius:16px; background:var(--glass); border:1px solid var(--hair); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:0 18px 50px rgba(0,0,0,.45); }
.k{ font-family:var(--font-px); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:0; }

.upnext{ position:absolute; right:var(--gut); bottom:136px; width:380px; padding:14px; opacity:0; visibility:hidden; transform:translateY(10px); transition:opacity 520ms var(--ease-out), transform 560ms var(--ease-out), visibility 0s linear 520ms; }
.upnext.on{ opacity:1; visibility:visible; transform:none; transition:opacity 520ms var(--ease-out), transform 560ms var(--ease-out), visibility 0s; }
.stage[data-ui="off"] .upnext.on{ transform:translateY(96px); }
.upnext .row{ display:flex; gap:14px; align-items:center; }
.upnext .th{ position:relative; flex:none; width:136px; aspect-ratio:16/9; border-radius:9px; overflow:hidden; }
.upnext .th img{ width:100%; height:100%; object-fit:cover; }
.upnext h3{ margin:3px 0 2px; font-size:17px; line-height:1.25; font-weight:700; }
.upnext .rt{ margin:0; color:var(--muted); font-size:13.5px; }
.upnext .acts{ display:flex; gap:8px; margin-top:14px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:46px; padding:0 18px; border-radius:12px; border:1px solid var(--hair); background:rgba(232,223,200,.06); color:var(--text); font-weight:700; font-size:15px; text-decoration:none; transition:background var(--d-small) var(--ease), border-color var(--d-small) var(--ease); }
.btn:hover{ background:rgba(232,223,200,.12); }
.btn.primary{ background:#f3ecdc; color:#16120d; border-color:#f3ecdc; }
.btn.primary:hover{ background:#fff; }
.btn.grow{ flex:1; }
.ringwrap{ position:relative; width:28px; height:28px; display:grid; place-items:center; }
.ringwrap svg.ring{ position:absolute; inset:0; width:28px; height:28px; transform:rotate(-90deg); fill:none; stroke-width:2.4; }
.ringwrap .bgc{ stroke:rgba(22,18,13,.18); }
.ringwrap .fgc{ stroke:var(--accent); stroke-dasharray:1; stroke-dashoffset:0; stroke-linecap:round; }
.ringwrap svg.i{ width:12px; height:12px; }

.pausecard{ position:absolute; left:var(--gut); bottom:172px; max-width:480px; opacity:0; visibility:hidden; transform:translateY(10px); transition:opacity 500ms var(--ease), transform 500ms var(--ease), visibility 0s linear 500ms; pointer-events:none; }
.pausecard.on{ opacity:1; visibility:visible; transform:none; transition:opacity 900ms var(--ease-out) 450ms, transform 900ms var(--ease-out) 450ms, visibility 0s; }
.pausecard h2{ margin:10px 0 4px; font-size:clamp(26px, 3vw, 38px); line-height:1.1; font-weight:700; letter-spacing:-.005em; text-shadow:0 2px 20px rgba(0,0,0,.4); }
.pausecard .meta{ margin:0 0 14px; color:var(--muted); font-size:14.5px; }
.pausecard .syn{ margin:0 0 16px; font-size:16px; line-height:1.55; color:#ece4d2; max-width:44ch; }
.pausecard .ends{ margin:0; font-family:var(--font-mono); font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
.pausecard .ends b{ color:var(--text); font-weight:600; }

.endcard{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:24px; opacity:0; visibility:hidden; transition:opacity 700ms var(--ease), visibility 0s linear 700ms; background:rgba(8,6,5,.55); }
.endcard.on{ opacity:1; visibility:visible; transition:opacity 700ms var(--ease), visibility 0s; }
.endcard h2{ margin:10px 0 18px; font-size:clamp(24px, 3vw, 34px); }
.endcard .acts{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

.toastline{ position:absolute; left:50%; top:calc(86px + env(safe-area-inset-top)); transform:translate(-50%, -6px); display:flex; align-items:center; gap:14px; padding:9px 16px; border-radius:999px; background:rgba(20,16,12,.7); border:1px solid var(--hair); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); color:var(--muted); font-size:13px; white-space:nowrap; opacity:0; visibility:hidden; transition:opacity 600ms var(--ease), transform 600ms var(--ease), visibility 0s linear 600ms; }
.toastline.on{ opacity:1; visibility:visible; transform:translate(-50%, 0); transition:opacity 600ms var(--ease-out), transform 600ms var(--ease-out), visibility 0s; }
.toastline kbd{ font-family:var(--font-mono); font-size:11.5px; color:var(--text); padding:1px 6px; border:1px solid rgba(232,223,200,.25); border-radius:5px; margin-right:5px; }
.toastline .dot{ width:3px; height:3px; border-radius:50%; background:var(--dim); }
.toastline button{ border:0; background:none; color:var(--text); font-weight:700; padding:6px 2px; text-decoration:underline; text-underline-offset:3px; text-decoration-color:rgba(232,223,200,.4); }
.resume{ top:auto; bottom:calc(150px + env(safe-area-inset-bottom)); }

/* ════════ Sheet: audio & subtitles, speed, quality ════════ */
.veil{ position:absolute; inset:0; background:rgba(6,5,4,.35); opacity:0; visibility:hidden; transition:opacity var(--d-med) var(--ease), visibility 0s linear var(--d-med); }
.veil.on{ opacity:1; visibility:visible; transition:opacity var(--d-med) var(--ease), visibility 0s; }
.sheet{ position:absolute; right:var(--gut); bottom:96px; width:min(560px, calc(100% - 2 * var(--gut))); max-height:calc(100% - 150px); display:flex; flex-direction:column; opacity:0; visibility:hidden; transform:translateY(10px); transition:opacity var(--d-med) var(--ease), transform var(--d-large) var(--ease-out), visibility 0s linear var(--d-med); }
.sheet.on{ opacity:1; visibility:visible; transform:none; transition:opacity var(--d-med) var(--ease-out), transform var(--d-large) var(--ease-out), visibility 0s; }
.sheet[hidden]{ display:none; }
.sheet .grab{ display:none; }
.sheet .hd{ display:flex; align-items:center; gap:8px; padding:8px 8px 0 14px; border-bottom:1px solid var(--hair); }
.tabs{ display:flex; gap:4px; flex:1; overflow-x:auto; scrollbar-width:none; }
.tab{ position:relative; min-height:46px; padding:0 12px; border:0; background:none; color:var(--muted); font-size:14.5px; font-weight:700; white-space:nowrap; border-radius:8px 8px 0 0; }
.tab:hover{ color:var(--text); }
.tab[aria-selected="true"]{ color:var(--text); }
.tab[aria-selected="true"]::after{ content:""; position:absolute; left:12px; right:12px; bottom:-1px; height:2px; border-radius:2px; background:var(--accent); }
.sheet .body{ overflow:auto; padding:16px 18px 18px; overscroll-behavior:contain; }
.panel[hidden]{ display:none; }
.cols{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
fieldset{ border:0; margin:0; padding:0; min-width:0; }
legend{ padding:0; margin:0 0 8px; font-family:var(--font-px); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
.opt{ position:relative; display:flex; align-items:center; gap:10px; min-height:46px; padding:7px 10px; margin:0 -10px; border-radius:10px; cursor:pointer; transition:background var(--d-micro) var(--ease); }
.opt:hover{ background:var(--wash); }
.opt input{ position:absolute; opacity:0; width:1px; height:1px; }
.opt:has(input:focus-visible){ outline:2px solid var(--num); outline-offset:-2px; }
.opt .tx{ flex:1; display:flex; flex-direction:column; line-height:1.3; }
.opt .tx b{ font-weight:400; font-size:15px; }
.opt .tx small{ color:var(--dim); font-size:12.5px; }
.opt .ck{ width:18px; height:18px; color:var(--accent); opacity:0; stroke-width:2.2; }
.opt:has(input:checked) .tx b{ font-weight:700; color:#fbf6ea; }
.opt:has(input:checked) .ck{ opacity:1; }
.seg{ display:flex; flex-wrap:wrap; gap:6px; }
.seg .chip{ position:relative; }
.seg .chip input{ position:absolute; opacity:0; width:1px; height:1px; }
.seg .chip span{ display:inline-grid; place-items:center; min-width:64px; min-height:44px; padding:0 14px; border-radius:10px; border:1px solid var(--hair); color:var(--muted); font-size:14.5px; cursor:pointer; transition:background var(--d-micro) var(--ease), color var(--d-micro) var(--ease); }
.seg .chip span:hover{ background:var(--wash); color:var(--text); }
.seg .chip input:checked + span{ background:#f3ecdc; border-color:#f3ecdc; color:#16120d; font-weight:700; }
.seg .chip input:focus-visible + span{ outline:2px solid var(--num); outline-offset:2px; }
.note{ margin:14px 0 0; color:var(--dim); font-size:13px; }
.nf-disclosure{ margin-top:16px; border-top:1px solid var(--hair); }
.nf-disclosure summary{ display:flex; align-items:center; justify-content:space-between; min-height:46px; cursor:pointer; list-style:none; font-size:14.5px; font-weight:700; color:var(--muted); border-radius:8px; }
.nf-disclosure summary::-webkit-details-marker{ display:none; }
.nf-disclosure summary svg.i{ width:18px; height:18px; transition:transform var(--d-med) var(--ease); }
.nf-disclosure[open] summary svg.i{ transform:rotate(180deg); }
.nf-disclosure summary:hover{ color:var(--text); }
.nf-disclosure .inner{ display:grid; gap:14px; padding:2px 0 6px; }
.nf-disclosure .inner > div > span{ display:block; margin-bottom:6px; font-size:13px; color:var(--dim); }

/* ════════ Small window (picture in picture, mocked in-page) ════════ */
.away{ position:fixed; inset:var(--mockh) 0 0 0; display:grid; place-items:center; text-align:center; padding:24px; background:radial-gradient(80% 60% at 50% 40%, #241d15, var(--ink)); }
.away[hidden]{ display:none; }
.away p{ color:var(--muted); margin:8px 0 18px; }
.stage.mini{ top:auto; left:auto; right:24px; bottom:24px; width:min(380px, calc(100% - 32px)); aspect-ratio:16/9; border-radius:14px; border:1px solid var(--hair); box-shadow:0 24px 60px rgba(0,0,0,.6); cursor:default !important; }
.stage.mini .topbar, .stage.mini .bar, .stage.mini .skip, .stage.mini .upnext, .stage.mini .pausecard, .stage.mini .center, .stage.mini .toastline, .stage.mini .subs{ display:none !important; }
.stage .miniui{ display:none; }
.stage.mini .miniui{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:14px; opacity:0; background:rgba(8,6,5,.35); transition:opacity var(--d-med) var(--ease); }
.stage.mini:hover .miniui, .stage.mini:focus-within .miniui{ opacity:1; }

/* ════════ Touch / small screens ════════ */
@media (max-width: 760px), (hover: none) and (pointer: coarse){
  :root{ --gut:18px; }
  .center{ display:flex; }
  .ctl-l .play, .ctl-l .rw, .ctl-l .ff{ display:none; }
  .vol input{ display:none; }
  .ibtn{ width:48px; height:48px; }
  .ibtn[data-tip]::after{ display:none; }
  .ttl .ep{ font-size:16px; }
  .scrub{ height:36px; }
  .track{ height:4px; }
  .knob{ transform:scale(.85); }
  .bar{ padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
  .stage[data-ui="on"] .subs{ transform:translateY(-70px); }
  .upnext{ left:var(--gut); right:var(--gut); width:auto; bottom:118px; }
  .skip{ bottom:118px; }
  .pausecard{ left:var(--gut); right:var(--gut); bottom:150px; }
  .pausecard .syn{ font-size:15px; }
  .toastline.resume{ bottom:calc(126px + env(safe-area-inset-bottom)); }
  /* sheets become bottom sheets */
  .sheet{ left:0; right:0; bottom:0; width:auto; max-height:calc(100% - 56px); border-radius:20px 20px 0 0; border-bottom:0; transform:translateY(40px); padding-bottom:env(safe-area-inset-bottom); }
  .sheet.on{ transform:none; }
  .sheet .grab{ display:block; width:40px; height:4px; border-radius:4px; background:rgba(232,223,200,.3); margin:8px auto 0; flex:none; }
  .cols{ grid-template-columns:1fr; gap:18px; }
}
/* phone held upright: letterboxed 16:9 picture, chrome above and below it */
@media (max-width: 760px) and (orientation: portrait){
  .frame{ inset:auto 0; top:24%; aspect-ratio:16/9; }
  .scrim.top{ height:130px; }
  .scrim.bot{ height:300px; }
  .stage[data-ui="on"] .subs{ transform:none; }
  .subs{ bottom:6%; }
  .subs span{ font-size:calc(15px * var(--subsz,1)); }
  .center{ gap:34px; }
  .center .ibtn{ width:54px; height:54px; } .center .ibtn.play{ width:68px; height:68px; }
  .pausecard{ bottom:auto; top:calc(24% + 56.25vw + 26px); }
  .pausecard h2{ font-size:26px; }
  .titlecard{ font-size:28px; }
  .flash{ width:72px; height:72px; margin:-36px 0 0 -36px; }
}
/* phone on its side: keep everything in thumb reach and out of the way */
@media (max-height: 500px) and (orientation: landscape){
  .topbar{ padding-top:calc(10px + env(safe-area-inset-top)); padding-left:max(var(--gut), env(safe-area-inset-left)); }
  .bar{ padding-left:max(var(--gut), env(safe-area-inset-left)); padding-right:max(var(--gut), env(safe-area-inset-right)); padding-bottom:calc(6px + env(safe-area-inset-bottom)); }
  .ctlrow{ margin-top:0; }
  .pausecard{ bottom:auto; top:70px; max-width:min(440px, 60%); right:auto; }
  .pausecard .syn{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:10px; }
  .pausecard h2{ font-size:24px; margin-top:6px; }
  .upnext{ left:auto; width:320px; bottom:96px; padding:12px; }
  .upnext .th{ width:96px; }
  .upnext h3{ font-size:16px; }
  .upnext .acts{ margin-top:10px; }
  .stage.has-upnext .center .rw, .stage.has-upnext .center .ff{ visibility:hidden; }
  .skip{ bottom:100px; }
  .sheet{ left:auto; right:12px; width:min(520px, calc(100% - 24px)); max-height:calc(100% - 16px); border-radius:18px 18px 0 0; }
  .toastline.resume{ bottom:100px; }
}

@media (prefers-reduced-motion: reduce){
  .ui, .topbar.ui, .center.ui, .skip, .upnext, .pausecard, .sheet, .toastline, .peek{ transform:none !important; }
  .center.ui, .stage[data-ui="on"] .center.ui{ transform:translate(-50%, -50%) !important; }
  .toastline{ transform:translateX(-50%) !important; }
  .peek{ transform:translateX(-50%) !important; }
  .ui, .skip, .upnext, .pausecard, .toastline, .veil, .sheet, .layer, .dim, .titlecard{ transition-duration:160ms !important; transition-delay:0s !important; }
  .scenes::after{ animation:none; }
  .flash.go{ animation:flashrm 760ms linear both; }
  .ripple.go{ animation:flashrm 700ms linear both; }
  .stage[data-ui="on"] .subs{ transition:none; }
}
@keyframes flashrm{ 0%{ opacity:0; } 15%{ opacity:1; } 75%{ opacity:1; } 100%{ opacity:0; } }
</style>

/* query params: ?id=<series|episode|movie id>&ep=<episode id>&s=2&e=5&t=754 (or 12:34) &progress=0.4 */
function fromQuery(){
  const q = new URLSearchParams(location.search);
  const id = q.get('id') || q.get('item') || '';
  const epId = q.get('ep') || q.get('episode') || '';
  const sn = +(q.get('s') || q.get('season') || 0), en = +(q.get('e') || q.get('epnum') || 0);
  let t = parseTime(q.get('t') ?? q.get('resume') ?? q.get('pos') ?? q.get('start'));
  const prog = q.get('progress') ?? q.get('p');
  let item, ep = null;
  const byId = SILO.eps.find(x => x.id===id || x.id===epId);
  if (byId || id===SILO.id || (!id && (epId || sn || en))){
    item = SILO;
    ep = byId || SILO.eps.find(x => x.n===en && (!sn || sn===SILO.season)) || SILO.eps[4];
  } else if (id===PHM.id){
    item = PHM;
  } else if (id){
    item = { id, kind:'movie', name:q.get('title') || 'Now playing', run:+(q.get('run')||0) || 110, ov:q.get('overview') || '', cert:'' };
  } else {
    item = SILO; ep = SILO.eps[4];
    if (t==null && prog==null) t = 754;   /* the demo resumes S2 · E5 at 12:34 */
  }
  const dur = (ep ? ep.run : item.run) * 60;
  if (t==null && prog!=null){ const f = +prog > 1 ? +prog/100 : +prog; if (!isNaN(f)) t = f*dur; }
  if (t==null){ const saved = store.get('nutfin5-player-pos', {})[(ep||item).id]; if (saved > 30 && saved < dur-60) t = saved; }
  return { item, ep, t: clamp(t||0, 0, dur-1) };
}

/* ════════ Clock ════════ */
let last = performance.now(), saveAcc = 0;
function tick(now){

function cueAt(t){

/* ════════ Playback ════════ */

/* ════════ Volume ════════ */

/* ════════ Chrome visibility ════════ */

/* ════════ Centre glyph + ripples ════════ */
const flashEl = $('#flash');
function flash(icon, text=''){

  flashEl.querySelector('.t').textContent = text;
  flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go');
}
let tapChain = { side:null, n:0, t:0 };
function ripple(side){
  const el = side === 'l' ? $('#ripL') : $('#ripR');
  const now = performance.now();
  if (tapChain.side === side && now - tapChain.t < 900) tapChain.n++; else tapChain = { side, n:1, t:now };
  tapChain.t = now;
  el.querySelector('em').textContent = `${tapChain.n * 10} seconds`;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
}

/* taps and clicks on the picture */
let tapTimer = null, lastTap = { t:0, x:0, side:null };
frame.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (P.mini) return;
  const touch = e.pointerType ? e.pointerType !== 'mouse' : (TOUCHY.matches || (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents));
  const r = frame.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  const side = x < .4 ? 'l' : x > .6 ? 'r' : 'c';
  const now = performance.now();
  if (touch){
    /* double-tap left/right seeks; further taps in the chain keep seeking */
    const chained = tapChain.side === side && now - tapChain.t < 900 && side !== 'c';

    }
    lastTap = { t:now, side };
    clearTimeout(tapTimer);

function showPeek(t){
  const r = scrub.getBoundingClientRect();
  const pw = 192, x = clamp((t / P.dur) * r.width, pw/2 - 8, r.width - pw/2 + 8);
  peek.style.left = x + 'px';
  hov.style.width = (t / P.dur * 100).toFixed(2) + '%';
  const i = sceneAt(t), src = LAYERS[i] && LAYERS[i].firstChild.getAttribute('src');
  if (src && peekImg.getAttribute('src') !== src){ peekImg.classList.remove('broken'); peekImg.src = src; }
  peekImg.style.transform = kb(t, i);
  peekT.textContent = fmt(t);
  peek.classList.add('on');
}
onImgErr(peekImg);
peekImg.addEventListener('load', ()=>peekImg.classList.remove('broken'));
scrub.addEventListener('pointermove', e => { if (!P.scrubbing && e.pointerType === 'mouse') showPeek(xToT(e.clientX)); if (P.scrubbing){ const t = xToT(e.clientX); P.t = t; paint(); showPeek(t); } });
scrub.addEventListener('pointerleave', ()=>{ if (!P.scrubbing) peek.classList.remove('on'); });
scrub.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  P.scrubbing = true; scrub.classList.add('drag'); scrub.setPointerCapture(e.pointerId);
  const t = xToT(e.clientX); P.t = t; paint(); showPeek(t); wake();
});
function endScrub(e){
  if (!P.scrubbing) return;
  P.scrubbing = false; scrub.classList.remove('drag');
  seekTo(xToT(e.clientX));
  if (e.pointerType !== 'mouse') peek.classList.remove('on');
  wake();
}
scrub.addEventListener('pointerup', endScrub);
scrub.addEventListener('pointercancel', e => { P.scrubbing = false; scrub.classList.remove('drag'); peek.classList.remove('on'); });
scrub.addEventListener('keydown', e => {
  const map = { Home: -Infinity, End: Infinity, PageUp: 60, PageDown: -60 };
  if (e.key in map){ e.preventDefault(); e.stopPropagation(); const d = map[e.key]; seekTo(d === -Infinity ? 0 : d === Infinity ? P.dur - 1 : P.t + d); showPeek(P.t); clearTimeout(peekKeyT); peekKeyT = setTimeout(()=>peek.classList.remove('on'), 1200); wake(); }
});
let peekKeyT = null;
tRem.addEventListener('click', ()=>{ P.remTotal = !P.remTotal; tRem.setAttribute('aria-label', P.remTotal ? 'Show time left instead' : 'Show total length instead'); paint(); });

/* ════════ Pause card ════════ */
function showPausecard(){
  if (P.playing || P.ended || P.mini) return;
  const pc = $('#pausecard'), it = P.item, ep = P.ep;
  pc.innerHTML = `<p class="k">Paused</p>
    <h2>${esc(ep ? ep.name : it.name)}</h2>
    <p class="meta">${ep ? `${esc(it.name)} · Season ${it.season}, Episode ${ep.n}` : `${it.year||''}${it.cert ? ' · ' + esc(it.cert) : ''} · ${Math.floor(it.run/60)} h ${it.run%60} min`}</p>
    ${(ep ? ep.ov : it.ov) ? `<p class="syn">${esc(ep ? ep.ov : it.ov)}</p>` : ''}
    <p class="ends" id="ends"></p>`;
  paintEnds();
  pc.classList.add('on'); pausecardOn = true;
}
function hidePausecard(){ $('#pausecard').classList.remove('on'); pausecardOn = false; }
let lastEnds = '';
function paintEnds(){
  const el = $('#ends'); if (!el) return;
  const left = (P.dur - P.t) / P.speed, m = Math.max(1, Math.round(left / 60));
  const s = `<b>${m >= 60 ? `${Math.floor(m/60)} h ${m%60} min` : m + ' min'}</b> left · Ends at <b>${clock(new Date(Date.now() + left*1000))}</b>`;
  if (s !== lastEnds){ el.innerHTML = s; lastEnds = s; }
}

/* ════════ Up next ════════ */
let upBuilt = null;
function upNextPaint(){
  const un = $('#upnext'), n = nextEp();
  const show = !!n && P.t >= P.credits && !P.upDismissed && !P.ended && !P.mini;
  stage.classList.toggle('has-upnext', show);
  if (!show){ if (un.classList.contains('on')){ un.classList.remove('on'); } return; }
  if (upBuilt !== n.id){
    un.innerHTML = `<div class="row"><div class="th ph"><img src="${IMG(n.id,'Primary',480)}" alt=""></div>
      <div><p class="k">Up next</p><h3>E${n.n} · ${esc(n.name)}</h3><p class="rt">${n.run} min · <span id="upCount">Starts in ${UPNEXT_SECS} s</span></p></div></div>
      <div class="acts"><button class="btn primary grow" type="button" data-act="playnext"><span class="ringwrap"><svg class="ring" viewBox="0 0 28 28" aria-hidden="true"><circle class="bgc" cx="14" cy="14" r="12"/><circle class="fgc" id="upRing" cx="14" cy="14" r="12" pathLength="1"/></svg>${ic('play')}</span>Play now</button>
      <button class="btn" type="button" data-act="credits">Watch credits</button></div>`;
    onImgErr(un.querySelector('img'));
    upBuilt = n.id;
    announce(`Up next: episode ${n.n}, ${n.name}, in ${UPNEXT_SECS} seconds`);
  }
  if (!un.classList.contains('on')){ un.classList.add('on'); upT0 = performance.now(); upLeft0 = P.upLeft; }
  /* the countdown only runs while playing */
  if (P.playing){
    const now = performance.now();
    P.upLeft = Math.max(0, upLeft0 - (now - upT0) / 1000);
  } else { upT0 = performance.now(); upLeft0 = P.upLeft; }
  const ring = $('#upRing'); if (ring) ring.style.strokeDashoffset = String(1 - P.upLeft / UPNEXT_SECS);
  const c = $('#upCount'), secs = Math.ceil(P.upLeft);
  if (c && c.dataset.s !== String(secs)){ c.dataset.s = secs; c.textContent = P.playing ? `Starts in ${secs} s` : 'Paused'; }
  if (P.upLeft <= 0 && P.playing){ P.upDismissed = true; un.classList.remove('on'); playNext(); }
}
let upT0 = 0, upLeft0 = UPNEXT_SECS;

/* ════════ Resume + one-time shortcut hint ════════ */
let resumeT = null;
function showResume(t){
  const r = $('#resume');
  r.innerHTML = `<span>Picked up at ${fmt(t)}</span><span class="dot" aria-hidden="true"></span><button type="button" data-act="startover">Start from the beginning</button>`;
  r.classList.add('on'); clearTimeout(resumeT);
  resumeT = setTimeout(()=>r.classList.remove('on'), 6000);
}
function showHintOnce(delay=1400){
  if (TOUCHY.matches || store.get('nutfin5-player-hint', false)) return;
  const h = $('#hint');
  h.innerHTML = `<span><kbd>Space</kbd>Pause</span><span class="dot" aria-hidden="true"></span><span><kbd>←</kbd><kbd>→</kbd>10 seconds</span><span class="dot" aria-hidden="true"></span><span><kbd>F</kbd>Full screen</span><span class="dot" aria-hidden="true"></span><span><kbd>C</kbd>Subtitles</span>`;
  setTimeout(()=>h.classList.add('on'), delay);
  setTimeout(()=>h.classList.remove('on'), delay + 6000);
  store.set('nutfin5-player-hint', true);
}

/* ════════ Sheet ════════ */
let sheetOpener = null;
function opt(name, o, cur){ return `<label class="opt"><input type="radio" name="${name}" value="${o.v}"${String(o.v)===String(cur)?' checked':''}><span class="tx"><b>${esc(o.b)}</b>${o.s?`<small>${esc(o.s)}</small>`:''}</span><svg class="i ck" aria-hidden="true"><use href="#i-check"/></svg></label>`; }
function chip(name, v, label, cur){ return `<label class="chip"><input type="radio" name="${name}" value="${v}"${String(v)===String(cur)?' checked':''}><span>${esc(label)}</span></label>`; }
function renderPanels(){
  $('#pn-av').innerHTML = `<div class="cols">
      <fieldset><legend>Language you hear</legend>${AUDIO.map(o=>opt('audio', o, P.audio)).join('')}</fieldset>
      <fieldset><legend>Subtitles</legend>${SUBS.map(o=>opt('subs', o, P.subs)).join('')}</fieldset>
    </div>
    <details class="nf-disclosure"><summary>How subtitles look ${ic('down')}</summary>
      <div class="inner">
        <div role="radiogroup" aria-label="Subtitle size"><span>Size</span><div class="seg">${[[.85,'Smaller'],[1,'Standard'],[1.25,'Larger']].map(([v,l])=>chip('subsz', v, l, P.subSize)).join('')}</div></div>
        <div role="radiogroup" aria-label="Subtitle background"><span>Background</span><div class="seg">${chip('subbox','0','Soft shadow', P.subBox?'1':'0')}${chip('subbox','1','Dark box', P.subBox?'1':'0')}</div></div>
      </div>
    </details>`;
  $('#pn-sp').innerHTML = `<fieldset><legend>Playback speed</legend><div class="seg">${SPEEDS.map(([v,l])=>chip('speed', v, l, P.speed)).join('')}</div></fieldset>
    <p class="note">Voices keep their natural pitch at every speed.</p>`;
  const qs = [
    { v:'auto', b:'Best for this screen', s:'Recommended. Adjusts to your connection' },
    { v:'orig', b:'Original quality', s:P.item && P.item.has4k && P.version==='4k' ? '4K HDR · uses the most data' : '1080p · uses the most data' },
    { v:'saver', b:'Data saver', s:'720p · good on slow Wi-Fi or mobile data' },
  ];
  $('#pn-q').innerHTML = `${P.item && P.item.has4k ? `<fieldset style="margin-bottom:18px"><legend>Version</legend>${opt('version',{ v:'4k', b:'4K HDR', s:'Sharpest picture, for big screens' }, P.version)}${opt('version',{ v:'hd', b:'HD', s:'1080p, plays smoothly everywhere' }, P.version)}</fieldset>` : ''}
    <fieldset><legend>Quality</legend>${qs.map(o=>opt('quality', o, P.quality)).join('')}</fieldset>
    <p class="note" id="qnote">${qualityNote()}</p>`;
}
function qualityNote(){ return P.quality === 'saver' ? 'The server is making a smaller copy as you watch.' : 'Playing straight from the server, nothing is being converted.'; }
sheet.addEventListener('change', e => {
  const n = e.target.name, v = e.target.value;
  if (n === 'audio'){ P.audio = v; const o = AUDIO.find(x=>x.v===v); flash('vol', `Now hearing ${o.b}`); announce(`Now hearing ${o.b}`); }
  if (n === 'subs'){ P.subs = v; if (v !== 'off') P.lastSubs = v; lastCue = null; announce(`Subtitles: ${SUBNAME[v]}`); }
  if (n === 'subsz'){ P.subSize = +v; subsEl.style.setProperty('--subsz', v); }
  if (n === 'subbox'){ P.subBox = v === '1'; subsEl.classList.toggle('box', P.subBox); }
  if (n === 'speed'){ P.speed = +v; announce(`Speed ${v === '1' ? 'normal' : v + ' times'}`); if (pausecardOn) paintEnds(); }
  if (n === 'quality'){ P.quality = v; $('#qnote').textContent = qualityNote(); announce(e.target.closest('label').querySelector('b').textContent); }
  if (n === 'version'){ P.version = v; const keep = document.activeElement && document.activeElement.value; renderPanels(); sheet.querySelector(`input[name="version"][value="${keep}"]`)?.focus(); announce(v === '4k' ? 'Switched to 4K HDR' : 'Switched to HD'); }
});
function selectTab(id, focus){
  $$('.tab').forEach(t => { const on = t.id === id; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; $('#' + t.getAttribute('aria-controls')).hidden = !on; });
  if (focus) $('#' + id).focus();
}
$('.tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) selectTab(t.id); });
$('.tabs').addEventListener('keydown', e => {
  const tabs = $$('.tab'), i = tabs.indexOf(document.activeElement); if (i < 0) return;
  let j = null;
  if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
  if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
  if (e.key === 'Home') j = 0; if (e.key === 'End') j = tabs.length - 1;
  if (j !== null){ e.preventDefault(); selectTab(tabs[j].id, true); }
});
function openSheet(tab){
  if (P.sheet) return;
  sheetOpener = document.activeElement;
  $('#resume').classList.remove('on');
  if (tab) selectTab(tab);
  sheet.hidden = false;
  requestAnimationFrame(()=>{ sheet.classList.add('on'); veil.classList.add('on'); });
  P.sheet = true; $('#moreBtn').setAttribute('aria-expanded', 'true');
  wake();
  const sel = sheet.querySelector('.tab[aria-selected="true"]');
  setTimeout(()=>sel.focus({ preventScroll:true }), 30);
}
function closeSheet(){
  if (!P.sheet) return;
  sheet.classList.remove('on'); veil.classList.remove('on');
  P.sheet = false; $('#moreBtn').setAttribute('aria-expanded', 'false');
  setTimeout(()=>{ if (!P.sheet) sheet.hidden = true; }, 320);
  (sheetOpener && document.contains(sheetOpener) ? sheetOpener : $('#moreBtn')).focus({ preventScroll:true });
  wake();
}
veil.addEventListener('click', closeSheet);
sheet.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const f = [...sheet.querySelectorAll('button, summary, input')].filter(x => x.getClientRects().length && !x.disabled && (x.type !== 'radio' || x.checked));
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0){ e.preventDefault(); f.at(-1).focus(); }
  else if (!e.shiftKey && i === f.length - 1){ e.preventDefault(); f[0].focus(); }
});

/* ════════ Subtitles shortcut ════════ */
function toggleSubs(){
  P.subs = P.subs === 'off' ? (P.lastSubs || 'en') : 'off';
  lastCue = null; renderPanels();
  flash('cc', P.subs === 'off' ? 'Subtitles off' : `Subtitles: ${SUBNAME[P.subs]}`);
  announce(P.subs === 'off' ? 'Subtitles off' : `Subtitles on, ${SUBNAME[P.subs]}`);
}

/* ════════ Full screen + small window ════════ */
function toggleFS(){
  if (document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  else (stage.requestFullscreen ? stage.requestFullscreen() : Promise.reject()).catch(()=>flash('full', 'Full screen is not available here'));
}
document.addEventListener('fullscreenchange', ()=>{
  const on = !!document.fullscreenElement, b = $('#fsBtn');
  b.querySelector('use').setAttribute('href', on ? '#i-unfull' : '#i-full');
  b.setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen'); b.dataset.tip = on ? 'Exit full screen (F)' : 'Full screen (F)';
});
function togglePip(){
  P.mini = !P.mini;
  if (P.mini && document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  if (P.mini && P.sheet) closeSheet();
  stage.classList.toggle('mini', P.mini);
  $('#away').hidden = !P.mini;
  $('#awayTxt').textContent = `${P.ep ? `${P.item.name} · ${P.ep.name}` : P.item.name} is playing in a small window.`;
  if (P.mini){ hidePausecard(); $('#upnext').classList.remove('on'); $('#awayBack').focus(); }
  else { stage.querySelector('[data-act="pip"]').focus({ preventScroll:true }); if (!P.playing) showPausecard(); }
  announce(P.mini ? 'Playing in a small window' : 'Back to full size');
  wake();
}
$('#awayBack').addEventListener('click', togglePip);

/* ════════ Back ════════ */
function goBack(){
  if (history.length > 1){ history.back(); setTimeout(()=>{ location.href = 'home.html'; }, 500); }
  else location.href = 'home.html';
}

/* ════════ Actions ════════ */
const ACT = {
  toggle, rw:()=>seekBy(-10), ff:()=>seekBy(10), mute:toggleMute,
  next:()=>{ P.upDismissed = true; playNext(); }, playnext:()=>{ P.upDismissed = true; $('#upnext').classList.remove('on'); playNext(); },
  credits:()=>{ P.upDismissed = true; $('#upnext').classList.remove('on'); announce('Watching the credits'); },
  sheet:()=>P.sheet ? closeSheet() : openSheet(), closesheet:closeSheet,
  pip:togglePip, fs:toggleFS, back:goBack,
  skipintro:()=>{ seekTo(P.intro[1], { quiet:true }); announce('Intro skipped'); $('#bar .play').focus({ preventScroll:true }); },
  startover:()=>{ seekTo(0, { quiet:true }); $('#resume').classList.remove('on'); announce('Starting from the beginning'); },
  again:()=>{ $('#endcard').classList.remove('on'); P.ended = false; P.upDismissed = false; seekTo(0, { quiet:true }); setPlaying(true); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (f){ e.stopPropagation(); f(); }
});

/* ════════ Keyboard ════════ */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, tg = e.target;
  if (P.sheet){ if (k === 'Escape'){ e.preventDefault(); closeSheet(); } return; }
  if (tg.closest && tg.closest('.mock')) return;
  const onBtn = tg.tagName === 'BUTTON' || tg.tagName === 'A' || tg.tagName === 'SUMMARY';
  const onRange = tg.type === 'range';
  if (k === 'Tab'){ wake(); return; }
  if (k === 'Escape'){ if (P.mini){ togglePip(); return; } if (P.ui){ clearTimeout(hideTimer); setUI(false); } return; }
  if ((k === ' ' || k === 'Enter') && onBtn){ wake(); return; }   /* let the focused button do its job */
  if (onRange && k.startsWith('Arrow')){ wake(); return; }
  const lk = k.length === 1 ? k.toLowerCase() : k;
  let used = true;
  switch (lk){
    case ' ': case 'k': toggle(); break;
    case 'j': case 'ArrowLeft': seekBy(-10); break;
    case 'l': case 'ArrowRight': seekBy(10); break;
    case 'ArrowUp': setVol(P.vol + .1, { show:true }); break;
    case 'ArrowDown': setVol(P.vol - .1, { show:true }); break;
    case 'f': toggleFS(); break;
    case 'm': toggleMute(); break;
    case 'c': toggleSubs(); break;
    case 'i': if (P.intro && P.t >= P.intro[0] && P.t < P.intro[1]) ACT.skipintro(); else used = false; break;
    case 'n': if (e.shiftKey && nextEp()) ACT.next(); else used = false; break;
    default: used = false;
  }
  if (used){ e.preventDefault(); wake(); }
});

/* ════════ Mockup strip ════════ */
document.querySelector('.mock').addEventListener('click', e => {
  const ex = e.target.closest('[data-ex]');
  if (ex){ load(ex.dataset.ex === 'movie' ? { item:PHM, ep:null, t:2310 } : { item:SILO, ep:SILO.eps[4], t:754 }); return; }
  const d = e.target.closest('[data-demo]'); if (d) demo(d.dataset.demo);
});
function demo(name){
  $('#resume').classList.remove('on');
  if (P.mini) togglePip();
  if (P.sheet && name !== 'sheet') closeSheet();
  if (P.ended){ $('#endcard').classList.remove('on'); P.ended = false; }
  if (name === 'controls'){ setPlaying(true, { silent:true }); P.overBar = false; wake(); }
  if (name === 'paused'){ setPlaying(false, { silent:true }); clearTimeout(pauseTimer); showPausecard(); clearTimeout(hideTimer); setUI(false); }
  if (name === 'sheet'){ setPlaying(true, { silent:true }); if (P.subs === 'off'){ P.subs = 'en'; renderPanels(); } openSheet('tab-av'); }
  if (name === 'intro'){
    if (P.item.kind !== 'series') load({ item:SILO, ep:SILO.eps[4], t:0 }, { noResume:true });
    seekTo(P.intro[0] + 6, { quiet:true }); setPlaying(true, { silent:true }); clearTimeout(hideTimer); setUI(false);
  }
  if (name === 'upnext'){
    if (P.item.kind !== 'series' || !nextEp()) load({ item:SILO, ep:SILO.eps[4], t:0 }, { noResume:true });
    P.upDismissed = false; P.upLeft = UPNEXT_SECS; upLeft0 = UPNEXT_SECS; upT0 = performance.now();
    seekTo(P.credits + 1, { quiet:true }); setPlaying(true, { silent:true }); wake();
  }
}
window.NF_DEMO = demo;

/* ════════ Start ════════ */
window.addEventListener('pagehide', savePos);
paintVol();
load(fromQuery(), { keepUrl:true });
showHintOnce($('#resume').classList.contains('on') ? 6800 : 1400);   /* one pill at a time */
requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });
</script>
</body>
