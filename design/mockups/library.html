<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutFin Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ── Nutstyle Ember tokens (same as v4 bento) ── */
:root{
  color-scheme: dark;
  --font-px:'DotGothic16', ui-monospace, monospace;
  --font-mono:'JetBrains Mono', ui-monospace, monospace;
  --font-read:'Atkinson Hyperlegible', 'JetBrains Mono', sans-serif;
  --bw:1.5px; --r-card:12px; --r-ctl:10px; --r-tile:16px;
  --lift:3px 3px 0 var(--shadow-c); --lift-hi:5px 5px 0 var(--shadow-c); --lift-btn:2px 2px 0 var(--shadow-c); --lift-peek:9px 9px 0 var(--shadow-c);
  --mockh:40px; --toph:66px; --sumh:62px; --vph:800px;
  --ease:cubic-bezier(.33,1,.68,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --ease-spring:var(--ease-out);
  --d-micro:120ms; --d-small:200ms; --d-med:280ms; --d-large:420ms; --d-hero:700ms;

  --bg: light-dark(#d8cfbc, #13100c);
  --panel: light-dark(#f5f0e6, #1e1a14);
  --nested: light-dark(#faf6f0, #1a1610);
  --line: light-dark(#7a6a52, #3d3220);
  --shadow-c: light-dark(#a89878, #070604);
  --text: light-dark(#1c1810, #e8dfc8);
  --muted: light-dark(#514739, #b5b0a3);
  --dim: light-dark(#796856, #8b8576);
  --accent: light-dark(#e05a18, #ff6b2b);
  --accent-ink: light-dark(#f5f0e6, #13100c);
  --num: light-dark(#00768a, #00b4c8);
  --raise: color-mix(in srgb, var(--panel) 90%, var(--text));
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--panel));
  --ok: light-dark(#1f6b33, #7ccf8c);
  --info: light-dark(#2d62a6, #86b4ea);
  --warn: light-dark(#8f6400, #e8c46b);
  --ok-soft: color-mix(in srgb, var(--ok) 14%, var(--panel));
  --num-soft: color-mix(in srgb, var(--num) 14%, var(--panel));
  --on-img:#f6f0e4; --on-img-dim:rgba(246,240,228,.78);
}
@supports (transition-timing-function: linear(0, 1)){
  :root{ --ease-spring: linear(0, .12 4%, .38 10%, .66 17%, .87 25%, 1 33%, 1.04 41%, 1.035 48%, 1.015 58%, 1.002 70%, .999 82%, 1); }
}
@media (prefers-reduced-motion: reduce){ :root{ --d-micro:0ms; --d-small:0ms; --d-med:0ms; --d-large:0ms; --d-hero:0ms; } }
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ color-scheme: light; } }
:root[data-theme="light"]{ color-scheme: light; }
:root[data-theme="dark"]{ color-scheme: dark; }

*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ background:var(--bg); color:var(--text); font-family:var(--font-mono); font-size:15px; line-height:1.5; overflow-x:hidden; -webkit-font-smoothing:antialiased; }
img{ display:block; max-width:100%; }
img.broken{ opacity:0 !important; }
button{ font:inherit; color:inherit; }
a{ color:inherit; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid var(--num); outline-offset:3px; border-radius:6px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
svg.i{ width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

.ph{ position:relative; background:
  radial-gradient(120% 80% at 18% 12%, hsl(var(--h,20) 70% 58% / .55), transparent 60%),
  radial-gradient(90% 70% at 92% 100%, hsl(var(--h2,60) 70% 48% / .5), transparent 62%),
  linear-gradient(160deg, hsl(var(--h,20) 38% 24%), hsl(var(--h2,60) 42% 9%)); }
.ph[data-t]::before{ content:attr(data-t); position:absolute; left:8px; right:8px; bottom:8px; font-family:var(--font-px); font-size:13px; line-height:1.15; color:rgba(255,255,255,.9); text-shadow:0 1px 0 rgba(0,0,0,.45); }
.ph > img{ position:relative; }

/* ── Mockup strip (not part of the app) ── */
.mock{ position:sticky; top:0; z-index:400; display:flex; align-items:center; gap:6px; padding:6px 12px; background:repeating-linear-gradient(135deg,#2a2a2a 0 10px,#262626 10px 20px); border-bottom:2px dashed #5a5a5a; overflow-x:auto; scrollbar-width:none; font-family:system-ui, sans-serif; }
.mock::-webkit-scrollbar{ display:none; }
.mock b{ font-size:11px; letter-spacing:.12em; color:#c9c9c9; text-transform:uppercase; padding-right:4px; white-space:nowrap; }
.mock .sep{ flex:none; width:1px; height:20px; background:#555; margin:0 6px; }
.mock button, .mock a, .mock select{ flex:none; border:1px solid #555; background:#333; color:#ddd; border-radius:999px; padding:4px 11px; font-size:12px; cursor:pointer; white-space:nowrap; text-decoration:none; line-height:1.4; font-family:system-ui, sans-serif; }
.mock [aria-current="page"]{ background:#ddd; color:#111; border-color:#ddd; }
.mock a{ border-style:dashed; }
.mock label{ color:#bbb; font-size:12px; white-space:nowrap; }
html.framed .mock{ display:none; }

/* ── App shell ── */
.top{ position:sticky; top:var(--mockh); z-index:50; display:flex; align-items:center; gap:18px; height:var(--toph); padding:0 28px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); border-bottom:var(--bw) solid var(--line); }
.brand{ display:flex; align-items:center; gap:10px; border:0; padding:4px; min-height:44px; text-decoration:none; border-radius:10px; }
.brand span{ font-family:var(--font-px); font-size:22px; letter-spacing:.04em; }
.brand span em{ font-style:normal; color:var(--accent); }
.nav{ display:flex; gap:4px; }
.nav a, .nav button{ display:flex; align-items:center; gap:8px; min-height:44px; padding:0 14px; border:var(--bw) solid transparent; background:none; border-radius:var(--r-ctl); font-family:var(--font-px); font-size:15px; letter-spacing:.04em; color:var(--muted); cursor:pointer; text-decoration:none; transition:color var(--d-micro) var(--ease), background var(--d-micro) var(--ease); }
.nav a:hover, .nav button:hover{ color:var(--text); background:var(--panel); }
.nav [aria-current="page"]{ color:var(--text); border-color:var(--line); background:var(--panel); box-shadow:var(--lift-btn); }
.nav [aria-current="page"] svg{ color:var(--accent); }
.badge{ white-space:nowrap; font-family:var(--font-read); font-weight:700; font-size:13px; background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:0 6px; line-height:18px; }
.spacer{ flex:1; }
.iconbtn{ display:inline-grid; place-items:center; width:44px; height:44px; border-radius:var(--r-ctl); border:var(--bw) solid var(--line); background:var(--panel); cursor:pointer; color:var(--text); flex:none; transition:border-color var(--d-micro), transform var(--d-micro) var(--ease); }
.iconbtn:hover{ border-color:var(--accent); }
.iconbtn:active{ transform:scale(.94); }
.tabs{ display:none; }
main{ max-width:1440px; margin:0 auto; padding:22px 28px 72px; overflow-x:clip; }

/* the one search: lives in the top bar */
.search{ position:relative; width:290px; }
.search > svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--accent); pointer-events:none; }
.search input{ width:100%; height:44px; padding:0 40px 0 42px; background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--r-ctl); color:var(--text); font-family:var(--font-read); font-size:15.5px; transition:border-color var(--d-micro), box-shadow var(--d-micro); }
.search input::placeholder{ color:var(--dim); }
.search input:hover{ border-color:var(--accent); }
.search input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.search kbd{ position:absolute; right:10px; top:50%; transform:translateY(-50%); font-family:var(--font-mono); font-size:12px; border:1px solid var(--line); border-radius:5px; padding:0 6px; color:var(--dim); pointer-events:none; }
.search input:focus ~ kbd, .search.has kbd{ display:none; }
.qres{ position:absolute; left:0; right:0; top:calc(100% + 8px); min-width:320px; background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--r-card); box-shadow:var(--lift-hi); padding:6px; animation:qin var(--d-small) var(--ease-out) both; max-height:440px; overflow:auto; z-index:5; }
@keyframes qin{ from{ opacity:0; transform:translateY(-6px); } }
.qres a, .qres button{ display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:5px 8px; border-radius:8px; text-decoration:none; border:0; background:none; cursor:pointer; text-align:left; font-family:var(--font-read); }
.qres .act, .qres a:hover, .qres button:hover{ background:var(--raise); }
.qres .ph{ width:32px; height:46px; border-radius:5px; overflow:hidden; flex:none; border:1px solid var(--line); }
.qres .ph img{ width:100%; height:100%; object-fit:cover; }
.qres b{ display:block; font-size:15px; }
.qres small{ color:var(--muted); font-size:13px; }
.qres mark{ background:none; color:var(--accent); }
.qres .askrow{ border-top:1px dashed var(--line); border-radius:0 0 8px 8px; margin-top:4px; color:var(--num); font-weight:700; font-size:14.5px; }
.qres .none{ padding:10px; color:var(--muted); font-family:var(--font-read); font-size:14.5px; }
.searchbtn{ display:none; }

/* ── Theme switch: NutBot's head slides between night sky and daylight ── */
.tswitch{ position:relative; display:inline-flex; align-items:center; justify-content:center; width:66px; height:44px; padding:0; border:0; background:none; cursor:pointer; flex:none; border-radius:999px; }
.tswitch .track{ position:relative; width:64px; height:36px; border-radius:999px; border:var(--bw) solid var(--line); overflow:hidden; box-shadow:inset 2px 2px 0 rgba(0,0,0,.25);
  background:linear-gradient(180deg, #1b1830, #2a2140); transition:background var(--d-large) var(--ease-out), border-color var(--d-micro); }
.tswitch:hover .track{ border-color:var(--accent); }
.tswitch .sky{ position:absolute; inset:0; transition:opacity var(--d-large) var(--ease-out), transform var(--d-large) var(--ease-out); }
.tswitch .stars{ opacity:1; }
.tswitch .stars svg{ position:absolute; fill:#f6e7b8; }
.tswitch .stars svg:nth-child(1){ left:8px; top:6px; width:9px; height:9px; animation:twinkle 2.6s ease-in-out infinite; }
.tswitch .stars svg:nth-child(2){ left:20px; top:17px; width:6px; height:6px; animation:twinkle 3.4s ease-in-out .8s infinite; }
.tswitch .stars svg:nth-child(3){ left:11px; top:21px; width:5px; height:5px; opacity:.7; }
@keyframes twinkle{ 50%{ transform:scale(.55); opacity:.6; } }
.tswitch .day{ opacity:0; transform:translateY(10px); }
.tswitch .day .sun{ position:absolute; right:9px; top:7px; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 40% 40%, #ffd88a, #ff9a3c); box-shadow:0 0 0 3px rgba(255,190,90,.35), 0 0 12px 3px rgba(255,170,60,.45); }
.tswitch .day .cloud{ position:absolute; right:20px; bottom:5px; width:20px; height:8px; border-radius:6px; background:#fffaf0; box-shadow:5px -3px 0 -1px #fffaf0; }
.tswitch .knob{ position:absolute; top:2px; left:30px; width:30px; height:29px; transition:transform var(--d-large) var(--ease-spring), left var(--d-large) var(--ease-spring); filter:drop-shadow(1px 2px 0 rgba(0,0,0,.45)); }
.tswitch .knob svg{ width:30px; height:29px; display:block; }
.tswitch .knob .open{ opacity:0; } .tswitch .knob .shut{ opacity:1; }
.tswitch .knob .open, .tswitch .knob .shut{ transition:opacity var(--d-small); }
.tswitch .zz{ position:absolute; left:23px; top:1px; width:10px; height:10px; stroke:#b9c6ff; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; opacity:.9; animation:zz 3s ease-in-out infinite; }
@keyframes zz{ 0%,100%{ transform:translate(0,2px); opacity:0; } 40%,70%{ transform:translate(-2px,-1px); opacity:.95; } }
.tswitch[aria-checked="false"] .track{ background:linear-gradient(180deg, #bfe3f4, #f7e6c4); border-color:#7a6a52; }
.tswitch[aria-checked="false"] .stars{ opacity:0; transform:translateY(-10px); }
.tswitch[aria-checked="false"] .zz{ display:none; }
.tswitch[aria-checked="false"] .day{ opacity:1; transform:none; }
.tswitch[aria-checked="false"] .knob{ left:2px; }
.tswitch[aria-checked="false"] .knob .open{ opacity:1; } .tswitch[aria-checked="false"] .knob .shut{ opacity:0; }
.tswitch.boop .knob{ animation:boop 520ms var(--ease-out); }
@keyframes boop{ 40%{ transform:translateY(-3px) scale(1.06, .94); } }

/* ── Who's watching ── */
.avatar{ display:inline-flex; align-items:center; gap:8px; height:44px; padding:0 10px 0 0; border-radius:999px; border:var(--bw) solid var(--line); cursor:pointer; background:var(--panel); font-family:var(--font-read); font-weight:700; font-size:15px; flex:none; }
.avatar:hover, .avatar[aria-expanded="true"]{ border-color:var(--accent); }
.pic{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(140deg, var(--g1), var(--g2)); color:#13100c; font-family:var(--font-px); font-size:18px; flex:none; }
.pic svg{ width:22px; height:22px; color:#13100c; }
.avatar .pic.swap{ animation:picswap 520ms var(--ease-spring); }
@keyframes picswap{ from{ transform:scale(.4) rotate(-90deg); opacity:0; } }
.who{ position:fixed; z-index:320; top:calc(var(--mockh) + var(--toph) + 8px); right:20px; width:440px; max-width:calc(100% - 32px); background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--r-tile); box-shadow:var(--lift-peek); padding:18px; animation:whoin var(--d-med) var(--ease-spring) both; }
@keyframes whoin{ from{ opacity:0; transform:translateY(-10px) scale(.97); } }
.who h2{ margin:0; font-family:var(--font-px); font-weight:400; font-size:22px; letter-spacing:.02em; }
.who .sub{ margin:2px 0 14px; font-family:var(--font-read); color:var(--muted); font-size:14.5px; }
.people{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
.person{ position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 6px 12px; min-height:44px; border-radius:var(--r-card); border:var(--bw) solid var(--line); background:var(--nested); box-shadow:var(--lift-btn); cursor:pointer; font-family:var(--font-read); text-align:center; transition:transform var(--d-small) var(--ease), border-color var(--d-small), box-shadow var(--d-small); }
.person:hover{ transform:translate(-2px,-2px); border-color:var(--accent); box-shadow:var(--lift); }
.person .pic{ width:64px; height:64px; font-size:28px; transition:transform var(--d-med) var(--ease-spring); }
.person .pic svg{ width:32px; height:32px; }
.person:hover .pic{ transform:scale(1.06) rotate(-4deg); }
.person b{ font-size:16px; }
.person small{ font-size:12.5px; color:var(--muted); line-height:1.25; }
.person[aria-current="true"]{ border-color:var(--accent); background:var(--accent-soft); }
.person .now{ position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-family:var(--font-read); font-weight:700; font-size:11.5px; padding:0 8px; border-radius:999px; background:var(--accent); color:var(--accent-ink); white-space:nowrap; }
.person .lk{ display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--dim); }
.person .lk svg{ width:13px; height:13px; }
.who .foot{ display:flex; align-items:center; gap:10px; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); font-family:var(--font-read); font-size:13.5px; color:var(--muted); }
.who .foot svg{ color:var(--accent); }
.pin{ text-align:center; font-family:var(--font-read); }
.pin .pic{ width:56px; height:56px; margin:4px auto 8px; font-size:24px; }
.pin h3{ margin:0; font-family:var(--font-px); font-weight:400; font-size:19px; }
.pin p{ margin:2px 0 10px; color:var(--muted); font-size:13.5px; }
.dots{ display:flex; justify-content:center; gap:12px; margin:6px 0 14px; }
.dots i{ width:16px; height:16px; border-radius:50%; border:2px solid var(--line); transition:background var(--d-micro), border-color var(--d-micro), transform var(--d-small) var(--ease-spring); }
.dots i.on{ background:var(--accent); border-color:var(--accent); transform:scale(1.12); }
.dots.ok i{ background:var(--ok); border-color:var(--ok); }
.pad{ display:grid; grid-template-columns:repeat(3, 64px); gap:8px; justify-content:center; }
.pad button{ height:52px; border-radius:var(--r-ctl); border:var(--bw) solid var(--line); background:var(--nested); box-shadow:var(--lift-btn); font-family:var(--font-px); font-size:20px; cursor:pointer; display:grid; place-items:center; }
.pad button:hover{ border-color:var(--accent); }
.pad button:active{ transform:translate(2px,2px); box-shadow:none; }
.pin .back{ margin-top:12px; }
.scrim{ position:fixed; inset:0; z-index:310; background:rgba(8,6,4,.35); animation:fadein var(--d-small) linear both; }
@keyframes fadein{ from{ opacity:0; } }

/* ── Buttons & chips ── */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:48px; padding:0 20px; border-radius:var(--r-ctl); border:var(--bw) solid var(--line); background:var(--panel); box-shadow:var(--lift-btn); font-family:var(--font-px); font-size:16px; letter-spacing:.05em; cursor:pointer; text-decoration:none; transition:transform var(--d-micro) var(--ease), border-color var(--d-micro), box-shadow var(--d-micro); white-space:nowrap; color:var(--text); }
.btn:hover{ border-color:var(--accent); transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--shadow-c); }
.btn:active{ transform:translate(2px,2px); box-shadow:none; }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.primary:hover{ border-color:var(--text); }
.btn.sm{ min-height:44px; padding:0 14px; font-size:14.5px; gap:8px; }
.btn.ghost{ background:transparent; box-shadow:none; }
.btn.glass{ background:rgba(19,16,12,.45); border-color:rgba(246,240,228,.45); color:var(--on-img); backdrop-filter:blur(6px); box-shadow:none; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:2px 10px 2px 8px; border-radius:999px; border:var(--bw) solid currentColor; font-family:var(--font-read); font-weight:700; font-size:13px; line-height:1.4; white-space:nowrap; }
.chip svg{ width:14px; height:14px; }
.chip.ok{ color:var(--ok); background:var(--ok-soft); }
.chip.num{ color:var(--num); background:var(--num-soft); }
.chip.hot{ color:var(--accent); background:var(--accent-soft); }
.chip.mute{ color:var(--muted); background:var(--nested); }

/* NutBot */
.nb{ display:inline-block; flex:none; }
.nb.blink .eyes{ animation:blink 4.5s infinite; transform-origin:50% 45%; }
@keyframes blink{ 0%,94%,100%{ transform:scaleY(1); } 96%{ transform:scaleY(.1); } }
.nb.hop{ animation:hop .6s var(--ease) 1; }
@keyframes hop{ 30%{ transform:translateY(-8px) rotate(-4deg); } 60%{ transform:translateY(0) rotate(2deg); } }

/* ════════ Library page ════════ */
.head{ display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:14px; }
.head h1{ margin:0; font-family:var(--font-px); font-weight:400; font-size:34px; line-height:1.05; letter-spacing:.02em; }
.head .lede{ margin:4px 0 0; font-family:var(--font-read); color:var(--muted); font-size:15px; }
.head .lede b{ color:var(--text); }
.seg{ display:inline-flex; gap:4px; padding:4px; border-radius:calc(var(--r-ctl) + 4px); border:var(--bw) solid var(--line); background:var(--nested); }
.seg button{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 14px; border-radius:var(--r-ctl); border:var(--bw) solid transparent; background:none; cursor:pointer; font-family:var(--font-read); font-weight:700; font-size:14.5px; color:var(--muted); white-space:nowrap; transition:color var(--d-micro), background var(--d-micro); }
.seg button:hover{ color:var(--text); }
.seg button small{ font-family:var(--font-mono); font-weight:400; font-size:12px; color:var(--num); }
.seg button[aria-pressed="true"]{ background:var(--panel); border-color:var(--line); color:var(--text); box-shadow:var(--lift-btn); }
.seg button[aria-pressed="true"] svg{ color:var(--accent); }
.libtabs{ margin-left:auto; }

/* NutBot says, with the one accent action: Surprise me */
.bot{ display:flex; align-items:center; gap:14px; padding:8px 12px; margin-bottom:14px; border-radius:var(--r-tile); border:var(--bw) solid var(--line); background:radial-gradient(120% 160% at 0% 0%, var(--accent-soft), var(--panel) 55%); box-shadow:var(--lift); }
.bot .say{ flex:1; min-width:0; font-family:var(--font-read); font-size:16px; line-height:1.4; }
.bot .say b{ color:var(--accent); }
.bot .say small{ display:block; font-family:var(--font-px); font-size:12.5px; letter-spacing:.05em; color:var(--dim); }
.bot .say .ln{ display:block; }
.bot .say .ln.swap{ animation:lnin var(--d-large) var(--ease-out) both; }
@keyframes lnin{ from{ opacity:0; transform:translateY(6px); } }
.bot .acts{ display:flex; gap:10px; flex:none; }

/* the mixing desk */
.deskwrap{ margin-bottom:14px; }
.desk{ display:flex; flex-wrap:wrap; gap:12px 22px; padding:12px 14px 14px; border-radius:var(--r-tile); border:var(--bw) solid var(--line); background:var(--panel); box-shadow:var(--lift); }
.desk.folded{ display:none; }
.chan{ flex:1 1 auto; min-width:0; border:0; margin:0; padding:0; }
.chan.wide{ flex-basis:560px; }
.chan legend{ display:flex; align-items:center; gap:6px; padding:0 0 8px; font-family:var(--font-px); font-size:13.5px; letter-spacing:.06em; color:var(--muted); }
.chan legend svg{ width:16px; height:16px; color:var(--accent); }
.chan legend .one{ font-family:var(--font-read); font-size:11.5px; color:var(--dim); letter-spacing:0; }
.keys{ display:flex; flex-wrap:wrap; gap:7px; }
.keys .key{ flex:1 1 auto; }
.key{ position:relative; display:flex; align-items:center; gap:10px; min-height:46px; padding:6px 12px 6px 28px; white-space:nowrap; border-radius:var(--r-ctl); border:var(--bw) solid var(--line); background:var(--nested); box-shadow:var(--lift-btn); cursor:pointer; text-align:left; font-family:var(--font-read); font-weight:700; font-size:14.5px; line-height:1.15; color:var(--text);
  transition:transform var(--d-micro) var(--ease), box-shadow var(--d-micro), border-color var(--d-micro), background var(--d-small); }
.key::before{ content:''; position:absolute; left:10px; top:50%; width:8px; height:8px; margin-top:-4px; border-radius:50%; background:color-mix(in srgb, var(--line) 70%, var(--panel)); transition:background var(--d-small), box-shadow var(--d-small); }
.key:hover{ border-color:var(--accent); }
.key span{ flex:1; min-width:0; }
.key .n{ flex:none; font-family:var(--font-mono); font-weight:400; font-size:12.5px; color:var(--num); min-width:2ch; text-align:right; }
.key[aria-pressed="true"]{ transform:translate(2px,2px); box-shadow:none; border-color:var(--accent); background:var(--accent-soft); }
.key[aria-pressed="true"]::before{ background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent), 0 0 10px var(--accent); }
.key.zero:not([aria-pressed="true"]){ color:var(--dim); }
.key.zero .n{ color:var(--dim); }
.key .n.bump{ animation:bump var(--d-med) var(--ease-out); }
@keyframes bump{ 40%{ transform:translateY(-3px); color:var(--accent); } }

/* sticky summary: what is on, how it is ordered, how it looks */
.sum{ position:sticky; top:calc(var(--mockh) + var(--toph)); z-index:40; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; min-height:var(--sumh); padding:9px 0; margin-bottom:10px; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-bottom:1px dashed var(--line); }
.count{ font-family:var(--font-read); font-size:16px; white-space:nowrap; }
.count b{ font-family:var(--font-px); font-weight:400; font-size:24px; color:var(--accent); margin-right:4px; vertical-align:-2px; }
.actv{ display:flex; gap:6px; flex-wrap:wrap; flex:1 1 200px; min-width:0; }
.actv button{ display:inline-flex; align-items:center; gap:4px; min-height:44px; padding:0 8px 0 12px; border-radius:999px; border:var(--bw) solid var(--accent); background:var(--accent-soft); font-family:var(--font-read); font-weight:700; font-size:14px; cursor:pointer; animation:chipin var(--d-med) var(--ease-spring) both; }
.actv button svg{ width:16px; height:16px; color:var(--accent); }
.actv button:hover{ border-color:var(--text); }
@keyframes chipin{ from{ opacity:0; transform:scale(.8); } }
.actv .clear{ border-style:dashed; border-color:var(--line); background:none; padding:0 12px; color:var(--muted); }
.actv .none{ font-family:var(--font-read); color:var(--dim); font-size:14px; align-self:center; }
.ctlrow{ display:flex; gap:10px; align-items:center; margin-left:auto; }
.ctlrow .lbl{ font-family:var(--font-px); font-size:12.5px; letter-spacing:.06em; color:var(--dim); }
.order button{ padding:0 10px; font-size:13.5px; }
.views button{ width:44px; padding:0; }
.filterbtn{ display:none; }

/* results */
.resw{ display:grid; grid-template-columns:minmax(0,1fr) 40px; gap:12px; }
.resw.norail{ grid-template-columns:minmax(0,1fr); }
.resw.norail .rail{ display:none; }
.res{ position:relative; min-width:0; align-self:start; align-content:start; }
.res.v-posters{ display:grid; grid-template-columns:repeat(auto-fill, minmax(154px, 1fr)); gap:22px 16px; }
.res.v-wall{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
.res.v-list{ display:flex; flex-direction:column; gap:8px; }
.res.v-shelves, .res.v-progress{ display:flex; flex-direction:column; gap:14px; }
.res.v-progress{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; }
.res > *{ scroll-margin-top:calc(var(--mockh) + var(--toph) + var(--sumh) + 14px); min-width:0; }
.res > .xghost{ pointer-events:none; z-index:0; }

.card .hit{ display:block; text-decoration:none; border-radius:var(--r-card); }
.card .art{ display:block; position:relative; overflow:hidden; border-radius:var(--r-card); border:var(--bw) solid var(--line); box-shadow:var(--lift-btn); width:auto; height:auto; place-items:initial; background-color:transparent; transition:transform var(--d-small) var(--ease), box-shadow var(--d-small), border-color var(--d-small); }
.card .art img{ width:100%; height:100%; object-fit:cover; }
.card .hit:hover .art, .card .hit:focus-visible .art{ transform:translate(-3px,-3px); box-shadow:var(--lift-hi); border-color:var(--accent); }
.card .hit:focus-visible{ outline-offset:4px; }
.v-posters .card .art{ aspect-ratio:2/3; }
.cap{ display:block; padding:8px 2px 0; font-family:var(--font-read); }
.cap b{ display:block; font-size:14.5px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cap small{ display:block; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bdg{ position:absolute; z-index:2; top:7px; display:flex; gap:4px; }
.bdg.l{ left:7px; } .bdg.r{ right:7px; }
.bdg i{ font-style:normal; font-family:var(--font-read); font-weight:700; font-size:11.5px; line-height:19px; padding:0 7px; border-radius:999px; background:var(--accent); color:#13100c; box-shadow:1px 1px 0 rgba(0,0,0,.5); }
.bdg i.k{ background:#13100c; color:#f6f0e4; border:1px solid rgba(246,240,228,.6); }
.bdg i.s{ display:grid; place-items:center; width:24px; height:24px; padding:0; border-radius:50%; background:#7ccf8c; }
.bdg i.s svg{ width:15px; height:15px; color:#13100c; stroke-width:3; }
.pbar{ position:absolute; z-index:2; left:8px; right:8px; bottom:8px; height:5px; border-radius:3px; background:rgba(255,255,255,.28); overflow:hidden; }
.pbar i{ display:block; height:100%; background:var(--accent); border-radius:3px; }
.card.seen .art img{ filter:saturate(.75); }
/* wall of backdrops */
.v-wall .card .art{ aspect-ratio:16/9; }
.v-wall .card .hit, .card{ position:relative; }
.v-wall .card .art::after{ content:''; position:absolute; inset:35% 0 0; z-index:1; background:linear-gradient(0deg, rgba(10,8,6,.9), transparent); }
.v-wall .cap{ position:absolute; z-index:2; left:12px; right:12px; bottom:10px; padding:0; color:var(--on-img); }
.v-wall .cap b{ font-family:var(--font-px); font-weight:400; font-size:19px; text-shadow:0 1px 3px #000; }
.v-wall .cap small{ color:var(--on-img-dim); }
.v-wall .pbar{ bottom:auto; top:auto; left:0; right:0; bottom:0; border-radius:0; height:4px; }
.v-wall .card .ph[data-t]::before{ display:none; }
/* list with details */
.v-list .card{ display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:14px; padding:8px 12px 8px 8px; border-radius:var(--r-card); border:var(--bw) solid var(--line); background:var(--panel); }
.v-list .card:hover{ border-color:color-mix(in srgb, var(--accent) 60%, var(--line)); }
.v-list .card .hit{ display:grid; grid-template-columns:60px minmax(0,1fr); gap:14px; align-items:center; }
.v-list .card .art{ width:60px; aspect-ratio:2/3; box-shadow:none; }
.v-list .card .ph[data-t]::before{ font-size:0; }
.v-list .cap{ padding:0; }
.v-list .cap b{ font-size:16px; white-space:normal; }
.v-list .ov{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-family:var(--font-read); font-size:14px; color:var(--muted); margin-top:2px; max-width:760px; }
.v-list .card .bdg, .v-list .card .pbar{ display:none; }
.lr{ display:flex; align-items:center; gap:10px; }
.ov, .lr{ display:none; }
.v-list .lr{ display:flex; }
.v-list .lr .rt{ font-family:var(--font-mono); font-size:13px; color:var(--num); white-space:nowrap; }
.mini{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-read); font-size:13px; color:var(--muted); white-space:nowrap; }
.mini .prog{ width:60px; height:5px; border-radius:3px; background:var(--raise); overflow:hidden; }
.mini .prog i{ display:block; height:100%; background:var(--accent); }
/* letter cards between groups when ordered A to Z */
.lettr{ display:flex; align-items:flex-end; justify-content:flex-start; font-family:var(--font-px); color:var(--accent); }
.v-posters .lettr{ aspect-ratio:2/3; align-items:center; justify-content:center; font-size:76px; border-radius:var(--r-card); border:var(--bw) dashed color-mix(in srgb, var(--accent) 55%, var(--line)); background:repeating-linear-gradient(135deg, var(--accent-soft) 0 10px, transparent 10px 20px); }
.v-wall .lettr{ aspect-ratio:16/9; align-items:center; justify-content:center; font-size:64px; border-radius:var(--r-card); border:var(--bw) dashed color-mix(in srgb, var(--accent) 55%, var(--line)); background:repeating-linear-gradient(135deg, var(--accent-soft) 0 10px, transparent 10px 20px); }
.v-list .lettr{ font-size:26px; padding:10px 4px 0; border-bottom:1px dashed var(--line); }
.lettr small{ font-family:var(--font-read); font-weight:700; font-size:13px; color:var(--muted); margin-left:8px; }
.v-posters .lettr small, .v-wall .lettr small{ display:none; }

/* shelf by collection */
.shelf{ padding:14px 16px 16px; border-radius:var(--r-tile); border:var(--bw) solid var(--line); background:var(--panel); box-shadow:var(--lift); }
.shelf header{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.shelf h2{ margin:0; font-family:var(--font-px); font-weight:400; font-size:21px; letter-spacing:.02em; }
.shelf header .meta{ font-family:var(--font-read); font-size:14px; color:var(--muted); }
.shelf header .meta b{ color:var(--text); }
.shelf .sprog{ width:120px; height:6px; border-radius:3px; background:var(--raise); overflow:hidden; }
.shelf .sprog i{ display:block; height:100%; background:var(--ok); }
.shelf header .btn{ margin-left:auto; }
.row{ display:flex; gap:14px; overflow-x:auto; padding:2px 4px 10px; margin:0 -4px; scroll-snap-type:x proximity; scrollbar-width:thin; }
.row .card{ flex:none; width:136px; scroll-snap-align:start; }
.row .card .art{ aspect-ratio:2/3; }
.row .card .num{ position:absolute; z-index:2; left:7px; bottom:7px; font-family:var(--font-px); font-size:15px; line-height:22px; min-width:24px; text-align:center; border-radius:6px; background:rgba(19,16,12,.75); color:var(--on-img); border:1px solid rgba(246,240,228,.45); }
.row .card .pbar{ left:38px; }

/* Shows: progress board */
.lane{ grid-column:1 / -1; display:flex; align-items:baseline; gap:10px; padding:10px 2px 0; }
.lane h2{ margin:0; display:flex; align-items:center; gap:8px; font-family:var(--font-px); font-weight:400; font-size:20px; letter-spacing:.03em; }
.lane h2 svg{ color:var(--accent); }
.lane .n{ font-family:var(--font-mono); font-size:13px; color:var(--num); }
.lane p{ margin:0; font-family:var(--font-read); font-size:14px; color:var(--muted); }
.sc{ display:grid; grid-template-columns:210px minmax(0,1fr); gap:16px; padding:12px; border-radius:var(--r-tile); border:var(--bw) solid var(--line); background:var(--panel); box-shadow:var(--lift); transition:border-color var(--d-small); }
.sc:hover{ border-color:color-mix(in srgb, var(--accent) 60%, var(--line)); }
.sc .th{ position:relative; display:block; aspect-ratio:16/9; border-radius:var(--r-card); overflow:hidden; border:var(--bw) solid var(--line); align-self:start; transition:transform var(--d-small) var(--ease), border-color var(--d-small); }
.sc .th:hover, .sc .th:focus-visible{ transform:translate(-2px,-2px); border-color:var(--accent); }
.sc .th img{ width:100%; height:100%; object-fit:cover; }
.sc .th .lg{ position:absolute; z-index:2; left:8px; right:8px; bottom:7px; max-height:44%; width:auto; max-width:75%; object-fit:contain; object-position:left bottom; filter:drop-shadow(0 2px 4px rgba(0,0,0,.7)); }
.sc .th::after{ content:''; position:absolute; inset:45% 0 0; z-index:1; background:linear-gradient(0deg, rgba(10,8,6,.85), transparent); }
.sc .th .ph-t{ position:absolute; z-index:2; left:10px; bottom:8px; right:10px; font-family:var(--font-px); color:var(--on-img); font-size:16px; line-height:1.1; text-shadow:0 1px 3px #000; }
.sc .th.haslogo .ph-t{ display:none; }
.sc .bd{ min-width:0; display:flex; flex-direction:column; gap:6px; }
.sc .tt{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.sc h3{ margin:0; font-family:var(--font-read); font-size:17px; line-height:1.2; }
.sc h3 a{ text-decoration:none; }
.sc h3 a:hover{ color:var(--accent); }
.sc .nx{ margin:0; font-family:var(--font-read); font-size:14px; color:var(--muted); }
.sc .nx b{ color:var(--text); }
.sc .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:4px; }
.seasons{ display:flex; gap:4px; align-items:flex-start; }
.ssn{ flex:var(--eps) 1 0; min-width:18px; }
.ssn .bar{ position:relative; display:flex; gap:2px; height:10px; }
.ssn .bar i{ flex:1; border-radius:2px; background:var(--raise); }
.ssn .bar i.w{ background:var(--ok); }
.ssn .bar i.nw{ background:var(--accent); animation:nowdot 1.6s ease-in-out infinite; }
.ssn .bar i.cur{ background:var(--accent); }
.ssn .bar.fill{ display:block; border-radius:3px; background:var(--raise); overflow:hidden; }
.ssn .bar.fill b{ display:block; height:100%; background:var(--ok); }
.ssn small{ display:block; margin-top:3px; font-family:var(--font-mono); font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; }
.ssn.here small{ color:var(--accent); font-weight:600; }
@keyframes nowdot{ 50%{ opacity:.45; } }
/* compact season strip under posters / in rows */
.card .seasons{ margin-top:6px; }
.card .seasons small{ display:none; }
.card .ssn .bar{ height:6px; gap:1px; }
.v-wall .card .seasons{ position:absolute; z-index:2; left:12px; right:12px; top:10px; margin:0; }
.v-list .card .seasons{ max-width:420px; margin-top:6px; }
.v-list .card .seasons small{ display:block; }

/* A to Z scrubber */
.rail{ position:sticky; top:calc(var(--mockh) + var(--toph) + var(--sumh) + 8px); height:calc(var(--vph) - var(--mockh) - var(--toph) - var(--sumh) - 28px); max-height:720px; display:flex; flex-direction:column; align-items:stretch; padding:6px 0; border-radius:999px; border:var(--bw) solid var(--line); background:var(--panel); cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; }
.rail span{ flex:1; display:grid; place-items:center; font-family:var(--font-px); font-size:13px; line-height:1; color:var(--muted); min-height:0; transition:color var(--d-micro), transform var(--d-micro) var(--ease); }
.rail span.off{ color:color-mix(in srgb, var(--dim) 50%, transparent); }
.rail span.cur{ color:var(--accent); transform:scale(1.35); }
.rail:hover, .rail:focus-visible{ border-color:var(--accent); }
.rail:focus-visible{ outline-offset:2px; border-radius:999px; }
.bubble{ position:fixed; z-index:60; left:0; width:84px; height:84px; display:grid; place-items:center; border-radius:20px; background:var(--accent); color:var(--accent-ink); font-family:var(--font-px); font-size:50px; box-shadow:var(--lift-hi); pointer-events:none; opacity:0; transform:scale(.6); transition:opacity var(--d-small), transform var(--d-small) var(--ease-spring); }
.bubble.on{ opacity:1; transform:none; }

/* empty + loading */
.empty{ grid-column:1 / -1; display:flex; align-items:center; gap:18px; padding:28px; border-radius:var(--r-tile); border:var(--bw) dashed var(--line); background:var(--panel); font-family:var(--font-read); }
.empty h2{ margin:0 0 4px; font-family:var(--font-px); font-weight:400; font-size:21px; }
.empty p{ margin:0 0 12px; color:var(--muted); }
.empty .acts{ display:flex; gap:10px; flex-wrap:wrap; }
.sk{ border-radius:var(--r-card); background:linear-gradient(100deg, var(--panel) 30%, var(--raise) 50%, var(--panel) 70%); background-size:300% 100%; animation:shim 1.3s linear infinite; border:var(--bw) solid var(--line); }
.v-posters .sk{ aspect-ratio:2/3; }
@keyframes shim{ from{ background-position:100% 0; } to{ background-position:0 0; } }
.status{ grid-column:1 / -1; display:flex; align-items:center; gap:10px; font-family:var(--font-read); color:var(--muted); }

/* Surprise me */
.sup{ position:fixed; inset:0; z-index:340; display:grid; place-items:center; padding:16px; background:rgba(8,6,4,.72); backdrop-filter:blur(4px); animation:fadein var(--d-small) linear both; }
.sup .box{ position:relative; width:min(760px, 100%); max-height:calc(var(--vph) - 32px); overflow:auto; border-radius:20px; border:var(--bw) solid var(--line); background:var(--panel); box-shadow:var(--lift-peek); animation:supin var(--d-large) var(--ease-spring) both; }
@keyframes supin{ from{ opacity:0; transform:translateY(24px) scale(.96); } }
.sup .bdp{ position:relative; aspect-ratio:21/9; overflow:hidden; }
.sup .bdp img{ width:100%; height:100%; object-fit:cover; }
.sup .bdp::after{ content:''; position:absolute; inset:0; background:linear-gradient(0deg, var(--panel), transparent 65%); }
.reel{ position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; gap:14px; background:rgba(10,8,6,.5); }
.reel .ph{ width:96px; aspect-ratio:2/3; border-radius:10px; overflow:hidden; border:var(--bw) solid rgba(246,240,228,.4); box-shadow:3px 3px 0 #000; }
.reel .ph img{ width:100%; height:100%; object-fit:cover; }
.reel .ph:nth-child(2){ width:118px; border-color:var(--accent); }
.sup .in{ display:grid; grid-template-columns:130px minmax(0,1fr); gap:20px; padding:0 24px 24px; margin-top:-70px; position:relative; z-index:3; }
.sup .pst{ aspect-ratio:2/3; border-radius:12px; overflow:hidden; border:var(--bw) solid var(--line); box-shadow:var(--lift); }
.sup .pst img{ width:100%; height:100%; object-fit:cover; }
.sup .say{ display:flex; align-items:center; gap:10px; margin:52px 0 6px; font-family:var(--font-read); font-size:14.5px; color:var(--muted); }
.sup h2{ margin:0; font-family:var(--font-px); font-weight:400; font-size:30px; line-height:1.1; }
.sup .meta{ margin:4px 0 8px; font-family:var(--font-read); color:var(--muted); font-size:14.5px; }
.sup p.ov2{ margin:0 0 14px; font-family:var(--font-read); font-size:15px; }
.sup .acts{ display:flex; gap:10px; flex-wrap:wrap; }
.sup .x{ position:absolute; top:12px; right:12px; z-index:4; background:rgba(19,16,12,.55); border-color:rgba(246,240,228,.45); color:var(--on-img); }
.sup.rolling .in{ visibility:hidden; }

/* phone filter sheet */
.sheet-scrim{ position:fixed; inset:0; z-index:300; background:rgba(8,6,4,.55); animation:fadein var(--d-small) linear both; }
.sheet{ position:fixed; left:0; right:0; bottom:0; z-index:305; max-height:calc(var(--vph) - 56px); display:flex; flex-direction:column; background:var(--panel); border-top:var(--bw) solid var(--line); border-radius:20px 20px 0 0; box-shadow:0 -6px 0 var(--shadow-c); animation:sheetin var(--d-large) var(--ease-spring) both; }
@keyframes sheetin{ from{ transform:translateY(100%); } }
.sheet .grab{ width:44px; height:5px; border-radius:3px; background:var(--line); margin:8px auto 2px; }
.sheet header{ display:flex; align-items:center; gap:10px; padding:6px 16px 10px; border-bottom:1px dashed var(--line); }
.sheet header h2{ margin:0; font-family:var(--font-px); font-weight:400; font-size:21px; flex:1; }
.sheet .body{ overflow:auto; padding:14px 16px; display:flex; flex-direction:column; gap:16px; overscroll-behavior:contain; }
.sheet .body .desk{ display:flex; flex-direction:column; gap:16px; padding:0; border:0; background:none; box-shadow:none; }

/* toasts */

.toast.leaving{ animation:toastout 180ms var(--ease-in) both; }

.toast svg{ color:var(--ok); }
.toast button{ margin-left:auto; min-height:36px; padding:0 10px; border-radius:8px; border:var(--bw) solid var(--line); background:var(--nested); cursor:pointer; font-family:var(--font-read); font-weight:700; }

function filmState(m, p=who){
  const f = FIXED[p]?.[m.id];
  if (f !== undefined) return { seen:f>=1, prog:f>0 && f<1 ? f : 0 };
  if (daysAgo(m) <= 10) return { seen:false, prog:0 };
  const h = hash(p + m.id) % 100, fam = m.cert==='G' || m.cert==='PG';
  const seenCut = p==='home' ? (fam ? 62 : 8) : p==='ravi' ? (fam ? 6 : 30) : 36;
  if (h < seenCut) return { seen:true, prog:0 };
  if (h < seenCut + 5) return { seen:false, prog:(hash(m.id+p)%70 + 12)/100 };
  return { seen:false, prog:0 };
}
function showState(s, p=who){
  const x = SX[s.id], total = x.s.reduce((a,b)=>a+b,0), n = Math.min(total, SHOWPROG[p]?.[s.id] || 0);
  let lane = 'not';
  if (n >= total) lane = 'done';
  else if (n > 0 && x.air && x.nw && n >= total - x.nw) lane = 'new';
  else if (n > 0) lane = 'watching';
  let si = 0, cum = 0; while (si < x.s.length-1 && n >= cum + x.s[si]){ cum += x.s[si]; si++; }
  const next = n < total ? { s:si+1, e:n-cum+1 } : null;
  return { n, total, lane, next, x, left: total - n };
}

/* A to Z scrubber */
const LETTERS = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let present = new Set(), railIdx = 1;
function buildRail(list){
  present = new Set(list.map(m=>m.letter));
  const rail = $('#rail');
  if (!rail.children.length) rail.innerHTML = LETTERS.map(l=>`<span aria-hidden="true">${l}</span>`).join('');
  [...rail.children].forEach((s,i)=>s.classList.toggle('off', !present.has(LETTERS[i])));
}
function railJump(i, fromKey){
  i = Math.max(0, Math.min(LETTERS.length-1, i));
  /* snap to the nearest letter that has something */
  let j = i, d = 0;
  while (d < LETTERS.length){ if (present.has(LETTERS[i+d])) { j = i+d; break; } if (present.has(LETTERS[i-d])) { j = i-d; break; } d++; }
  railIdx = j;
  const L = LETTERS[j], rail = $('#rail');
  [...rail.children].forEach((s,k)=>s.classList.toggle('cur', k===j));
  rail.setAttribute('aria-valuenow', j); rail.setAttribute('aria-valuetext', `Letter ${L}`);
  if (S.order[S.page] !== 'az'){ S.order[S.page] = 'az'; render({ instant:true }); say('Ordered A to Z so you can jump by letter.'); }
  const target = $(`.lettr[data-letter="${CSS.escape(L)}"]`, res);
  if (target) target.scrollIntoView({ block:'start', behavior: (RM.matches || !fromKey) ? 'auto' : 'smooth' });
  const bub = $('#bubble'); bub.textContent = L;
  const r = rail.getBoundingClientRect(), y = r.top + (j+.5) * r.height/LETTERS.length;
  const bs = bub.offsetWidth || 84;
  bub.style.top = Math.max(r.top, Math.min(r.bottom-bs, y-bs/2)) + 'px'; bub.style.left = (r.left - bs - 14) + 'px';
  bub.classList.add('on'); clearTimeout(bub._t); bub._t = setTimeout(()=>bub.classList.remove('on'), 700);
}
(function railEvents(){
  const rail = $('#rail'); let drag = false;
  const at = y => { const r = rail.getBoundingClientRect(); return Math.floor((y - r.top) / r.height * LETTERS.length); };
  rail.addEventListener('pointerdown', e=>{ drag = true; rail.setPointerCapture(e.pointerId); railJump(at(e.clientY)); e.preventDefault(); });
  rail.addEventListener('pointermove', e=>{ if (drag) railJump(at(e.clientY)); });
  rail.addEventListener('pointerup', ()=>drag=false); rail.addEventListener('pointercancel', ()=>drag=false);
  rail.addEventListener('keydown', e=>{
    const step = { ArrowDown:1, ArrowRight:1, ArrowUp:-1, ArrowLeft:-1, PageDown:5, PageUp:-5 }[e.key];
    if (step){ e.preventDefault(); let i = railIdx + step; while (i>0 && i<LETTERS.length-1 && !present.has(LETTERS[i])) i += Math.sign(step); railJump(i, true); }
    else if (e.key==='Home'){ e.preventDefault(); railJump(0, true); }
    else if (e.key==='End'){ e.preventDefault(); railJump(LETTERS.length-1, true); }
    else if (/^[a-z#]$/i.test(e.key)){ e.preventDefault(); railJump(LETTERS.indexOf(e.key.toUpperCase()), true); }
  });
})();

function trap(e, box){
  if (e.key!=='Tab') return;

  if (!f.length) return;
  if (e.shiftKey && document.activeElement===f[0]){ e.preventDefault(); f.at(-1).focus(); }
  else if (!e.shiftKey && document.activeElement===f.at(-1)){ e.preventDefault(); f[0].focus(); }

$('#surprise').addEventListener('click', ()=>surprise());
async function surprise(again){
  let list = results();
  let onlyFresh = false;
  if (S.page==='movies'){ const fresh = list.filter(m=>!filmState(m).seen); if (fresh.length){ list = fresh; onlyFresh = true; } }
  else { const fresh = list.filter(s=>showState(s).lane!=='done'); if (fresh.length){ list = fresh; onlyFresh = true; } }
  if (!list.length){ toast('Nothing in your mix to pick from. Clear a switch first.', 'info'); return; }
  const pick = list[Math.floor(Math.random()*list.length)];
  let wrap = $('#sup');
  if (!wrap){
    wrap = document.createElement('div'); wrap.className = 'sup'; wrap.id = 'sup'; wrap.setAttribute('role','dialog'); wrap.setAttribute('aria-modal','true'); wrap.setAttribute('aria-labelledby','supT');
    document.body.append(wrap);
    const close = ()=>{ wrap.remove(); removeEventListener('keydown', k); $('#surprise').focus(); };
    const k = e=>{ if (e.key==='Escape') close(); trap(e, wrap); };
    wrap.addEventListener('click', e=>{ if (e.target===wrap || e.target.closest('[data-x]')) close(); if (e.target.closest('[data-again]')) surprise(true); });
    addEventListener('keydown', k);
  }
  const isShow = pick.t==='s', st = isShow ? showState(pick) : null, n = isShow ? nextEp(pick, st) : null;
  const total = list.length;
  const why = isShow
    ? (st.lane==='not' ? `Nobody here has started it. ${plural(st.total,'episode')}, about ${st.x.er} minutes each.` : !n ? `You've seen all ${st.total} episodes. Worth a rewatch from the start?` : `You're ${st.n} episodes in. ${n.label} is next.`)
    : `${pick.run<=95?'Short and easy.':pick.run>140?'A long one, so get comfy.':'Nice length for tonight.'} ${dur(pick.run)}, done by about ${clock(new Date(Date.now()+pick.run*6e4))}.`;
  wrap.classList.toggle('rolling', !RM.matches);
  wrap.innerHTML = `<div class="box">
    <button class="iconbtn x" type="button" data-x aria-label="Close">${ic('x')}</button>
    <div class="bdp ph" ${ph(pick.id)}><img src="${IMG(pick.id,'Backdrop',1280)}" alt="">${RM.matches?'':'<div class="reel" id="reel" aria-hidden="true"></div>'}</div>
    <div class="in">
      <div class="pst ph" ${ph(pick.id, pick.name)}><img src="${IMG(pick.id,'Primary',400)}" alt=""></div>
      <div>
        <div class="say">${nutbot(40,'happy','supbot')}<span>Picked from ${plural(total, isShow?'show':'film')} in your mix${onlyFresh ? (isShow?' you haven\'t finished':' you haven\'t seen') : ', all seen before'}.</span></div>
        <h2 id="supT">${esc(pick.name)}</h2>
        <p class="meta">${pick.year} · ${pick.cert==='None'?'Not rated':pick.cert} · ${pick.gl.slice(0,3).join(', ')} · ${pick.rating.toFixed(1)}</p>
        <p class="ov2">${why}</p>
        <div class="acts">
          <a class="btn primary" href="player.html">${ic('play')}${isShow ? (st.lane==='not' || !n ? 'Start episode 1' : 'Play '+n.short) : 'Play'}</a>
          <a class="btn" href="details.html?id=${pick.id}">Details</a>
          <button class="btn ghost" type="button" data-again>${ic('shuffle')}Another one</button>
        </div>
      </div>
    </div></div>`;
  say(`NutBot picked ${pick.name}.`);
  const reel = $('#reel', wrap);
  if (reel){
    const sample = () => list[Math.floor(Math.random()*list.length)];
    const cells = [0,1,2].map(()=>{ const d = document.createElement('div'); d.className = 'ph'; reel.append(d); return d; });
    for (let i=0; i<9; i++){
      cells.forEach(c=>{ const m = sample(); c.setAttribute('style', `--h:${hue(m.id)};--h2:${(hue(m.id)+55)%360}`); c.innerHTML = `<img src="${IMG(m.id,'Primary',200)}" alt="">`; });
      await sleep(70 + i*18);
    }
    cells[1].innerHTML = `<img src="${IMG(pick.id,'Primary',200)}" alt="">`;
    await sleep(260);
    reel.animate([{ opacity:1 }, { opacity:0 }], { duration:240, fill:'forwards' });
    await sleep(200); reel.remove();
    wrap.classList.remove('rolling');
  }
  ($('[data-again]', wrap) || $('[data-x]', wrap)).focus();
}

let act = -1;
const q = $('#q'), qres = $('#qres');
function runSearch(){
  const v = q.value.trim().toLowerCase();
  $('#search').classList.toggle('has', !!v);
  if (!v){ qres.hidden = true; q.setAttribute('aria-expanded','false'); return; }
  const hits = ALL.filter(x=>x.name.toLowerCase().includes(v) || x.gl.some(g=>g.toLowerCase().startsWith(v))).slice(0, 7);
  const mark = s => { const i = s.toLowerCase().indexOf(v); return i<0 ? esc(s) : esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+v.length))+'</mark>'+esc(s.slice(i+v.length)); };
  act = -1;
  qres.innerHTML = (hits.length ? hits.map((x,i)=>`<a id="qo${i}" role="option" href="details.html?id=${x.id}"><span class="ph" ${ph(x.id)}><img src="${IMG(x.id,'Primary',120)}" alt="" loading="lazy"></span><span><b>${mark(x.name)}</b><small>${x.t==='m'?'Film':'Show'} · ${x.year} · ${x.gl[0]}</small></span></a>`).join('') : `<div class="none">Nothing called "${esc(q.value)}" on the server yet.</div>`)
    + `<button type="button" class="askrow" role="option" id="qo${hits.length}" data-ask="${esc(q.value)}">${ic('ask')}Ask for "${esc(q.value)}"</button>`;
  qres.hidden = false; q.setAttribute('aria-expanded','true');
}
q.addEventListener('input', runSearch);
q.addEventListener('keydown', e=>{
  const opts = $$('[role="option"]', qres);
  if (e.key==='ArrowDown' || e.key==='ArrowUp'){
    if (!opts.length) return; e.preventDefault();
    act = (act + (e.key==='ArrowDown'?1:-1) + opts.length) % opts.length;
    opts.forEach((o,i)=>o.classList.toggle('act', i===act));
    q.setAttribute('aria-activedescendant', opts[act].id); opts[act].scrollIntoView({ block:'nearest' });
  } else if (e.key==='Enter'){ e.preventDefault(); const o = opts[act>=0?act:0]; if (o) o.click(); }
  else if (e.key==='Escape'){ if (q.value){ q.value=''; runSearch(); } else closeSearch(); }
});

/* ════════ Boot ════════ */
if (new URLSearchParams(location.search).has('frame')) document.documentElement.classList.add('framed');
const setVars = ()=>{
  const r = document.documentElement.style;
  r.setProperty('--mockh', ($('#mock').offsetHeight||0)+'px');
  r.setProperty('--vph', innerHeight+'px');
  r.setProperty('--sumh', ($('#sum').offsetHeight||62)+'px');
};
$('#logoBot').innerHTML = nutbot(38,'idle'); $('#railBot').innerHTML = nutbot(40,'idle');
$('#botFace').innerHTML = nutbot(46,'happy');
paintAvatar();
buildChrome();
const startTab = (location.hash||'').slice(1);
res.dataset.page = 'movies';
setVars();
if (['shows','4k','sets'].includes(startTab)) setTab(startTab);
else { render(); showLine(false); }
rotateLines();
addEventListener('resize', setVars);
new ResizeObserver(setVars).observe($('#sum'));
</script>
