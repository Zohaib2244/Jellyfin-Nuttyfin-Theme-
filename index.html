<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#13100c">
<title>Nuttyfin</title>
<link rel="icon" type="image/svg+xml" href="/src/assets/nuttyfin.svg">
<script>try{var d=document.documentElement,t=JSON.parse(localStorage.getItem('nutfin.theme')||'"auto"'),p=JSON.parse(localStorage.getItem('nutfin.palette')||'"ember"');if(t==='light'||t==='dark')d.dataset.theme=t;d.dataset.eff=t==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t;if(p&&p!=='ember')d.dataset.palette=p}catch(e){}</script>
</head>
<body data-bg="beam" data-shell="full">
<noscript>Nuttyfin needs JavaScript.</noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
